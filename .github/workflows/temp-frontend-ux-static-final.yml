          Path('docs/verification/frontend-static-audit-final-2026-09-12.md').write_text('''# Frontend Static Audit — Final Pre-Runtime Pass\n\nStatus: **CODE-SIDE PASS / RENDERED RUNTIME EVIDENCE PENDING**  \nDate: **2026-09-12**\n\nThis pass is the final repository-side UX hardening before the real local browser walkthrough. It does not claim rendered visual quality.\n\n## Surfaces audited\n\n- Ai chat and memory panel\n- global navigation/theme switching\n- Space page/block/core-memory workspace\n- Flow canvas, validation, versioning and run controls\n- Operations telemetry\n- Settings/runtime/credential/MCP controls\n- Ai proxy/evidence contract and local-only operator boundary\n\n## Defects fixed in this pass\n\n1. **Ai forget success had no local visible confirmation.** The memory panel now reports success/failure and disables all forget buttons while one request is active.\n2. **Space could keep the previous page document interactive while a newly selected page was loading.** Page selection now clears the old document synchronously and stale page/list/memory responses are ignored.\n3. **Space mutation buttons relied on async React state independently.** Owner-backed block/page/memory mutations are serialized with synchronous refs and mutation controls are disabled while one is in flight.\n4. **Flow could validate one draft revision and later display that validation after the draft changed.** Validation is revision-bound; stale validation is discarded.\n5. **Flow could run an older persisted version while the visible canvas had unsaved edits.** Dirty state now blocks Run until Save succeeds.\n6. **Flow save/load/run/approval/input actions had same-frame duplicate-event windows.** Synchronous in-flight guards now close those windows.\n7. **Flow loading a graph whose first node reused the current selected id could leave stale Config JSON in the inspector.** Load now refreshes the config draft explicitly.\n8. **Settings fields remained editable during writes, allowing a completing request to overwrite newer local edits (including clearing a newly typed credential).** Mutation-bound fields now lock during writes.\n9. **Settings MCP results could arrive for an older workspace after the visible workspace id changed.** Workspace loads are request-sequenced and identity-checked.\n10. **Mutable local model identity was technically visible but easy to misread as production-pinned.** Settings now displays an explicit warning for `:latest`/`@latest` aliases.\n11. **Operations had ambiguous blank sections when no service/trace rows existed.** Explicit empty states were added.\n12. **Mobile theme controls visually replace text with symbols.** Explicit accessible labels were added so hidden visual text does not reduce control naming.\n13. **UX inventory only smoke-checked route markers.** It now also requires global navigation on every surface, typed Ops/Space/Flow response shapes, a non-empty local model identity, and records whether that identity is a mutable alias.\n\n## Static security/safety findings\n\n- Hosted remains governed by the process-level cost kill switch; this pass does not enable Hosted.\n- Ai server-side proxy configuration keeps the internal token server-side.\n- Space embed URLs are already restricted by shared schema to HTTPS without inline credentials or fragments.\n- No new raw secret rendering or cross-owner DB path was added.\n\n## What this pass does not prove\n\nStatic source review and CI cannot prove pixel-level layout, browser console cleanliness, scroll behavior on the operator's device, local model interaction, or desktop/mobile visual quality. Those remain the runtime closure gate in `docs/ux-runtime-walkthrough-checklist.md`.\n''')

          Path('docs/ux-runtime-walkthrough-checklist.md').write_text('''# UX Runtime Walkthrough Checklist\n\nStatus: **READY / REQUIRES OPERATOR LAPTOP**\n\nRun only on synchronized clean `main` with `ECORIONE_COST_KILL_SWITCH=1` and the merged Phase 4 stack.\n\n## Preflight\n\n1. `git rev-parse HEAD` equals `git rev-parse origin/main`.\n2. `git status --short` is empty.\n3. restart `pnpm dev:phase4` from that revision; do not stop Temporal/PostgreSQL containers.\n4. run `pnpm evidence:ux:inventory`; stop on FAIL.\n5. open `http://127.0.0.1:3000` with browser devtools console visible.\n\n## Desktop walkthrough\n\n| ID | Action | PASS observation | Evidence |\n|---|---|---|---|\n| UX-01 | Use global nav Ai → Space → Flow → Operations → Settings → Ai | every surface reachable, correct active nav, no manual URL entry | one screenshot collage or per-surface screenshots |\n| UX-02 | Send one Local message: `Balas tepat: UX_LOCAL_OK` | waiting state appears once, one reply appears, route/model/cache/cost line visible, no duplicate turn | screenshot + console check |\n| UX-03 | Send second Local message: `Balas tepat: UX_CONTINUITY_OK` | same displayed session id remains; second reply appends to same thread | screenshot |\n| UX-04 | Inspect memory panel | core/recalled/episodic state is understandable and reflects returned data | screenshot |\n| UX-05 | If a disposable recalled fact exists, use Forget once | button enters pending state; success/failure appears visibly; no duplicate request | screenshot; otherwise NOT_EXERCISED |\n| UX-06 | Inspect route control and Settings | Local available; Hosted shown OFF/effectively disabled under kill switch | screenshot |\n| UX-07 | Operations: manual Refresh, toggle Auto 5s off/on | no overlapping refresh glitch; fleet/services/traces or explicit empty states remain understandable | screenshot |\n| UX-08 | Settings: run Local canary only | pending state visible, local provider/model result visible, Hosted remains OFF | screenshot |\n| UX-09 | Space: open two existing pages quickly; create disposable page only if desired | old document is not interactable while new page loads; no stale content swap; owner-backed actions give feedback | screenshot |\n| UX-10 | Flow: edit a draft after save/load | Run becomes unavailable while `unsaved changes` is visible; Validate ignores stale results if draft changes during request | screenshot |\n| UX-11 | Safe failure: invalid Space block JSON or invalid Flow config JSON | actionable visible error, app remains usable without full reload | screenshot |\n| UX-12 | repeat Ai + one management surface at narrow viewport ~390px | no page-level horizontal trap except intentional Flow canvas scroll; controls remain reachable | screenshots |\n\n## Browser console\n\nRecord console errors/warnings after each route. Framework/hydration/unhandled-promise errors are defects. Expected application-level request failures intentionally triggered for UX-11 must be distinguished from unhandled browser errors.\n\n## Defect ledger format\n\nFor every finding record: `ID | severity S0-S3 | route | exact steps | expected | observed | console evidence | disposition`. No S0/S1 may remain for closure; S2 must be fixed or explicitly accepted.\n\n## Minimum screenshots\n\n- desktop Ai before message;\n- desktop Ai after successful Local reply;\n- same-session second turn;\n- Space; Flow; Operations; Settings;\n- Settings Hosted OFF;\n- narrow/mobile Ai;\n- narrow/mobile one management surface.\n\nRaw screenshots stay local if they expose machine/user-specific details. Commit only sanitized findings.\n''')

