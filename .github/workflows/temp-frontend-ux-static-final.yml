name: TEMP Frontend UX Static Final

on:
  push:
    branches:
      - fix/frontend-ux-static-final-20260912

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/frontend-ux-static-final-20260912
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply final static UX hardening
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()
          def write(path, text):
              Path(path).write_text(text)
          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 target, found {count}")
              return text.replace(old, new, 1)

          # Chat: visible memory mutation feedback + truthful disabled state.
          p = Path('apps/ai/app/page.tsx')
          s = p.read_text()
          s = once(s,
          '  const [forgettingId, setForgettingId] = useState<string | null>(null);\n  const sendInFlightRef = useRef(false);',
          '  const [forgettingId, setForgettingId] = useState<string | null>(null);\n  const [memoryFeedback, setMemoryFeedback] = useState<{\n    kind: "success" | "error";\n    message: string;\n  } | null>(null);\n  const sendInFlightRef = useRef(false);',
          'chat feedback state')
          s = once(s,
          '    forgetInFlightRef.current = factId;\n    setForgettingId(factId);',
          '    forgetInFlightRef.current = factId;\n    setForgettingId(factId);\n    setMemoryFeedback(null);',
          'chat forget start')
          old = '''      if (!res.ok) {\n        setTurns((prev) => [\n          ...prev,\n          {\n            kind: "error",\n            id: nextTurnId(),\n            message: extractErrorMessage(body) ?? `Gagal melupakan fakta (${res.status}).`,\n          },\n        ]);\n        return;\n      }'''
          new = '''      if (!res.ok) {\n        const message = extractErrorMessage(body) ?? `Gagal melupakan fakta (${res.status}).`;\n        setMemoryFeedback({ kind: "error", message });\n        setTurns((prev) => [\n          ...prev,\n          {\n            kind: "error",\n            id: nextTurnId(),\n            message,\n          },\n        ]);\n        return;\n      }'''
          s = once(s, old, new, 'chat forget http error')
          s = once(s,
          '      setTurns((prev) =>\n        prev.map((t) =>',
          '      setMemoryFeedback({ kind: "success", message: "Fakta berhasil dilupakan." });\n      setTurns((prev) =>\n        prev.map((t) =>',
          'chat forget success')
          old = '''    } catch {\n      setTurns((prev) => [\n        ...prev,\n        {\n          kind: "error",\n          id: nextTurnId(),\n          message: "Tidak bisa menghubungi server untuk melupakan fakta.",\n        },\n      ]);\n    } finally {'''
          new = '''    } catch {\n      const message = "Tidak bisa menghubungi server untuk melupakan fakta.";\n      setMemoryFeedback({ kind: "error", message });\n      setTurns((prev) => [\n        ...prev,\n        {\n          kind: "error",\n          id: nextTurnId(),\n          message,\n        },\n      ]);\n    } finally {'''
          s = once(s, old, new, 'chat forget network error')
          s = once(s,
          '          <div className="ai-panel__title">Memori yang dipakai</div>\n          {latestAssistant === undefined ? (',
          '          <div className="ai-panel__title">Memori yang dipakai</div>\n          {memoryFeedback !== null ? (\n            <p\n              className={`ai-panel__feedback ai-panel__feedback--${memoryFeedback.kind}`}\n              role={memoryFeedback.kind === "error" ? "alert" : "status"}\n            >\n              {memoryFeedback.message}\n            </p>\n          ) : null}\n          {latestAssistant === undefined ? (',
          'chat feedback render')
          s = once(s,
          '                disabled={forgettingId === fact.id}\n              >\n                Lupakan',
          '                disabled={forgettingId !== null}\n              >\n                {forgettingId === fact.id ? "Melupakan…" : "Lupakan"}',
          'chat forget button')
          p.write_text(s)

          # Chat feedback styling.
          p = Path('apps/ai/app/globals.css')
          s = p.read_text()
          anchor = '''.ai-panel__title {\n  color: var(--text);\n  font-family: var(--font-display);\n  font-size: 18px;\n  letter-spacing: -0.01em;\n}\n'''
          addition = anchor + '''\n.ai-panel__feedback {\n  margin: -14px 0 0;\n  padding: 8px 0 8px 10px;\n  border-left: 1px solid var(--border);\n  color: var(--text-muted);\n  font-size: 10.5px;\n  line-height: 1.5;\n}\n\n.ai-panel__feedback--success {\n  border-left-color: var(--success);\n}\n\n.ai-panel__feedback--error {\n  border-left-color: var(--danger);\n  color: var(--text);\n  background: color-mix(in srgb, var(--danger) 7%, transparent);\n}\n'''
          s = once(s, anchor, addition, 'chat feedback css')
          p.write_text(s)

          # Space: suppress stale lists, clear stale document on navigation, and serialize mutations.
          p = Path('apps/ai/app/space/page.tsx')
          s = p.read_text()
          s = once(s,
          '  const createPageInFlightRef = useRef(false);\n  const selectedPageIdRef = useRef<string | null>(null);\n  const pageRequestRef = useRef(0);',
          '  const createPageInFlightRef = useRef(false);\n  const [pendingMutation, setPendingMutation] = useState<string | null>(null);\n  const mutationInFlightRef = useRef(false);\n  const selectedPageIdRef = useRef<string | null>(null);\n  const pageRequestRef = useRef(0);\n  const pagesRequestRef = useRef(0);\n  const memoryRequestRef = useRef(0);',
          'space mutation refs')
          anchor = '''  const selectedBlock = useMemo(\n    () => document?.blocks.find((block) => block.id === selectedBlockId) ?? null,\n    [document, selectedBlockId],\n  );\n'''
          addition = anchor + '''\n  function beginMutation(action: string): boolean {\n    if (createPageInFlightRef.current || mutationInFlightRef.current) return false;\n    mutationInFlightRef.current = true;\n    setPendingMutation(action);\n    return true;\n  }\n\n  function finishMutation(): void {\n    mutationInFlightRef.current = false;\n    setPendingMutation(null);\n  }\n\n  function selectPage(id: string): void {\n    if (selectedPageIdRef.current === id) return;\n    pageRequestRef.current += 1;\n    selectedPageIdRef.current = id;\n    setSelectedPageId(id);\n    setDocument(null);\n    setSelectedBlockId(null);\n    setDeleteConfirmId(null);\n    setResolution(null);\n    setRenaming(false);\n  }\n'''
          s = once(s, anchor, addition, 'space helpers')
          old = '''  const refreshPages = useCallback(async () => {\n    try {\n      const response = await fetch(`/api/space/pages?workspaceId=${WORKSPACE_ID}`, {\n        cache: "no-store",\n      });\n      const next = (await readJson<{ pages: SpacePage[] }>(response)).pages;\n      setPages(next);'''
          new = '''  const refreshPages = useCallback(async () => {\n    const requestId = ++pagesRequestRef.current;\n    try {\n      const response = await fetch(`/api/space/pages?workspaceId=${WORKSPACE_ID}`, {\n        cache: "no-store",\n      });\n      const next = (await readJson<{ pages: SpacePage[] }>(response)).pages;\n      if (requestId !== pagesRequestRef.current) return;\n      setPages(next);'''
          s = once(s, old, new, 'space pages sequence')
          s = once(s,
          '    } catch (err) {\n      setError(err instanceof Error ? err.message : String(err));\n    }\n  }, []);\n\n  const refreshMemory = useCallback(async () => {\n    try {',
          '    } catch (err) {\n      if (requestId === pagesRequestRef.current) {\n        setError(err instanceof Error ? err.message : String(err));\n      }\n    }\n  }, []);\n\n  const refreshMemory = useCallback(async () => {\n    const requestId = ++memoryRequestRef.current;\n    try {',
          'space pages catch and memory seq')
          s = once(s,
          '      setMemory(await readJson<CoreMemory>(response));\n    } catch (err) {\n      setError(err instanceof Error ? err.message : String(err));\n    }\n  }, []);',
          '      const next = await readJson<CoreMemory>(response);\n      if (requestId !== memoryRequestRef.current) return;\n      setMemory(next);\n    } catch (err) {\n      if (requestId === memoryRequestRef.current) {\n        setError(err instanceof Error ? err.message : String(err));\n      }\n    }\n  }, []);',
          'space memory sequence')
          s = once(s,
          '    if (newPageTitle.trim().length === 0 || createPageInFlightRef.current) return;',
          '    if (\n      newPageTitle.trim().length === 0 ||\n      createPageInFlightRef.current ||\n      mutationInFlightRef.current\n    )\n      return;',
          'space create guard')
          s = once(s,
          '      await refreshPages();\n      setSelectedPageId(page.id);',
          '      await refreshPages();\n      selectPage(page.id);',
          'space create select')

          # Serialize mutation handlers with finally cleanup.
          for label, old_start, new_start in [
              ('space add block', '  async function addBlock() {\n    if (document === null) return;\n    try {', '  async function addBlock() {\n    if (document === null || !beginMutation("add-block")) return;\n    try {'),
              ('space save block', '  async function saveBlock() {\n    if (document === null || selectedBlock === null) return;\n    try {', '  async function saveBlock() {\n    if (document === null || selectedBlock === null || !beginMutation("save-block")) return;\n    try {'),
              ('space delete block', '  async function deleteBlock(block: SpaceBlock) {\n    if (document === null) return;\n    try {', '  async function deleteBlock(block: SpaceBlock) {\n    if (document === null || !beginMutation("delete-block")) return;\n    try {'),
              ('space resolve block', '  async function resolveBlock() {\n    if (selectedBlock === null) return;\n    try {', '  async function resolveBlock() {\n    if (selectedBlock === null || !beginMutation("resolve-block")) return;\n    try {'),
          ]:
              s = once(s, old_start, new_start, label)

          # Add finally blocks to the four serialized handlers by their exact tails.
          replacements = [
              ('space add finally', '    } catch (err) {\n      setError(err instanceof Error ? err.message : String(err));\n    }\n  }\n\n  async function saveBlock()', '    } catch (err) {\n      setError(err instanceof Error ? err.message : String(err));\n    } finally {\n      finishMutation();\n    }\n  }\n\n  async function saveBlock()'),
              ('space save finally', '    } catch (err) {\n      setError(err instanceof Error ? err.message : String(err));\n    }\n  }\n\n  async function deleteBlock', '    } catch (err) {\n      setError(err instanceof Error ? err.message : String(err));\n    } finally {\n      finishMutation();\n    }\n  }\n\n  async function deleteBlock'),
              ('space delete finally', '    } catch (err) {\n      setError(err instanceof Error ? err.message : String(err));\n    }\n  }\n\n  async function moveBlock', '    } catch (err) {\n      setError(err instanceof Error ? err.message : String(err));\n    } finally {\n      finishMutation();\n    }\n  }\n\n  async function moveBlock'),
              ('space resolve finally', '    } catch (err) {\n      setError(err instanceof Error ? err.message : String(err));\n    }\n  }\n\n  async function renamePage', '    } catch (err) {\n      setError(err instanceof Error ? err.message : String(err));\n    } finally {\n      finishMutation();\n    }\n  }\n\n  async function renamePage'),
          ]
          for label, old, new in replacements:
              s = once(s, old, new, label)

          # Move has validation before locking.
          s = once(s,
          '    if (index < 0 || target < 0 || target >= document.blocks.length) return;\n    const blockIds = document.blocks.map((item) => item.id);',
          '    if (index < 0 || target < 0 || target >= document.blocks.length) return;\n    if (!beginMutation("move-block")) return;\n    const blockIds = document.blocks.map((item) => item.id);',
          'space move lock')
          s = once(s,
          '    } catch (err) {\n      setError(err instanceof Error ? err.message : String(err));\n    }\n  }\n\n  async function resolveBlock',
          '    } catch (err) {\n      setError(err instanceof Error ? err.message : String(err));\n    } finally {\n      finishMutation();\n    }\n  }\n\n  async function resolveBlock',
          'space move finally')

          # Rename and memory save locks.
          s = once(s,
          '    const title = renameDraft.trim();\n    if (title.length === 0) return;\n    try {',
          '    const title = renameDraft.trim();\n    if (title.length === 0 || !beginMutation("rename-page")) return;\n    try {',
          'space rename lock')
          s = once(s,
          '    } catch (err) {\n      setError(err instanceof Error ? err.message : String(err));\n    }\n  }\n\n  async function saveMemory',
          '    } catch (err) {\n      setError(err instanceof Error ? err.message : String(err));\n    } finally {\n      finishMutation();\n    }\n  }\n\n  async function saveMemory',
          'space rename finally')
          s = once(s,
          '  async function saveMemory(event: FormEvent) {\n    event.preventDefault();\n    try {',
          '  async function saveMemory(event: FormEvent) {\n    event.preventDefault();\n    if (!beginMutation("save-memory")) return;\n    try {',
          'space memory lock')
          s = once(s,
          '    } catch (err) {\n      setError(err instanceof Error ? err.message : String(err));\n    }\n  }\n\n  return (',
          '    } catch (err) {\n      setError(err instanceof Error ? err.message : String(err));\n    } finally {\n      finishMutation();\n    }\n  }\n\n  return (',
          'space memory finally')

          # Page navigation must clear old document synchronously.
          s = once(s,
          '                  onClick={() => setSelectedPageId(page.id)}',
          '                  onClick={() => selectPage(page.id)}',
          'space page selector')

          # Disable mutation surfaces while a mutation is in flight.
          s = s.replace('disabled={newPageTitle.trim().length === 0 || creatingPage}', 'disabled={newPageTitle.trim().length === 0 || creatingPage || pendingMutation !== null}', 1)
          s = once(s,
          '                  aria-pressed={page.id === selectedPageId}\n                >',
          '                  aria-pressed={page.id === selectedPageId}\n                  disabled={creatingPage || pendingMutation !== null}\n                >',
          'space page button disable')
          s = once(s,
          '                      aria-label="Page title"\n                      autoFocus',
          '                      aria-label="Page title"\n                      disabled={pendingMutation !== null}\n                      autoFocus',
          'space rename input disable')
          s = once(s,
          '                      disabled={renameDraft.trim().length === 0}',
          '                      disabled={renameDraft.trim().length === 0 || pendingMutation !== null}',
          'space rename save disable')
          s = once(s,
          '                    className={styles.button}\n                    onClick={() => setRenaming(true)}',
          '                    className={styles.button}\n                    disabled={pendingMutation !== null}\n                    onClick={() => setRenaming(true)}',
          'space rename button disable')
          s = once(s,
          '                            disabled={index === 0}',
          '                            disabled={index === 0 || pendingMutation !== null}',
          'space move up disable')
          s = once(s,
          '                            disabled={index === document.blocks.length - 1}',
          '                            disabled={index === document.blocks.length - 1 || pendingMutation !== null}',
          'space move down disable')
          s = once(s,
          '                            aria-label={\n                              deleteConfirmId === block.id',
          '                            disabled={pendingMutation !== null}\n                            aria-label={\n                              deleteConfirmId === block.id',
          'space delete disable')
          s = once(s,
          '                      onClick={() => chooseKind(kind)}\n                    >',
          '                      onClick={() => chooseKind(kind)}\n                      disabled={pendingMutation !== null}\n                    >',
          'space kind disable')
          s = once(s,
          '                  aria-label={`${draftKind} block JSON`}\n                />',
          '                  aria-label={`${draftKind} block JSON`}\n                  disabled={pendingMutation !== null}\n                />',
          'space draft disable')
          s = once(s,
          '                    className={styles.buttonPrimary}\n                    onClick={() => void addBlock()}',
          '                    className={styles.buttonPrimary}\n                    disabled={pendingMutation !== null}\n                    onClick={() => void addBlock()}',
          'space add disable')
          s = once(s,
          '                    aria-label="Selected block JSON"\n                  />',
          '                    aria-label="Selected block JSON"\n                    disabled={pendingMutation !== null}\n                  />',
          'space inspector disable')
          s = once(s,
          '                      className={styles.buttonPrimary}\n                      onClick={() => void saveBlock()}',
          '                      className={styles.buttonPrimary}\n                      disabled={pendingMutation !== null}\n                      onClick={() => void saveBlock()}',
          'space save button disable')
          s = once(s,
          '                      className={styles.button}\n                      onClick={() => void resolveBlock()}',
          '                      className={styles.button}\n                      disabled={pendingMutation !== null}\n                      onClick={() => void resolveBlock()}',
          'space resolve disable')
          s = once(s,
          '                <button type="submit" className={styles.buttonPrimary}>\n                  Save to Context',
          '                <button\n                  type="submit"\n                  className={styles.buttonPrimary}\n                  disabled={pendingMutation !== null}\n                >\n                  {pendingMutation === "save-memory" ? "Saving…" : "Save to Context"}',
          'space memory button disable')
          p.write_text(s)

          # Flow: dirty-state truth, stale validation suppression, sync request locks.
          p = Path('apps/ai/app/flow/page.tsx')
          s = p.read_text()
          # Existing validation clears are draft mutations; convert before helper insertion.
          s = s.replace('setValidation(null);', 'markDraftChanged();')
          s = once(s,
          '  const [validation, setValidation] = useState<FlowGraphValidationResult | null>(null);\n  const [busy, setBusy] = useState(false);\n  const [runStarting, setRunStarting] = useState(false);',
          '  const [validation, setValidation] = useState<FlowGraphValidationResult | null>(null);\n  const [dirty, setDirty] = useState(true);\n  const [busy, setBusy] = useState(false);\n  const [validating, setValidating] = useState(false);\n  const [runStarting, setRunStarting] = useState(false);',
          'flow state')
          s = once(s,
          '  const [humanDraft, setHumanDraft] = useState("");\n  const selected = nodes.find((node) => node.id === selectedId) ?? null;',
          '  const [humanDraft, setHumanDraft] = useState("");\n  const busyInFlightRef = useRef(false);\n  const validationInFlightRef = useRef(false);\n  const runInFlightRef = useRef(false);\n  const nodeActionInFlightRef = useRef(false);\n  const draftRevisionRef = useRef(0);\n  const selected = nodes.find((node) => node.id === selectedId) ?? null;',
          'flow refs')
          anchor = '''  const selected = nodes.find((node) => node.id === selectedId) ?? null;\n'''
          addition = anchor + '''\n  function markDraftChanged(): void {\n    draftRevisionRef.current += 1;\n    setDirty(true);\n    setValidation(null);\n  }\n\n  function beginBusy(): boolean {\n    if (busyInFlightRef.current) return false;\n    busyInFlightRef.current = true;\n    setBusy(true);\n    return true;\n  }\n\n  function finishBusy(): void {\n    busyInFlightRef.current = false;\n    setBusy(false);\n  }\n'''
          s = once(s, anchor, addition, 'flow helpers')
          # Moving a node changes the persisted graph but previously did not invalidate validation.
          s = once(s,
          '      setNodes((current) =>\n        current.map((node) => (node.id === moving ? { ...node, position: { x, y } } : node)),\n      );\n      return;',
          '      setNodes((current) =>\n        current.map((node) => (node.id === moving ? { ...node, position: { x, y } } : node)),\n      );\n      markDraftChanged();\n      return;',
          'flow drag dirty')
          # Validation must describe exactly the draft revision it checked.
          old = '''  async function validate(): Promise<FlowGraphValidationResult | null> {\n    const response = await fetch("/api/flow/graphs/validate", {\n      method: "POST",\n      headers: { "content-type": "application/json" },\n      body: JSON.stringify(graphDocument()),\n    });\n    const body = (await response.json().catch(() => null)) as FlowGraphValidationResult | null;\n    if (!response.ok || body === null) {\n      setMessage(errorMessage(body, `Validasi gagal (${response.status}).`));\n      return null;\n    }\n    setValidation(body);\n    setMessage(\n      body.valid ? "Graph valid dan compileable." : `${body.issues.length} masalah validasi.`,\n    );\n    return body;\n  }'''
          new = '''  async function validate(): Promise<FlowGraphValidationResult | null> {\n    if (validationInFlightRef.current) return null;\n    validationInFlightRef.current = true;\n    setValidating(true);\n    const revision = draftRevisionRef.current;\n    const snapshot = graphDocument();\n    try {\n      const response = await fetch("/api/flow/graphs/validate", {\n        method: "POST",\n        headers: { "content-type": "application/json" },\n        body: JSON.stringify(snapshot),\n      });\n      const body = (await response.json().catch(() => null)) as FlowGraphValidationResult | null;\n      if (!response.ok || body === null) {\n        setMessage(errorMessage(body, `Validasi gagal (${response.status}).`));\n        return null;\n      }\n      if (revision !== draftRevisionRef.current) {\n        setMessage("Draft berubah selama validasi. Validasi lama diabaikan; jalankan Validate lagi.");\n        return null;\n      }\n      setValidation(body);\n      setMessage(\n        body.valid ? "Graph valid dan compileable." : `${body.issues.length} masalah validasi.`,\n      );\n      return body;\n    } finally {\n      validationInFlightRef.current = false;\n      setValidating(false);\n    }\n  }'''
          s = once(s, old, new, 'flow validate')
          # Save is synchronously guarded and cannot silently overwrite edits made while awaiting server.
          s = once(s,
          '  async function save(): Promise<void> {\n    setBusy(true);\n    try {',
          '  async function save(): Promise<void> {\n    if (!beginBusy()) return;\n    const revision = draftRevisionRef.current;\n    const snapshot = graphDocument();\n    try {',
          'flow save begin')
          s = once(s,
          '          ? { ...graphDocument(), id: undefined }\n          : { ...graphDocument(), id: undefined, expectedVersion: version ?? 1 };',
          '          ? { ...snapshot, id: undefined }\n          : { ...snapshot, id: undefined, expectedVersion: version ?? 1 };',
          'flow save snapshot')
          old = '''      setVersion(body.version.version);\n      setNodes(body.version.graph.nodes);\n      setEdges(body.version.graph.edges);\n      setValidation(body.version.validation);\n      setMessage(\n        body.deduplicated\n          ? `Tidak ada perubahan — tetap v${body.version.version}.`\n          : `Tersimpan sebagai v${body.version.version}.`,\n      );'''
          new = '''      setVersion(body.version.version);\n      if (revision === draftRevisionRef.current) {\n        setNodes(body.version.graph.nodes);\n        setEdges(body.version.graph.edges);\n        setValidation(body.version.validation);\n        setDirty(false);\n        setMessage(\n          body.deduplicated\n            ? `Tidak ada perubahan — tetap v${body.version.version}.`\n            : `Tersimpan sebagai v${body.version.version}.`,\n        );\n      } else {\n        setValidation(null);\n        setDirty(true);\n        setMessage(\n          `v${body.version.version} tersimpan, tetapi draft berubah selama request. Simpan lagi sebelum Run.`,\n        );\n      }'''
          s = once(s, old, new, 'flow save response')
          s = once(s,
          '    } finally {\n      setBusy(false);\n    }\n  }\n  async function loadGraph',
          '    } finally {\n      finishBusy();\n    }\n  }\n  async function loadGraph',
          'flow save finish')
          # Load is synchronously guarded and refreshes config draft even when selected id is unchanged.
          s = once(s,
          '    if (clean.length === 0) return;\n    setBusy(true);\n    try {',
          '    if (clean.length === 0 || !beginBusy()) return;\n    try {',
          'flow load begin')
          s = once(s,
          '      setNodes(body.graph.nodes);\n      setEdges(body.graph.edges);\n      setSelectedId(body.graph.nodes[0]?.id ?? "");\n      setValidation(body.validation);',
          '      setNodes(body.graph.nodes);\n      setEdges(body.graph.edges);\n      const firstNode = body.graph.nodes[0] ?? null;\n      setSelectedId(firstNode?.id ?? "");\n      setConfigDraft(JSON.stringify(firstNode?.config ?? {}, null, 2));\n      draftRevisionRef.current += 1;\n      setDirty(false);\n      setValidation(body.validation);',
          'flow load config')
          s = once(s,
          '    } finally {\n      setBusy(false);\n    }\n  }\n  async function loadVersions',
          '    } finally {\n      finishBusy();\n    }\n  }\n  async function loadVersions',
          'flow load finish')
          # Running unsaved edits previously executed an older persisted version.
          s = once(s,
          '  async function runGraph(): Promise<void> {\n    if (runStarting) return;\n    if (graphId === null) {',
          '  async function runGraph(): Promise<void> {\n    if (runInFlightRef.current || runStarting) return;\n    if (graphId === null) {',
          'flow run guard')
          s = once(s,
          '      setMessage("Simpan graph sebelum Run.");\n      return;\n    }\n    setRunStarting(true);',
          '      setMessage("Simpan graph sebelum Run.");\n      return;\n    }\n    if (dirty) {\n      setMessage("Ada perubahan yang belum disimpan. Save dulu sebelum Run.");\n      return;\n    }\n    runInFlightRef.current = true;\n    setRunStarting(true);',
          'flow run dirty')
          s = once(s,
          '    } finally {\n      setRunStarting(false);\n    }\n  }\n  async function decide',
