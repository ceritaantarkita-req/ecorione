name: W15 Format Oracle 2

on:
  pull_request:

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier evals/agentic-cases.json evals/agentic-eval-core.mjs --write
          git diff -- evals/agentic-cases.json evals/agentic-eval-core.mjs
          exit 1