name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        env:
          ECORIONE_PHASE3_DOCKER_ACCEPTANCE: "1"
        run: pnpm run test

      - name: Phase 4 real-process acceptance
        env:
          ECORIONE_PHASE4_PROCESS_ACCEPTANCE: "1"
        run: pnpm run acceptance:phase4:process

      - name: Production operations acceptance
        run: pnpm run acceptance:production-ops

      - name: Secret scan
        run: pnpm run secret-scan

      - name: Production build
        run: pnpm run build

  secret-history:
    # W19 / audit 2026-09-14 S3-8: `secret-scan` hanya memeriksa working tree, jadi secret
    # yang pernah di-commit lalu dihapus tidak pernah tertangkap gerbang mana pun. Job
    # terpisah karena butuh riwayat penuh (`fetch-depth: 0`), sementara job `verify`
    # sengaja tetap memakai checkout dangkal supaya cepat.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Secret scan seluruh riwayat git
        run: node scripts/secret-history-scan.mjs

  naming:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Tidak ada penamaan "InMy" yang tersisa
        run: |
          if grep -rniE '\bInMy[A-Z]' \
              --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' \
              --include='*.json' --include='*.sql' --include='*.yml' --include='*.css' \
              --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git . \
              | grep -v 'naming-gate:allow' ; then
            echo "::error::Penamaan ekosistem lama ditemukan. Lihat AGENTS.md dan docs/prd.md §19."
            exit 1
          fi
          echo "Bersih."

      - name: Tidak ada alias model mutable (ADR-14)
        # Audit 2026-09-14 S2-4: pola lama mensyaratkan tanda hubung literal
        # (`"...-latest"`), sehingga alias gaya Ollama `"gemma4:latest"` tidak pernah
        # cocok dan lolos melewati setiap checkpoint evidence selama berminggu-minggu.
        # Sekarang `-`, `:`, `@`, `/`, dan bentuk telanjang `"latest"` semuanya
        # tertangkap, sejajar dengan MODEL_ALIAS_PATTERN di packages/shared-telemetry.
        run: |
          if grep -rnE '"[A-Za-z0-9._/-]*[-:@/]latest"|"latest"' \
              --include='*.ts' --include='*.tsx' --include='*.mjs' --include='*.json' \
              --include='*.yaml' --include='*.yml' \
              --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
              packages services apps 2>/dev/null \
              | grep -v 'naming-gate:allow' ; then
            echo "::error::Alias model terdeteksi. Pin versi eksplisit — lihat docs/adr/0014-*.md."
            exit 1
          fi
          echo "Bersih."
