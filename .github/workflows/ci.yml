name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        env:
          ECORIONE_PHASE3_DOCKER_ACCEPTANCE: "1"
        run: pnpm run test

      - name: Phase 4 real-process acceptance
        env:
          ECORIONE_PHASE4_PROCESS_ACCEPTANCE: "1"
        run: pnpm run acceptance:phase4:process

      - name: Production operations acceptance
        run: pnpm run acceptance:production-ops

      - name: Secret scan
        run: pnpm run secret-scan

      - name: Dependency policy review
        run: pnpm run dependency:review

      - name: GitHub Actions pin review
        run: pnpm run actions:pin-review

      - name: GitHub Actions runner review
        run: pnpm run actions:runner-review

      - name: Node toolchain review
        run: pnpm run toolchain:node-review

      - name: Installer toolchain review
        run: pnpm run toolchain:installer-review

      - name: Container image digest review
        run: pnpm run images:digest-review

      - name: Release security acceptance
        run: node scripts/release-security-acceptance.mjs

      - name: Production build
        run: pnpm run build

  secret-history:
    # W19 / audit 2026-09-14 S3-8: `secret-scan` hanya memeriksa working tree, jadi secret
    # yang pernah di-commit lalu dihapus tidak pernah tertangkap gerbang mana pun. Job
    # terpisah karena butuh riwayat penuh (`fetch-depth: 0`), sementara job `verify`
    # sengaja tetap memakai checkout dangkal supaya cepat.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".node-version"

      - name: Secret scan seluruh riwayat git
        run: node scripts/secret-history-scan.mjs

  naming:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Tidak ada penamaan "InMy" yang tersisa
        run: |
          if grep -rniE '\bInMy[A-Z]' \
              --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' \
              --include='*.json' --include='*.sql' --include='*.yml' --include='*.css' \
              --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git . \
              | grep -v 'naming-gate:allow' ; then
            echo "::error::Penamaan ekosistem lama ditemukan. Lihat AGENTS.md dan docs/prd.md §19."
            exit 1
          fi
          echo "Bersih."

      - name: Tidak ada alias model mutable (ADR-14)
        # Audit 2026-09-14 S2-4: pola lama mensyaratkan tanda hubung literal
        # (`"...-latest"`), sehingga alias gaya Ollama `"gemma4:latest"` tidak pernah
        # cocok dan lolos melewati setiap checkpoint evidence selama berminggu-minggu.
        # Sekarang `-`, `:`, `@`, `/`, dan bentuk telanjang `"latest"` semuanya
        # tertangkap, sejajar dengan MODEL_ALIAS_PATTERN di packages/shared-telemetry.
        run: |
          if grep -rnE '"[A-Za-z0-9._/-]*[-:@/]latest"|"latest"' \
              --include='*.ts' --include='*.tsx' --include='*.mjs' --include='*.json' \
              --include='*.yaml' --include='*.yml' \
              --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
              packages services apps 2>/dev/null \
              | grep -v 'naming-gate:allow' ; then
            echo "::error::Alias model terdeteksi. Pin versi eksplisit — lihat docs/adr/0014-*.md."
            exit 1
          fi
          echo "Bersih."

  cloud-project-memory-smoke:
    # Temporary, isolated, synthetic PR#467 CPU QA; removed after evidence.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 467
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      OLLAMA_VULKAN: "false"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_MODELS: ${{ runner.temp }}/project-memory-ollama-models
      ECORIONE_LOCAL_REASONING_EFFORT: "none"
      ECORIONE_LOCAL_MAX_TOKENS: "768"
      ECORIONE_LOCAL_TEMPERATURE: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".node-version"
          cache: pnpm
      - name: Prepare synthetic QA dependencies
        run: pnpm install --frozen-lockfile
      - name: Install checked Ollama binary into ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 2 --fail --location --silent --show-error \
            "https://github.com/ollama/ollama/releases/download/v0.34.0/ollama-linux-amd64.tar.zst" \
            -o "$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          echo "cf95886728959aa09910bb34de5cca1cc5a8f68003b5597197d3f2c2d57c0804  $RUNNER_TEMP/ollama-linux-amd64.tar.zst" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ollama"
          tar --zstd -xf "$RUNNER_TEMP/ollama-linux-amd64.tar.zst" -C "$RUNNER_TEMP/ollama"
          echo "$RUNNER_TEMP/ollama/bin" >> "$GITHUB_PATH"
      - name: Start CPU Ollama with small standalone test models
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ollama/bin/ollama" serve > "$RUNNER_TEMP/ollama-smoke.log" 2>&1 &
          for n in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS --max-time 3 http://127.0.0.1:11434/api/tags >/dev/null
          ollama --version
          ollama pull qwen3.5:0.8b
          ollama pull hermes3:3b
          ollama list
      - name: Execute isolated Project Memory model smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          echo "SYNTHETIC CLOUD CPU TEST ONLY - not Qwen 9B / Hermes 8B acceptance"
          node --import tsx scripts/project-memory-local-acceptance.mjs qwen3.5:0.8b hermes3:3b
