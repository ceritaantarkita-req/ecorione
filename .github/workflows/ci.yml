name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Canonical format
        run: pnpm run format
      - name: Commit generated lock and formatting
        run: |
          if git diff --quiet; then
            echo "No generated changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml packages services apps test tsconfig.json package.json
            git commit -m "Fase 4: canonical Temporal lockfile and formatting"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        env:
          ECORIONE_PHASE3_DOCKER_ACCEPTANCE: "1"
        run: pnpm run test
      - name: Secret scan
        run: pnpm run secret-scan
      - name: Production build
        run: pnpm run build

  naming:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Tidak ada penamaan "InMy" yang tersisa
        run: |
          if grep -rniE '\bInMy[A-Z]' --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' --include='*.json' --include='*.sql' --include='*.yml' --include='*.css' --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git . | grep -v 'naming-gate:allow' ; then
            exit 1
          fi
      - name: Tidak ada alias model `-latest` (ADR-14)
        run: |
          if grep -rnE '"[a-z0-9./-]+-latest"' --include='*.ts' --include='*.json' --include='*.yaml' --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git packages services apps 2>/dev/null | grep -v 'naming-gate:allow' ; then
            exit 1
          fi
