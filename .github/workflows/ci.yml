name: Format Probe W06

on:
  push:
    branches: [agent/format-probe-w06-20260914]

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write apps/ai/app/settings/page.tsx
          git diff -- apps/ai/app/settings/page.tsx
          test -z "$(git status --short -- apps/ai/app/settings/page.tsx)"
