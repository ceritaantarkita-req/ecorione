name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-fix:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/local-observability-baseline-20260911'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format observability files and push if needed
        run: |
          pnpm exec prettier --write \
            packages/shared-server/src/observability.ts \
            scripts/local-observability-evidence-lib.mjs \
            scripts/local-observability-evidence.mjs \
            test/local-observability-evidence.test.mjs
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/shared-server/src/observability.ts \
            scripts/local-observability-evidence-lib.mjs \
            scripts/local-observability-evidence.mjs \
            test/local-observability-evidence.test.mjs
          git commit -m "style: format local observability evidence"
          git push origin HEAD:${{ github.head_ref }}

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        env:
          ECORIONE_PHASE3_DOCKER_ACCEPTANCE: "1"
        run: pnpm run test

      - name: Phase 4 real-process acceptance
        env:
          ECORIONE_PHASE4_PROCESS_ACCEPTANCE: "1"
        run: pnpm run acceptance:phase4:process

      - name: Production operations acceptance
        run: pnpm run acceptance:production-ops

      - name: Secret scan
        run: pnpm run secret-scan

      - name: Production build
        run: pnpm run build

  naming:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Tidak ada penamaan "InMy" yang tersisa
        run: |
          if grep -rniE '\bInMy[A-Z]' \
              --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' \
              --include='*.json' --include='*.sql' --include='*.yml' --include='*.css' \
              --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git . \
              | grep -v 'naming-gate:allow' ; then
            echo "::error::Penamaan ekosistem lama ditemukan. Lihat AGENTS.md dan docs/prd.md §19."
            exit 1
          fi
          echo "Bersih."

      - name: Tidak ada alias model `-latest` (ADR-14)
        run: |
          if grep -rnE '"[a-z0-9./-]+-latest"' \
              --include='*.ts' --include='*.json' --include='*.yaml' \
              --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
              packages services apps 2>/dev/null \
              | grep -v 'naming-gate:allow' ; then
            echo "::error::Alias model terdeteksi. Pin versi eksplisit — lihat docs/adr/0014-*.md."
            exit 1
          fi
          echo "Bersih."
