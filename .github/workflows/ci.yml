name: Format Probe

on:
  push:
    branches: [agent/format-probe-20260914]

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write scripts/ecorione-engine.mjs test/ecorione-engine.test.mjs
          git diff -- scripts/ecorione-engine.mjs test/ecorione-engine.test.mjs
          test -z "$(git status --short -- scripts/ecorione-engine.mjs test/ecorione-engine.test.mjs)"
