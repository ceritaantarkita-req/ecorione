name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e08-digest-resolver:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
          - name: Resolve E08 container image digests
            shell: bash
            run: |
              set -euo pipefail
    
              resolve_digest() {
                local repository="$1"
                local tag="$2"
                local token
                local digest
    
                token="$(curl --fail --silent --show-error \
                  "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repository}:pull" \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
    
                digest="$(curl --fail --silent --show-error --head \
                  -H "Authorization: Bearer $token" \
                  -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
                  "https://registry-1.docker.io/v2/${repository}/manifests/${tag}" \
                  | tr -d '\r' \
                  | awk 'BEGIN {IGNORECASE=1} /^docker-content-digest:/ {print $2; exit}')"
    
                if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  echo "::error::Unable to resolve immutable digest for ${repository}:${tag}: ${digest}"
                  exit 1
                fi
                echo "ECORIONE_E08_IMAGE_DIGEST ${repository}:${tag} ${digest}"
              }
    
              resolve_digest "library/node" "22.20.0-bookworm-slim"
              resolve_digest "library/postgres" "17.6-alpine"
              resolve_digest "library/caddy" "2.11.4-alpine"
              resolve_digest "temporalio/auto-setup" "1.29.7"

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        env:
          ECORIONE_PHASE3_DOCKER_ACCEPTANCE: "1"
        run: pnpm run test

      - name: Phase 4 real-process acceptance
        env:
          ECORIONE_PHASE4_PROCESS_ACCEPTANCE: "1"
        run: pnpm run acceptance:phase4:process

      - name: Production operations acceptance
        run: pnpm run acceptance:production-ops

      - name: Secret scan
        run: pnpm run secret-scan

      - name: Dependency policy review
        run: pnpm run dependency:review

      - name: GitHub Actions pin review
        run: pnpm run actions:pin-review

      - name: GitHub Actions runner review
        run: pnpm run actions:runner-review

      - name: Node toolchain review
        run: pnpm run toolchain:node-review

      - name: Installer toolchain review
        run: pnpm run toolchain:installer-review

      - name: Release security acceptance
        run: node scripts/release-security-acceptance.mjs

      - name: Production build
        run: pnpm run build

  secret-history:
    # W19 / audit 2026-09-14 S3-8: `secret-scan` hanya memeriksa working tree, jadi secret
    # yang pernah di-commit lalu dihapus tidak pernah tertangkap gerbang mana pun. Job
    # terpisah karena butuh riwayat penuh (`fetch-depth: 0`), sementara job `verify`
    # sengaja tetap memakai checkout dangkal supaya cepat.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".node-version"

      - name: Secret scan seluruh riwayat git
        run: node scripts/secret-history-scan.mjs

  naming:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Tidak ada penamaan "InMy" yang tersisa
        run: |
          if grep -rniE '\bInMy[A-Z]' \
              --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' \
              --include='*.json' --include='*.sql' --include='*.yml' --include='*.css' \
              --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git . \
              | grep -v 'naming-gate:allow' ; then
            echo "::error::Penamaan ekosistem lama ditemukan. Lihat AGENTS.md dan docs/prd.md §19."
            exit 1
          fi
          echo "Bersih."

      - name: Tidak ada alias model mutable (ADR-14)
        # Audit 2026-09-14 S2-4: pola lama mensyaratkan tanda hubung literal
        # (`"...-latest"`), sehingga alias gaya Ollama `"gemma4:latest"` tidak pernah
        # cocok dan lolos melewati setiap checkpoint evidence selama berminggu-minggu.
        # Sekarang `-`, `:`, `@`, `/`, dan bentuk telanjang `"latest"` semuanya
        # tertangkap, sejajar dengan MODEL_ALIAS_PATTERN di packages/shared-telemetry.
        run: |
          if grep -rnE '"[A-Za-z0-9._/-]*[-:@/]latest"|"latest"' \
              --include='*.ts' --include='*.tsx' --include='*.mjs' --include='*.json' \
              --include='*.yaml' --include='*.yml' \
              --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
              packages services apps 2>/dev/null \
              | grep -v 'naming-gate:allow' ; then
            echo "::error::Alias model terdeteksi. Pin versi eksplisit — lihat docs/adr/0014-*.md."
            exit 1
          fi
          echo "Bersih."
