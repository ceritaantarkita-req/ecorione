name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply W13 immutable model identity candidate
        run: |
          node scripts/w13-run-candidate.mjs
          pnpm exec prettier \
            services/connect/src/local-model-identity.ts \
            services/connect/src/local-model-identity.test.ts \
            services/connect/src/local-model-runtime-settings.test.ts \
            services/connect/src/local-model-cache-identity.test.ts \
            services/connect/src/runtime-settings.ts \
            services/connect/src/main.ts \
            services/connect/src/complete.ts \
            services/connect/src/http.ts \
            apps/ai/app/settings/page.tsx \
            scripts/ecorione-engine.mjs \
            scripts/local-ux-product-evidence.mjs \
            test/ecorione-engine.test.mjs \
            test/local-ux-product-evidence.test.mjs \
            scripts/local-observability-evidence.mjs \
            scripts/local-observability-evidence-lib.mjs \
            test/local-observability-evidence.test.mjs \
            .env.example \
            docs/adr/0014-pinned-models.md \
            docs/active-work-plan.md \
            scripts/w13-materialize.mjs \
            scripts/w13-materialize-v2.mjs \
            scripts/w13-run-candidate.mjs \
            --write

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        env:
          ECORIONE_PHASE3_DOCKER_ACCEPTANCE: "1"
        run: pnpm run test

      - name: Phase 4 real-process acceptance
        env:
          ECORIONE_PHASE4_PROCESS_ACCEPTANCE: "1"
        run: pnpm run acceptance:phase4:process

      - name: Production operations acceptance
        run: pnpm run acceptance:production-ops

      - name: Secret scan
        run: pnpm run secret-scan

      - name: Production build
        run: pnpm run build

  naming:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Tidak ada penamaan "InMy" yang tersisa
        run: |
          if grep -rniE '\bInMy[A-Z]' \
              --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' \
              --include='*.json' --include='*.sql' --include='*.yml' --include='*.css' \
              --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git . \
              | grep -v 'naming-gate:allow' ; then
            echo "::error::Penamaan ekosistem lama ditemukan. Lihat AGENTS.md dan docs/prd.md §19."
            exit 1
          fi
          echo "Bersih."

      - name: Tidak ada alias model `-latest` (ADR-14)
        run: |
          if grep -rnE '"[a-z0-9./-]+-latest"' \
              --include='*.ts' --include='*.json' --include='*.yaml' \
              --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
              packages services apps 2>/dev/null \
              | grep -v 'naming-gate:allow' ; then
            echo "::error::Alias model terdeteksi. Pin versi eksplisit — lihat docs/adr/0014-*.md."
            exit 1
          fi
          echo "Bersih."

  finalize-w13:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/active-work-20260914'
    needs: [verify, naming]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/active-work-20260914
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Materialize verified W13 candidate
        run: |
          node scripts/w13-run-candidate.mjs
          pnpm exec prettier \
            services/connect/src/local-model-identity.ts \
            services/connect/src/local-model-identity.test.ts \
            services/connect/src/local-model-runtime-settings.test.ts \
            services/connect/src/local-model-cache-identity.test.ts \
            services/connect/src/runtime-settings.ts \
            services/connect/src/main.ts \
            services/connect/src/complete.ts \
            services/connect/src/http.ts \
            apps/ai/app/settings/page.tsx \
            scripts/ecorione-engine.mjs \
            scripts/local-ux-product-evidence.mjs \
            test/ecorione-engine.test.mjs \
            test/local-ux-product-evidence.test.mjs \
            scripts/local-observability-evidence.mjs \
            scripts/local-observability-evidence-lib.mjs \
            test/local-observability-evidence.test.mjs \
            .env.example \
            docs/adr/0014-pinned-models.md \
            docs/active-work-plan.md \
            --write
          rm scripts/w13-materialize.mjs scripts/w13-materialize-v2.mjs scripts/w13-run-candidate.mjs
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          test "$(git hash-object .github/workflows/ci.yml)" = "838ed8d288a6f4ef8ca560c8168bbf79d8122f9a"
          git diff --check

      - name: Commit verified W13 identity contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: pin local model identity for durable evidence"
          git push origin HEAD:agent/active-work-20260914
