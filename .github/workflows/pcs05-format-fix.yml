name: PCS-05 Format Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".node-version"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format PCS-05 files
        run: |
          pnpm exec prettier --write \
            apps/ai/app/flow/page.tsx \
            services/flow/src/graph-http.test.ts \
            services/flow/src/http.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/ai/app/flow/page.tsx \
            services/flow/src/graph-http.test.ts \
            services/flow/src/http.ts
          git commit -m "style(pcs): format Flow runtime closure changes"
          git push origin HEAD:${{ github.head_ref }}
