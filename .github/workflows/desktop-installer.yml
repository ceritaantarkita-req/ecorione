name: Desktop Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0"
        required: true
        default: "0.1.0"
        type: string
  pull_request:
    paths:
      - ".github/workflows/desktop-installer.yml"
      - ".inno-setup-version"
      - ".node-version"
      - "desktop/**"
      - "scripts/desktop-bundle.mjs"
      - "scripts/installer-toolchain-review.mjs"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

env:
  ECORIONE_VERSION: ${{ inputs.version || '0.1.0' }}

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate release version
        run: node -e "import('./scripts/desktop-bundle.mjs').then((m) => console.log(m.normalizeVersion(process.env.ECORIONE_VERSION)))"

      - name: Build desktop runtime bundle
        run: node scripts/desktop-bundle.mjs --version "$ECORIONE_VERSION"

      - name: Upload prepared desktop bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ecorione-desktop-bundle
          path: .ecorione/desktop-release/ECORIONE-${{ env.ECORIONE_VERSION }}-windows-x64
          if-no-files-found: error
          retention-days: 7

  installer:
    needs: bundle
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      ECORIONE_BUNDLE_DIR: ${{ github.workspace }}\\bundle
      ECORIONE_INSTALLER_OUT: ${{ github.workspace }}\\installer-out

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download prepared desktop bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ecorione-desktop-bundle
          path: bundle

      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $innoVersion = (Get-Content -LiteralPath ".inno-setup-version" -Raw).Trim()
          if ($innoVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid .inno-setup-version: $innoVersion"
          }
          choco install innosetup --version $innoVersion --yes --no-progress
          if (@(0, 1641, 3010) -notcontains $LASTEXITCODE) {
            throw "Chocolatey gagal memasang Inno Setup $innoVersion (exit $LASTEXITCODE)."
          }

      - name: Compile Setup executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:ECORIONE_INSTALLER_OUT | Out-Null
          $candidates = @(
            "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe",
            "$env:ProgramFiles\\Inno Setup 6\\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "Inno Setup compiler ISCC.exe tidak ditemukan setelah instalasi."
          }
          & $iscc "desktop\\installer.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compiler gagal dengan exit code $LASTEXITCODE."
          }

      - name: Generate installer SHA-256
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath $env:ECORIONE_INSTALLER_OUT -Filter "ECORIONE-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Setup executable tidak ditemukan."
          }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath (Join-Path $env:ECORIONE_INSTALLER_OUT "SHA256SUMS") -Encoding ascii

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ECORIONE-Setup-${{ env.ECORIONE_VERSION }}
          path: installer-out
          if-no-files-found: error
          retention-days: 14
