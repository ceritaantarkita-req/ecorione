name: Session 9 Format Diagnostic

on:
  push:
    branches:
      - feat/session9-automation-product-convergence-20261002

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".node-version"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write apps/ai/app/automations/page.tsx apps/ai/lib/settings-proxy.ts scripts/pcs06-browser-acceptance.mjs
          git diff -- apps/ai/app/automations/page.tsx apps/ai/lib/settings-proxy.ts scripts/pcs06-browser-acceptance.mjs
