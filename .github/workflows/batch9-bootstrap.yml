name: Batch 9 bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'agent/batch9-node-registry-canvas-20260910'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format
      - name: Commit normalized lockfile and formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'ecorione-batch9-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add pnpm-lock.yaml packages/shared-schema/src services/flow/src services/hub/src apps/ai .github/workflows/batch9-bootstrap.yml
          git commit -m 'chore(batch9): normalize lockfile and formatting'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
