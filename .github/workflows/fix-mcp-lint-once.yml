name: Fix MCP Lint Once
on:
  push:
    branches: [agent/outbound-mcp-manager-20260909]
    paths: [".github/workflows/fix-mcp-lint-once.yml"]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/outbound-mcp-manager-20260909
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint services/connect/src/mcp-client services/connect/src/mcp-client-cli.ts --fix
      - run: pnpm exec prettier --write services/connect/src/mcp-client services/connect/src/mcp-client-cli.ts
      - name: Commit fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/connect/src/mcp-client services/connect/src/mcp-client-cli.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: satisfy outbound MCP lint invariants"
          git push origin HEAD:agent/outbound-mcp-manager-20260909
