name: Fix MCP Lint Once

on:
  push:
    branches: [agent/mcp-external-acceptance-20260909]
    paths:
      - ".github/workflows/fix-mcp-lint-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/mcp-external-acceptance-20260909
      - name: Remove unnecessary quote escapes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/mcp-external-https-acceptance.mjs")
          text = p.read_text()
          old = 'resource_metadata=\\"${metadataUrl}\\"'
          new = 'resource_metadata="${metadataUrl}"'
          if old not in text:
              raise SystemExit("expected escaped resource_metadata assertion not found")
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit focused lint fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/mcp-external-https-acceptance.mjs
          git commit -m "fix: clean MCP acceptance challenge assertion"
          git push origin HEAD:agent/mcp-external-acceptance-20260909
