name: TEMP Frontend UX Static Final v4

on:
  push:
    branches:
      - fix/frontend-ux-static-final-20260912

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/frontend-ux-static-final-20260912
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Harden remaining frontend edge cases
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 target, found {count}")
              return text.replace(old, new, 1)

          # Settings: credential refresh must not overwrite unsaved runtime edits.
          p = Path('apps/ai/app/settings/page.tsx')
          s = p.read_text()
          anchor = '''  const refreshMcp = useCallback(async () => {\n'''
          helper = '''  const refreshCredentials = useCallback(async () => {\n    const result = await json<{ credentials: Credential[] }>(\n      "/api/settings/settings/credentials",\n    );\n    setCredentials(result.credentials);\n  }, []);\n\n'''
          s = once(s, anchor, helper + anchor, 'settings credential helper')
          s = once(s,
          '      setSecret("");\n      await refresh();\n      setStatus("Credential encrypted in Connect vault. Plaintext was not returned.");',
          '      setSecret("");\n      await refreshCredentials();\n      setStatus("Credential encrypted in Connect vault. Plaintext was not returned.");',
          'settings credential refresh')
          p.write_text(s)

          # Space: lock the visible core-memory draft during its owner mutation.
          p = Path('apps/ai/app/space/page.tsx')
          s = p.read_text()
          s = once(s,
          '                    className={styles.memoryButton}\n                    onClick={() => {',
          '                    className={styles.memoryButton}\n                    disabled={pendingMutation !== null}\n                    onClick={() => {',
          'space memory selector disable')
          s = once(s,
          '                  aria-label="Core memory label"\n                />',
          '                  aria-label="Core memory label"\n                  disabled={pendingMutation !== null}\n                />',
          'space memory label disable')
          s = once(s,
          '                  aria-label="Core memory description"\n                />',
          '                  aria-label="Core memory description"\n                  disabled={pendingMutation !== null}\n                />',
          'space memory description disable')
          s = once(s,
          '                  aria-label="Core memory value"\n                />',
          '                  aria-label="Core memory value"\n                  disabled={pendingMutation !== null}\n                />',
          'space memory value disable')
          p.write_text(s)

          # Flow: a version-history refresh failure must not misreport a successful save/load as failed.
          p = Path('apps/ai/app/flow/page.tsx')
          s = p.read_text()
          s = once(s,
          '      await loadVersions(body.version.graphId);\n    } finally {\n      finishBusy();\n    }\n  }\n  async function loadGraph',
          '''      try {\n        await loadVersions(body.version.graphId);\n      } catch (reason) {\n        const detail = reason instanceof Error ? reason.message : String(reason);\n        setMessage(\n          `v${body.version.version} tersimpan, tetapi riwayat versi gagal dimuat: ${detail}`,\n        );\n      }\n    } finally {\n      finishBusy();\n    }\n  }\n  async function loadGraph''',
          'flow save history error')
          s = once(s,
          '      setMessage(`Memuat ${body.graphId} v${body.version}.`);\n      await loadVersions(body.graphId);\n    } finally {',
          '''      setMessage(`Memuat ${body.graphId} v${body.version}.`);\n      try {\n        await loadVersions(body.graphId);\n      } catch (reason) {\n        const detail = reason instanceof Error ? reason.message : String(reason);\n        setMessage(\n          `Graph ${body.graphId} v${body.version} termuat, tetapi riwayat versi gagal dimuat: ${detail}`,\n        );\n      }\n    } finally {''',
          'flow load history error')
          p.write_text(s)

          # Record the newly found edge cases in the static audit.
          p = Path('docs/verification/frontend-static-audit-final-2026-09-12.md')
          s = p.read_text()
          marker = '13. **UX inventory only smoke-checked route markers.** It now also requires global navigation on every surface, typed Ops/Space/Flow response shapes, a non-empty local model identity, and records whether that identity is a mutable alias.\n'
          addition = marker + '14. **Credential save refreshed the whole Settings snapshot.** That could discard unrelated unsaved runtime edits; credential mutation now refreshes only credential metadata.\n15. **Space core-memory fields stayed editable while their save was in flight.** They now lock with the owner mutation so the visible draft cannot diverge silently from the submitted value.\n16. **Flow version-history refresh could make a successful Save/Load look like a failed operation.** Save/Load success now remains explicit while version-history refresh failure is reported separately.\n'
          s = once(s, marker, addition, 'audit additional findings')
          p.write_text(s)
          PY

          pnpm exec prettier --write \
            apps/ai/app/settings/page.tsx \
            apps/ai/app/space/page.tsx \
            apps/ai/app/flow/page.tsx \
            docs/verification/frontend-static-audit-final-2026-09-12.md
          pnpm run typecheck
          pnpm vitest run test/local-ux-product-evidence.test.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/ai docs/verification/frontend-static-audit-final-2026-09-12.md
          git commit -m 'fix: harden remaining frontend edge cases'
          git push origin HEAD:fix/frontend-ux-static-final-20260912