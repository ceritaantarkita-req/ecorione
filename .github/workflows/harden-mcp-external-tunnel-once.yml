name: Harden MCP External Tunnel Once

on:
  push:
    branches:
      - agent/outbound-mcp-manager-20260909
    paths:
      - .github/workflows/harden-mcp-external-tunnel-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/outbound-mcp-manager-20260909
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/patch-mcp-tunnel.py
      - run: pnpm exec prettier --write scripts/mcp-external-https-acceptance.mjs
      - run: node --check scripts/mcp-external-https-acceptance.mjs
      - name: Commit hardening
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/mcp-external-https-acceptance.mjs
          git commit -m "test: harden external MCP tunnel readiness"
          git push origin HEAD:agent/outbound-mcp-manager-20260909
