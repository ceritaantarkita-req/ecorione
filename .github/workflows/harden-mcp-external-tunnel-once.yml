name: Harden MCP External Tunnel Once
on:
  push:
    branches: [agent/outbound-mcp-manager-20260909]
    paths: [".github/workflows/harden-mcp-external-tunnel-once.yml"]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/outbound-mcp-manager-20260909
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Harden temporary tunnel startup and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/mcp-external-https-acceptance.mjs")
          text = p.read_text()
          old = '''async function startTunnel(localUrl, label) {
  const child = spawn(CLOUDFLARED_BIN, ["tunnel", "--no-autoupdate", "--url", localUrl], {
    stdio: ["ignore", "pipe", "pipe"],
  });
  const chunks = [];
  const urlPattern = /https:\\/\\/[a-z0-9-]+\\.trycloudflare\\.com/iu;

  return await new Promise((resolve, reject) => {
    let settled = false;
    const timer = setTimeout(() => {
      if (settled) return;
      settled = true;
      void stopChild(child);
      reject(
        new Error(
          `Timeout menunggu public HTTPS tunnel ${label}. Log: ${chunks.join("").slice(-4000)}`,
        ),
      );
    }, 60_000);

    const inspect = (data) => {
      const text = data.toString("utf8");
      chunks.push(text);
      const match = text.match(urlPattern);
      if (match && !settled) {
        settled = true;
        clearTimeout(timer);
        resolve({ child, publicUrl: match[0] });
      }
    };
    child.stdout.on("data", inspect);
    child.stderr.on("data", inspect);
    child.once("error", (error) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      reject(error);
    });
    child.once("exit", (code, signal) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      reject(
        new Error(
          `cloudflared ${label} berhenti sebelum URL tersedia (code=${String(code)}, signal=${String(signal)}). Log: ${chunks.join("").slice(-4000)}`,
        ),
      );
    });
  });
}

async function waitForPublic(url, label) {
  const deadline = Date.now() + 45_000;
  let lastError = "belum ada response";
  while (Date.now() < deadline) {
    try {
      const response = await fetch(url, { signal: AbortSignal.timeout(5_000) });
      if (response.ok) return;
      lastError = `HTTP ${String(response.status)}`;
    } catch (error) {
      lastError = error instanceof Error ? error.message : String(error);
    }
    await new Promise((resolve) => setTimeout(resolve, 750));
  }
  throw new Error(`Public HTTPS ${label} tidak ready: ${lastError}`);
}
'''
          new = '''async function startTunnel(localUrl, label) {
  const child = spawn(CLOUDFLARED_BIN, ["tunnel", "--no-autoupdate", "--url", localUrl], {
    stdio: ["ignore", "pipe", "pipe"],
  });
  const chunks = [];
  const urlPattern = /https:\\/\\/[a-z0-9-]+\\.trycloudflare\\.com/iu;
  const logTail = () => chunks.join("").slice(-4000);

  return await new Promise((resolve, reject) => {
    let settled = false;
    const timer = setTimeout(() => {
      if (settled) return;
      settled = true;
      void stopChild(child);
      reject(new Error(`Timeout menunggu public HTTPS tunnel ${label}. Log: ${logTail()}`));
    }, 60_000);

    const inspect = (data) => {
      const text = data.toString("utf8");
      chunks.push(text);
      const match = text.match(urlPattern);
      if (match && !settled) {
        settled = true;
        clearTimeout(timer);
        resolve({ child, publicUrl: match[0], logTail });
      }
    };
    child.stdout.on("data", inspect);
    child.stderr.on("data", inspect);
    child.once("error", (error) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      reject(error);
    });
    child.once("exit", (code, signal) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      reject(
        new Error(
          `cloudflared ${label} berhenti sebelum URL tersedia (code=${String(code)}, signal=${String(signal)}). Log: ${logTail()}`,
        ),
      );
    });
  });
}

async function waitForPublic(url, label, tunnel) {
  const deadline = Date.now() + 60_000;
  let lastError = "belum ada response";
  while (Date.now() < deadline) {
    if (tunnel.child.exitCode !== null || tunnel.child.signalCode !== null) {
      throw new Error(
        `Public HTTPS ${label} tunnel berhenti sebelum ready. Log: ${tunnel.logTail()}`,
      );
    }
    try {
      const response = await fetch(url, { signal: AbortSignal.timeout(5_000) });
      if (response.ok) return;
      lastError = `HTTP ${String(response.status)}`;
    } catch (error) {
      lastError = error instanceof Error ? error.message : String(error);
    }
    await new Promise((resolve) => setTimeout(resolve, 750));
  }
  throw new Error(
    `Public HTTPS ${label} tidak ready: ${lastError}. Tunnel log: ${tunnel.logTail()}`,
  );
}

async function startReadyTunnel(localUrl, label) {
  const failures = [];
  for (let attempt = 1; attempt <= 2; attempt += 1) {
    const tunnel = await startTunnel(localUrl, `${label} attempt ${String(attempt)}`);
    try {
      await waitForPublic(
        `${tunnel.publicUrl}/healthz`,
        `${label} attempt ${String(attempt)}`,
        tunnel,
      );
      return tunnel;
    } catch (error) {
      failures.push(error instanceof Error ? error.message : String(error));
      await stopChild(tunnel.child);
      if (attempt < 2) await new Promise((resolve) => setTimeout(resolve, 1_500));
    }
  }
  throw new Error(`Public HTTPS ${label} gagal setelah 2 tunnel attempts: ${failures.join(" | ")}`);
}
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one function block, got {text.count(old)}")
          text = text.replace(old, new, 1)
          old_calls = '''  oauthTunnel = await startTunnel(`http://${LOOPBACK}:${String(oauthPort)}`, "OAuth/JWKS");
  oauthPublicUrl = oauthTunnel.publicUrl;
  await waitForPublic(`${oauthPublicUrl}/healthz`, "OAuth/JWKS");
'''
          new_calls = '''  oauthTunnel = await startReadyTunnel(
    `http://${LOOPBACK}:${String(oauthPort)}`,
    "OAuth/JWKS",
  );
  oauthPublicUrl = oauthTunnel.publicUrl;
'''
          if text.count(old_calls) != 1:
              raise SystemExit(f"expected oauth call block once, got {text.count(old_calls)}")
          text = text.replace(old_calls, new_calls, 1)
          old_sync = '''  syncTunnel = await startTunnel(`http://${LOOPBACK}:${String(syncPort)}`, "Sync MCP bridge");
  const syncPublicUrl = syncTunnel.publicUrl;
  await waitForPublic(`${syncPublicUrl}/healthz`, "Sync MCP bridge");
'''
          new_sync = '''  syncTunnel = await startReadyTunnel(
    `http://${LOOPBACK}:${String(syncPort)}`,
    "Sync MCP bridge",
  );
  const syncPublicUrl = syncTunnel.publicUrl;
'''
          if text.count(old_sync) != 1:
              raise SystemExit(f"expected sync call block once, got {text.count(old_sync)}")
          p.write_text(text.replace(old_sync, new_sync, 1))
          PY
      - run: pnpm exec prettier --write scripts/mcp-external-https-acceptance.mjs
      - run: node --check scripts/mcp-external-https-acceptance.mjs
      - name: Commit hardening
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/mcp-external-https-acceptance.mjs
          git commit -m "test: harden external MCP tunnel readiness"
          git push origin HEAD:agent/outbound-mcp-manager-20260909
