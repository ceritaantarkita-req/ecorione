name: Project Memory Diagnostics Format

on:
  push:
    branches:
      - fix/context-automatic-consolidation-20261014

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print Prettier-only diff without uploading or committing files
        run: |
          pnpm exec prettier --write services/context/src/consolidate.ts services/context/src/http.ts services/context/src/consolidate.test.ts services/context/src/http.test.ts apps/ai/app/projects/ProjectMemoryStatus.tsx
          echo "MEMORY_DIAG_DIFF_START"
          git diff -- services/context/src/consolidate.ts services/context/src/http.ts services/context/src/consolidate.test.ts services/context/src/http.test.ts apps/ai/app/projects/ProjectMemoryStatus.tsx
          echo "MEMORY_DIAG_DIFF_END"
