name: Batch 8 Hardening

on:
  push:
    branches: [agent/batch8-data-governance-dr-20260910]

permissions:
  contents: write

concurrency:
  group: batch8-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/batch8-data-governance-dr-20260910
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply recovery hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          backup = Path("packages/shared-server/src/backup.ts")
          text = backup.read_text()
          text = text.replace(
              '      if (entries.length === 0)\n        throw new BackupIntegrityError("directory backup tidak boleh kosong");\n',
              ''
          )
          text = text.replace(
              '    mkdirSync(staging, { recursive: false, mode: 0o700 });',
              '    mkdirSync(dirname(target), { recursive: true, mode: 0o700 });\n    mkdirSync(staging, { recursive: false, mode: 0o700 });'
          )
          backup.write_text(text)

          dataset = Path("services/rnd/src/dataset.ts")
          text = dataset.read_text()
          constructor = '''  constructor(root: string) {
    this.root = resolve(root);
    this.registryPath = join(this.root, "registry.json");
    mkdirSync(this.root, { recursive: true, mode: 0o700 });
  }

'''
          register = '''  private register(manifest: DatasetReleaseManifest): void {
    const state = readRegistry(this.registryPath);
    if (state.releases.some((entry) => entry.releaseId === manifest.releaseId)) return;
    writeRegistry(this.registryPath, {
      format: "ecorione.dataset-registry/v1",
      revision: state.revision + 1,
      releases: state.releases
        .concat({
          releaseId: manifest.releaseId,
          dataset: manifest.dataset,
          schemaName: manifest.schemaName,
          schemaVersion: manifest.schemaVersion,
          createdAt: manifest.createdAt,
        })
        .sort((a, b) => a.releaseId.localeCompare(b.releaseId)),
    });
  }

'''
          if register not in text:
              text = text.replace(constructor, constructor + register)
          text = text.replace(
              '      if (existsSync(releaseRoot)) return this.get(releaseId);',
              '''      if (existsSync(releaseRoot)) {
        const existing = this.get(releaseId);
        this.register(existing);
        return existing;
      }'''
          )
          old_registry = '''      const state = readRegistry(this.registryPath);
      if (!state.releases.some((entry) => entry.releaseId === releaseId)) {
        writeRegistry(this.registryPath, {
          format: "ecorione.dataset-registry/v1",
          revision: state.revision + 1,
          releases: state.releases
            .concat({
              releaseId,
              dataset: manifest.dataset,
              schemaName: manifest.schemaName,
              schemaVersion: manifest.schemaVersion,
              createdAt: manifest.createdAt,
            })
            .sort((a, b) => a.releaseId.localeCompare(b.releaseId)),
        });
      }
'''
          text = text.replace(old_registry, '      this.register(manifest);\n')
          dataset.write_text(text)
          PY
      - name: Format
        run: pnpm exec prettier --write packages/shared-schema/src/data-governance.ts packages/shared-server/src/backup.ts packages/shared-server/src/backup.test.ts services/rnd/src/backup.ts services/rnd/src/backup.test.ts services/rnd/src/dataset.ts services/rnd/src/dataset.test.ts
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Focused Batch 8 hardening regression
        run: pnpm exec vitest run packages/shared-server/src/backup.test.ts services/rnd/src/dataset.test.ts services/rnd/src/dataset-http.test.ts services/rnd/src/backup.test.ts services/context/src/backup.test.ts services/connect/src/backup.test.ts --maxWorkers=1 --minWorkers=1
      - name: Commit hardened candidate and remove helper
        run: |
          rm .github/workflows/batch8-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: harden Batch 8 recovery edge cases"
          git push origin HEAD:agent/batch8-data-governance-dr-20260910
