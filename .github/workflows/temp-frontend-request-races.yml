name: TEMP Frontend Request Race Patch

on:
  push:
    branches:
      - fix/frontend-request-races-20260912

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/frontend-request-races-20260912
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply and format request-race hardening
        run: |
          python scripts/temp-frontend-request-races.py
          pnpm exec prettier --write apps/ai/app/page.tsx apps/ai/app/space/page.tsx
          git rm scripts/temp-frontend-request-races.py .github/workflows/temp-frontend-request-races.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ai/app/page.tsx apps/ai/app/space/page.tsx
          git commit -m "fix: guard frontend request races"
          git push origin HEAD:fix/frontend-request-races-20260912
