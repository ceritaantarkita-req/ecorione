- exact final PR head: `3459e4b51ff5c04eeb129ed2463cb0545d9a6ef8`
- exact-head CI `34442113246`: full green
- exact-head MCP External HTTPS Acceptance `34442113341`: PASS
- post-merge main CI `34443543782`: full green""",
