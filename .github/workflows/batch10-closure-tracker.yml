name: Batch 10 closure tracker update

on:
  push:
    branches: [agent/batch10-closure-20260910]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/batch10-closure-20260910
      - name: Update canonical tracker
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('docs/EXECUTION-PROGRESS.md')
          text = p.read_text()

          replacements = [
            (
              """Batch 9 implementation is merged and post-merge verified on `main`:\n\n- implementation PR #23 merge: `05b05a5f22133d61a411ff22463ac5acfaf4c5eb`\n- exact final PR head: `6294a6f641b1ddecf23ccac23ab1e85ce8da7fe8`\n- exact-head CI `34435365038`: full green\n- exact-head MCP External HTTPS Acceptance `34435365023`: PASS\n- post-merge main CI `34435559155`: full green""",
              """Batch 10 implementation is merged and post-merge verified on `main`:\n\n- implementation PR #25 merge: `f5232048f29efa4d4b6632330f0d860afa781d48`\n- exact final PR head: `3459e4b51ff5c04eeb129ed2463cb0545d9a6ef8`\n- exact-head CI `34442113246`: full green\n- exact-head MCP External HTTPS Acceptance `34442113341`: PASS\n- post-merge main CI `34443543782`: full green""",
            ),
            (
              """- Batch 9 status: **CLOSED**\n- next implementation target: **Batch 10 — Space Block Runtime**""",
              """- Batch 9 status: **CLOSED**\n- Batch 10 status: **CLOSED**\n- next implementation target: **Batch 11 — Production Operations & Observability**""",
            ),
            (
              """Dari current state, **Batch 1–9 sudah CLOSED**. Tersisa **3 batch platform/production (Batch 10–12)**; next implementation target adalah **Batch 10 — Space Block Runtime**.""",
              """Dari current state, **Batch 1–10 sudah CLOSED**. Tersisa **2 batch platform/production (Batch 11–12)**; next implementation target adalah **Batch 11 — Production Operations & Observability**.""",
            ),
            (
              """## Batch 10 — Space Block Runtime\n\nStatus: **PLANNED**""",
              """## Batch 10 — Space Block Runtime\n\nStatus: **CLOSED**""",
            ),
            (
              """- Space hanya menyimpan workspace/document composition yang memang menjadi domain-nya\n\n---\n\n## Batch 11 — Production Operations & Observability""",
              """- Space hanya menyimpan workspace/document composition yang memang menjadi domain-nya\n\nImplemented baseline:\n\n- 13 typed block kinds: paragraph, heading, list, checklist, table, database-view, file, image, embed, ai, context-link, artifact-link, flow-link;\n- shared discriminated schemas dengan type/body agreement dan HTTPS-only embed validation;\n- workspace-scoped pages/blocks dengan monotonic optimistic versions;\n- transactional insert/move/delete/reorder dan fail-closed stale-write conflicts;\n- same-page table dependency untuk database-view dengan exact typed-reference checking;\n- Context/Artifact/Flow pointer resolution dilakukan just-in-time tanpa copy authoritative owner data;\n- AI block menunjuk Flow graph, sehingga durable execution tetap dimiliki Flow/Temporal;\n- real pre-Batch-10 SQLite migration mempertahankan IDs/order/timestamps dan mengubah legacy text/heading/list menjadi typed bodies;\n- Ai `/space` menyediakan page composition, block palette, preview, reorder/delete, JSON inspector, reference resolution, dan existing Context core-memory editor.\n\nClosure evidence:\n\n- implementation branch: `agent/batch10-space-block-runtime-20260910`;\n- implementation PR: #25;\n- final exact implementation head: `3459e4b51ff5c04eeb129ed2463cb0545d9a6ef8`;\n- exact-head CI `34442113246`: Naming, Format, Lint, Typecheck, Test, Phase 4 real-process acceptance, Secret Scan, Production Build PASS;\n- exact-head MCP External HTTPS Acceptance `34442113341`: PASS;\n- PR #25 merged with expected-head lock as `f5232048f29efa4d4b6632330f0d860afa781d48`;\n- `main` confirmed at the expected merge SHA;\n- post-merge main CI `34443543782`: full green;\n- no temporary Batch 10 implementation helper workflow remains in the implementation tree.\n\nADR: `docs/adr/0031-space-block-runtime.md`  \nOperations: `docs/space-block-runtime-operations.md`  \nVerification: `docs/verification/batch10-closure-2026-09-10.md`\n\nBatch 10 resmi **CLOSED**; next implementation batch adalah Batch 11.\n\n---\n\n## Batch 11 — Production Operations & Observability""",
            ),
            (
              """- **Batch 9: CLOSED**\n- **3 platform/production batches remaining (Batch 10–12)**\n- next: **Batch 10 — Space Block Runtime**\n\nHeuristic percentage/granular workload estimates sengaja tidak dihitung ulang pada closure Batch 9.""",
              """- **Batch 9: CLOSED**\n- **Batch 10: CLOSED**\n- **2 platform/production batches remaining (Batch 11–12)**\n- next: **Batch 11 — Production Operations & Observability**\n\nHeuristic percentage/granular workload estimates sengaja tidak dihitung ulang pada closure Batch 10.""",
            ),
          ]

          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'expected exactly one tracker match, got {count}: {old[:80]!r}')
            text = text.replace(old, new)

          p.write_text(text)
          PY
      - name: Remove one-shot helper and commit tracker
        run: |
          rm .github/workflows/batch10-closure-tracker.yml
          git config user.name 'ecorione-batch10-closure-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A docs/EXECUTION-PROGRESS.md .github/workflows/batch10-closure-tracker.yml
          git commit -m 'docs(batch10): close canonical execution tracker'
          git push origin HEAD:agent/batch10-closure-20260910
