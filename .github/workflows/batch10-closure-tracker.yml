    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/batch10-closure-20260910
          fetch-depth: 0
      - name: Update canonical tracker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/EXECUTION-PROGRESS.md")
          text = path.read_text()

          replacements = [
              (
                  """Batch 9 implementation is merged and post-merge verified on `main`:

