name: Batch 5 Format Fix

on:
  pull_request:
    paths:
      - "packages/shared-schema/src/multimodal.ts"
      - "services/connect/src/multimodal.ts"
      - "services/context/src/multimodal-routes.ts"
      - "services/hub/src/multimodal-http.ts"
      - "services/hub/src/multimodal-runs.ts"
      - ".github/workflows/batch5-format-fix.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply repository Prettier
        run: |
          pnpm exec prettier --write \
            packages/shared-schema/src/multimodal.ts \
            services/connect/src/multimodal.ts \
            services/context/src/multimodal-routes.ts \
            services/hub/src/multimodal-http.ts \
            services/hub/src/multimodal-runs.ts

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/shared-schema/src/multimodal.ts \
            services/connect/src/multimodal.ts \
            services/context/src/multimodal-routes.ts \
            services/hub/src/multimodal-http.ts \
            services/hub/src/multimodal-runs.ts
          git commit -m "chore: format Batch 5 multimodal files"
          git push origin "HEAD:${{ github.head_ref }}"
