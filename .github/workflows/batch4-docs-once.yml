name: Batch 4 Docs Once

on:
  push:
    branches:
      - agent/unified-capability-permission-plane-20260909
    paths:
      - .github/workflows/batch4-docs-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/batch4-docs-once.mjs
      - run: pnpm exec prettier --write README.md docs/DECISIONS.md docs/fase6-hardening.md docs/EXECUTION-PROGRESS.md docs/adr/README.md docs/adr/0025-unified-capability-permission-plane.md docs/capability-permission-operations.md
      - run: pnpm run format:check
      - name: Commit docs and remove helper
        run: |
          rm -f scripts/batch4-docs-once.mjs .github/workflows/batch4-docs-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: document unified capability permission plane"
          git push origin HEAD:agent/unified-capability-permission-plane-20260909
