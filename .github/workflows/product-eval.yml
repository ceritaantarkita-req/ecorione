name: Product Eval

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build runtime dependencies
        run: pnpm run build:runtime-deps

      - name: Run real task and bug derived product regressions
        run: |
          pnpm exec vitest run \
            evals/product-regressions.test.ts \
            evals/eval-inventory.test.ts \
            evals/ecx-selector-heldout.test.ts \
            apps/ai/lib/settings-proxy.test.ts \
            apps/ai/lib/space-proxy.test.ts \
            apps/ai/lib/flow-proxy.test.ts \
            apps/ai/app/api/voice/stream/route.test.ts \
            services/connect/src/runtime-settings.test.ts \
            apps/ai/app/api/chat/route.test.ts \
            apps/ai/app/api/forget/route.test.ts \
            apps/ai/app/api/ops/route.test.ts \
            --maxWorkers=1 \
            --minWorkers=1
