name: Temporary Persistence Formatter

on:
  push:
    branches:
      - ops/local-persistence-restart-evidence-20260911

permissions:
  contents: write

jobs:
  format-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ops/local-persistence-restart-evidence-20260911
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier output and remove temporary workflow
        run: |
          pnpm exec prettier scripts/local-persistence-restart-evidence.mjs --write
          git rm .github/workflows/temp-format-persistence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/local-persistence-restart-evidence.mjs
          git commit -m "chore: format persistence evidence harness"
          git push origin HEAD:ops/local-persistence-restart-evidence-20260911
