# Batch 12 rerun: patched PostCSS override
name: Batch 12 integration gate

on:
  push:
    branches: [agent/batch12-final-security-release-20260910]
    paths:
      - .github/workflows/batch12-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/batch12-final-security-release-20260910
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Apply Batch 12 candidate
        run: python scripts/batch12-apply.py
      - name: Refresh frozen lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Normalize formatting
        run: pnpm run format
      - name: Lint including Next framework rules
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Focused release acceptance
        run: pnpm run acceptance:release
      - name: Dependency policy review
        run: pnpm run dependency:review
      - name: Registry dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Working-tree secret scan
        run: pnpm run secret-scan
      - name: Full Git-history secret scan
        run: pnpm run secret-scan:history
      - name: Commit integrated candidate
        run: |
          chmod +x scripts/self-host-install.sh scripts/self-host-upgrade.sh scripts/self-host-rollback.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: integrate Batch 12 final security and release baseline'
          git push origin HEAD:agent/batch12-final-security-release-20260910
