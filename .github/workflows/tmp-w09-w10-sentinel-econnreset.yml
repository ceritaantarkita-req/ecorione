name: W09 W10 sentinel ECONNRESET fix

on:
  push:
    branches:
      - fix/w09-w10-sentinel-econnreset-20260916

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch sentinel reset handling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return text.replace(old, new, 1)

          script_path = Path("scripts/windows-engine-acceptance.mjs")
          script = script_path.read_text()
          anchor = '''function listenServer(server, port) {\n'''
          helper = '''export function createProtectedPortSentinel() {\n  return createServer((socket) => {\n    // Port probes connect and immediately close/reset. The sentinel owns no protocol,\n    // so socket-level reset errors are expected and must never crash acceptance.\n    socket.on("error", () => {});\n    socket.end();\n  });\n}\n\nfunction listenServer(server, port) {\n'''
          script = replace_once(script, anchor, helper, "sentinel helper")
          script = replace_once(
              script,
              '''      protectedPort3000Server = createServer((socket) => socket.end("foreign-port-3000\\n"));\n''',
              '''      protectedPort3000Server = createProtectedPortSentinel();\n''',
              "sentinel construction",
          )
          script_path.write_text(script)

          test_path = Path("test/windows-engine-acceptance.test.mjs")
          tests = test_path.read_text()
          tests = replace_once(
              tests,
              '''import { describe, expect, it } from "vitest";\n''',
              '''import { createConnection } from "node:net";\n\nimport { describe, expect, it } from "vitest";\n''',
              "test net import",
          )
          tests = replace_once(
              tests,
              '''  acceptancePlan,\n''',
              '''  acceptancePlan,\n  createProtectedPortSentinel,\n''',
              "test sentinel import",
          )
          insertion_anchor = '''  it("requires Temporal, Ai, and every Phase 4 owner in a healthy runtime doctor", () => {\n'''
          insertion = '''  it("keeps the protected foreign-port sentinel alive across an immediate client reset", async () => {\n    const server = createProtectedPortSentinel();\n    await new Promise((resolvePromise, rejectPromise) => {\n      server.once("error", rejectPromise);\n      server.listen(0, "127.0.0.1", resolvePromise);\n    });\n\n    const address = server.address();\n    expect(address).not.toBeNull();\n    expect(typeof address).toBe("object");\n    if (!address || typeof address === "string") throw new Error("Unexpected sentinel address");\n\n    await new Promise((resolvePromise) => {\n      const client = createConnection({ host: "127.0.0.1", port: address.port });\n      client.once("connect", () => {\n        if (typeof client.resetAndDestroy === "function") client.resetAndDestroy();\n        else client.destroy();\n      });\n      client.once("error", resolvePromise);\n      client.once("close", resolvePromise);\n    });\n\n    await new Promise((resolvePromise) => setTimeout(resolvePromise, 25));\n    expect(server.listening).toBe(true);\n    await new Promise((resolvePromise) => server.close(resolvePromise));\n  });\n\n'''
          tests = replace_once(tests, insertion_anchor, insertion + insertion_anchor, "sentinel regression test")
          test_path.write_text(tests)

          doc_path = Path("docs/verification/w09-w10-windows-engine-acceptance-2026-09-15.md")
          doc = doc_path.read_text()
          marker = "## Operator rerun blocker 4 — protected-port sentinel socket reset"
          if marker not in doc:
              doc += '''\n\n## Operator rerun blocker 4 — protected-port sentinel socket reset\n\nThe exact-current-main Windows rerun at `7b9c49d93fa64051bd6ce8abc0e05f01281f116f` aborted before W09-A with an unhandled `read ECONNRESET`. The newly added foreign listener on port 3000 wrote a small payload to every probe connection, while ECORIONE's reachability probe intentionally connects and closes immediately. On Windows/Node 24 that close can surface as a socket-level reset; because the sentinel connection had no `error` listener, Node treated the expected reset as an uncaught event and terminated the acceptance process.\n\nDisposition: the protected-port sentinel is protocol-free, writes no payload, and explicitly absorbs connection-level reset errors on its disposable accepted sockets. A regression test opens the sentinel on an ephemeral loopback port, immediately resets the client connection, and verifies that the server remains listening. W09/W10 remain open until a fresh merged-main Windows run reaches the final PASS marker.\n'''
          doc_path.write_text(doc)
          PY

          pnpm exec prettier --write \
            scripts/windows-engine-acceptance.mjs \
            test/windows-engine-acceptance.test.mjs \
            docs/verification/w09-w10-windows-engine-acceptance-2026-09-15.md
          pnpm exec vitest run test/windows-engine-acceptance.test.mjs test/ecorione-engine.test.mjs test/desktop-bundle.test.mjs
          pnpm run typecheck
          pnpm run lint
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-w09-w10-sentinel-econnreset.yml
          git config user.name "ceritaantarkita-req"
          git config user.email "ceritaantarkita@gmail.com"
          git add scripts/windows-engine-acceptance.mjs test/windows-engine-acceptance.test.mjs docs/verification/w09-w10-windows-engine-acceptance-2026-09-15.md .github/workflows/tmp-w09-w10-sentinel-econnreset.yml
          git commit -m "fix W09/W10 sentinel socket reset handling"
          git push origin HEAD:fix/w09-w10-sentinel-econnreset-20260916
