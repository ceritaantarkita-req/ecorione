name: Format Once

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write test/phase4-temporal-runtime.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- test/phase4-temporal-runtime.test.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/phase4-temporal-runtime.test.ts
          git commit -m "chore: canonical format Temporal recovery test"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
