name: Batch 11 apply and verify

on:
  push:
    branches: [agent/batch11-production-ops-observability-20260910]
    paths:
      - .github/workflows/batch11-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/batch11-production-ops-observability-20260910
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply final integration patches
        run: python scripts/batch11-finalize.py
      - name: Format candidate
        run: pnpm exec prettier --write packages/shared-server/src services/connect/src/http.ts services/connect/src/mcp-client/http.ts services/hub/src/exchange-http.ts services/flow/src/http.ts services/sync/src/http.ts apps/ai/app/api/ops apps/ai/app/ops deploy/compose.yml scripts/provider-canary.mjs scripts/production-ops-acceptance.mjs docs/adr/0032-production-operations-observability.md docs/adr/README.md docs/DECISIONS.md docs/production-operations.md docs/verification/batch11-production-ops-2026-09-10.md docs/EXECUTION-PROGRESS.md package.json .github/workflows/ci.yml
      - name: Typecheck
        run: pnpm run typecheck
      - name: Focused Batch 11 tests
        run: pnpm vitest run packages/shared-server/src/observability.test.ts services/connect/src/operations.test.ts
      - name: Production operations acceptance
        run: pnpm run acceptance:production-ops
      - name: Remove helpers and commit candidate
        run: |
          rm .github/workflows/batch11-apply.yml scripts/batch11-finalize.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: Batch 11 production operations and observability'
          git push origin HEAD:agent/batch11-production-ops-observability-20260910

# verifier retry after request-scope trace hardening
