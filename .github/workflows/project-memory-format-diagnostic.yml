name: Project Memory Format Diagnostic
on:
  push:
    paths:
      - .github/workflows/project-memory-format-diagnostic.yml
permissions:
  contents: read
jobs:
  formatting-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print expected Prettier diff without committing
        run: |
          pnpm exec prettier --write services/context/src/consolidate.ts services/context/src/consolidate.test.ts
          git diff --no-ext-diff --unified=3 -- services/context/src/consolidate.ts services/context/src/consolidate.test.ts
