name: W03 Format Oracle

on:
  pull_request:

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier scripts/local-ux-product-evidence.mjs --write
          git diff -- scripts/local-ux-product-evidence.mjs
          exit 1
