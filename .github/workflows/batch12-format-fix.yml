name: Batch 12 one-shot formatter

on:
  push:
    branches: [agent/batch12-final-security-release-20260910]
    paths:
      - .github/workflows/batch12-format-fix.yml

permissions:
  contents: write

jobs:
  format-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/batch12-final-security-release-20260910
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format settings CSS and remove helper
        run: |
          pnpm exec prettier --write apps/ai/app/settings/Settings.module.css
          rm -f .github/workflows/batch12-format-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(batch12): format scoped settings controls'
          git push origin HEAD:agent/batch12-final-security-release-20260910
