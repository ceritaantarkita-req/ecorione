name: Session 12B Final Format Diagnostic

on:
  push:
    branches:
      - feat/session12b-google-drive-selected-file-fetch-20261003

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Emit exact final Prettier diff
        run: |
          pnpm exec prettier --write services/connect/src/google-drive-source.test.ts
          echo "SESSION12B_FINAL_PRETTIER_DIFF_START"
          git diff -- services/connect/src/google-drive-source.test.ts
          echo "SESSION12B_FINAL_PRETTIER_DIFF_END"
