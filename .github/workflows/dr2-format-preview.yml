name: DR2 Format Preview

on:
  push:
    branches: [dr2/physical-independence-foundation-20260923]

permissions:
  contents: read

concurrency:
  group: dr2-format-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Print Prettier diff
        run: |
          pnpm exec prettier --write             scripts/staging-dr2-host-evidence.mjs             scripts/staging-dr2-physical-independence-preflight.mjs             test/offhost-dr2-physical-independence.test.ts
          git diff --             scripts/staging-dr2-host-evidence.mjs             scripts/staging-dr2-physical-independence-preflight.mjs             test/offhost-dr2-physical-independence.test.ts
