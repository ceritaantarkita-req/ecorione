name: TEMP Frontend Polish Patch

on:
  push:
    branches:
      - feat/frontend-product-polish-20260912

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/frontend-product-polish-20260912
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply small frontend polish fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          globals_path = Path('apps/ai/app/globals.css')
          text = globals_path.read_text()
          needle = '''.ai-topbar__title {
            font-size: clamp(24px, 3.4vw, 38px);
            line-height: 1.05;
            letter-spacing: -0.025em;
          }
          '''
          replacement = needle + '''
          .ai-topbar__lead {
            margin: 7px 0 0;
            color: var(--text-muted);
            font-size: 11.5px;
            line-height: 1.55;
          }
          '''
          if needle not in text:
              raise SystemExit('globals target not found')
          globals_path.write_text(text.replace(needle, replacement, 1))

          flow_path = Path('apps/ai/app/flow/FlowCanvas.module.css')
          text = flow_path.read_text()
          needle = '''.canvasWrap {
            min-width: 0;
            display: flex;
            flex-direction: column;
          }
          '''
          replacement = '''.canvasWrap {
            min-width: 0;
            display: flex;
            flex-direction: column;
            overflow: auto;
          }
          '''
          if needle not in text:
              raise SystemExit('flow target not found')
          flow_path.write_text(text.replace(needle, replacement, 1))

          chat_path = Path('apps/ai/app/page.tsx')
          text = chat_path.read_text()
          needle = 'threadEndRef.current?.scrollIntoView({ behavior: "smooth", block: "nearest" });'
          replacement = 'threadEndRef.current?.scrollIntoView({ block: "nearest" });'
          if needle not in text:
              raise SystemExit('chat target not found')
          chat_path.write_text(text.replace(needle, replacement, 1))
          PY
          pnpm exec prettier --write \
            apps/ai/app/globals.css \
            apps/ai/app/flow/FlowCanvas.module.css \
            apps/ai/app/page.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/ai/app/globals.css \
            apps/ai/app/flow/FlowCanvas.module.css \
            apps/ai/app/page.tsx
          git commit -m "fix: polish responsive frontend details"
          git push origin HEAD:feat/frontend-product-polish-20260912
