name: Format History ECX Once

on:
  push:
    branches:
      - agent/history-ledger-ecx-20260909
    paths:
      - .github/workflows/format-history-ecx-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/history-ledger-ecx-20260909
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format History and ECX files
        run: >-
          pnpm exec prettier --write
          services/hub/src/exchange-http.test.ts
          services/hub/src/exchange-http.ts
          services/hub/src/exchange.test.ts
          services/hub/src/exchange.ts
          services/hub/src/history-http.ts
          services/hub/src/history-ledger.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/hub/src/exchange-http.test.ts services/hub/src/exchange-http.ts services/hub/src/exchange.test.ts services/hub/src/exchange.ts services/hub/src/history-http.ts services/hub/src/history-ledger.ts
          git commit -m "style: format Historical Ledger and ECX"
          git push origin HEAD:agent/history-ledger-ecx-20260909
