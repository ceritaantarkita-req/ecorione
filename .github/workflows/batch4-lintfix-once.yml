name: Batch 4 Lintfix Once

on:
  push:
    branches:
      - agent/unified-capability-permission-plane-20260909
    paths:
      - .github/workflows/batch4-lintfix-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/batch4-lintfix-once.mjs
      - run: pnpm exec prettier --write services/hub/src/capability-http.ts services/hub/src/capability-registry.ts
      - run: pnpm run lint
      - run: pnpm run typecheck
      - name: Commit lint fix and remove helper
        run: |
          rm -f scripts/batch4-lintfix-once.mjs .github/workflows/batch4-lintfix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: clean unified authority lint imports"
          git push origin HEAD:agent/unified-capability-permission-plane-20260909
