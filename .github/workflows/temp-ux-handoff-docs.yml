name: TEMP UX Handoff Docs Patch

on:
  push:
    branches:
      - docs/frontend-static-hardening-closure-20260912

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/frontend-static-hardening-closure-20260912
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch canonical UX handoff docs
        run: |
          python scripts/temp-ux-handoff-docs.py
          pnpm exec prettier --write docs/current-state-and-next-steps.md docs/EXECUTION-PROGRESS.md docs/ux-product-validation.md docs/verification/frontend-static-hardening-2026-09-12.md
          git rm scripts/temp-ux-handoff-docs.py .github/workflows/temp-ux-handoff-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/current-state-and-next-steps.md docs/EXECUTION-PROGRESS.md docs/ux-product-validation.md docs/verification/frontend-static-hardening-2026-09-12.md
          git commit -m "docs: finalize UX static hardening handoff"
          git push origin HEAD:docs/frontend-static-hardening-closure-20260912
