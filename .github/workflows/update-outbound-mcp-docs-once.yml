name: Update Outbound MCP Docs Once
on:
  push:
    branches: [agent/outbound-mcp-manager-20260909]
    paths: [".github/workflows/update-outbound-mcp-docs-once.yml"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/outbound-mcp-manager-20260909
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Update ADR, operator guide, env, README, hardening, decisions, and tracker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_section(path, start_marker, end_marker, replacement):
              p = Path(path)
              text = p.read_text()
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"{path}: start marker not found: {start_marker!r}")
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f"{path}: end marker not found: {end_marker!r}")
              p.write_text(text[:start] + replacement + text[end:])

          Path("docs/adr/0023-outbound-mcp-client-manager.md").write_text('''# ADR-23 — Outbound MCP Client + Manager\n\nStatus: Accepted\nTanggal: 2026-09-09\n\n## Context\n\nEcorione sudah memiliki MCP server inbound di Connect, tetapi belum mempunyai boundary generik untuk memakai MCP server pihak lain. Menambahkan client eksternal tanpa governance yang jelas akan membuka beberapa kelas risiko sekaligus: credential leakage, arbitrary process execution lewat stdio, cross-workspace data leakage, tool side effect yang salah diklasifikasikan, dan duplicate remote execution setelah timeout/crash.\n\nOutbound MCP juga tidak boleh menjadi jalur samping yang melewati Hub. Connect tetap pemilik transport/credential boundary, sedangkan Hub tetap pemilik policy, approval, dan audit.\n\n## Decision\n\n1. Connect menjadi satu-satunya runtime boundary untuk outbound MCP. Hub tidak membuka transport MCP eksternal sendiri.\n2. Client SDK resmi dipin exact ke `@modelcontextprotocol/client@2.0.0`. Protocol negotiation diaktifkan eksplisit dengan `versionNegotiation.mode = "auto"`; runtime tidak mengandalkan default SDK untuk memilih protocol era.\n3. Transport baseline adalah Streamable HTTP dan stdio. Streamable HTTP wajib HTTPS, kecuali HTTP loopback yang diizinkan eksplisit. URL tidak boleh membawa username/password/fragment.\n4. Stdio fail-closed: command harus ada secara exact di `ECORIONE_MCP_STDIO_ALLOWLIST`. Registry tidak boleh menyimpan environment variable yang tampak seperti token/key/secret/password/credential; secret harus memakai credential reference.\n5. MCP server registry durable dan workspace-scoped. File registry memakai exclusive lock, atomic replacement, dan mode `0600`. Connection/cache partition juga dipisahkan per workspace.\n6. Credential MCP disimpan sebagai named encrypted references dalam Connect Credential Vault scope `mcp/tokens`. Registry hanya menyimpan reference, bukan secret plaintext.\n7. Discovery tidak otomatis mengaktifkan tool. Setiap tool harus di-enable eksplisit dan diberi local `ActionClass`. Klasifikasi lokal adalah policy input authoritative; remote hint tidak boleh otomatis menurunkan risk class.\n8. Semua discovery/call melewati Hub policy contract. Hub tetap owner approval dan audit melalui service API; Connect tidak mengakses Hub database secara langsung.\n9. Side effect menggunakan durable idempotency identity yang mencakup workspace, server, tool, dan canonical arguments. Store menyimpan `workspaceId`, `operationId`, tool, digest args, timestamp, status, dan result.\n10. Sebelum remote side-effect dispatch, Connect melakukan durable reservation. State adalah `reserved`, `uncertain`, atau `settled`. `reserve()` tetap atomic race barrier tepat sebelum dispatch.\n11. Retry yang sudah diketahui `reserved`/`uncertain` ditolak pada preflight sebelum Connect membuka ulang transport atau melakukan remote discovery. Ini mengurangi network activity pada ambiguous retry tanpa mengganti atomic reservation barrier.\n12. Jika transport/call gagal setelah side-effect dispatch, reservation menjadi `uncertain`, connection ditutup, dan automatic redispatch dilarang. Operator/caller harus menyelesaikan remote state secara eksplisit.\n13. Jika remote side effect sukses tetapi settlement atau audit bookkeeping gagal, hasil remote tetap dikembalikan sebagai sukses dengan state degraded/reservation-retained. Keberhasilan eksternal tidak dibuat retryable hanya karena bookkeeping lokal gagal.\n14. Arbitrary GitHub repository/plugin code execution bukan bagian dari outbound MCP manager. Plugin/extension installation harus melalui workstream terpisah dengan manifest, revision pinning, permission/security gate, dan Sandbox bila membawa executable code.\n\n## Consequences\n\n- Ecorione dapat memakai MCP server pihak lain melalui satu boundary yang dapat diaudit.\n- Workspace berbeda tidak berbagi connection partition maupun durable idempotency identity.\n- Side effect eksternal memiliki fail-closed ambiguity semantics yang konsisten dengan prinsip ADR-12.\n- Menambah transport atau credential mechanism baru harus mempertahankan Hub governance, workspace isolation, dan no-automatic-retry invariant.\n- Stdio lebih ketat daripada menjalankan command generik; operator harus mengizinkan executable secara eksplisit.\n\n## Non-goals\n\n- Marketplace/plugin installer.\n- Menjalankan arbitrary repository di host process.\n- Menganggap remote MCP metadata sebagai permission authority.\n- Automatic retry untuk ambiguous external side effect.\n- Managed secret service atau multi-host registry pada baseline single-host/self-host ini.\n''')

          Path("docs/outbound-mcp-operations.md").write_text('''# Outbound MCP — Operator Guide\n\nDokumen ini menjelaskan baseline operasional outbound MCP di Connect. Registry dan credential dimodifikasi lewat CLI operator; runtime HTTP hanya mengekspos list/status/discover/call/disconnect. Tidak ada endpoint HTTP untuk menulis credential.\n\n## 1. Runtime state\n\nEnvironment yang relevan:\n\n```env\nECORIONE_MCP_OUTBOUND_REGISTRY_PATH=./data/connect-mcp-registry.json\nECORIONE_MCP_OUTBOUND_INVOCATION_PATH=./data/connect-mcp-invocations.json\nECORIONE_MCP_STDIO_ALLOWLIST=command-a,/absolute/path/command-b\n```\n\n`ECORIONE_MCP_STDIO_ALLOWLIST` adalah daftar **comma-separated exact command strings**. Empty list berarti semua stdio command ditolak.\n\nCredential MCP memakai Connect Credential Vault yang sama dengan provider. `ECORIONE_CONNECT_VAULT_MASTER_KEY` harus tersedia untuk operasi credential. Named MCP secrets disimpan terenkripsi di scope `mcp/tokens`; registry hanya menyimpan `credentialRef`.\n\n## 2. CLI operator\n\nSemua command memakai:\n\n```bash\npnpm --filter @ecorione/connect mcp:manage -- <command>\n```\n\nCommand yang tersedia:\n\n```text\nserver:list [workspaceId]\nserver:upsert\nserver:remove <id>\ntool:set <serverId> <tool> <true|false> <actionClass>\ncredential:list\ncredential:set <ref>\ncredential:remove <ref>\n```\n\n`server:upsert` membaca seluruh JSON config dari stdin. `credential:set` membaca secret dari stdin, sehingga secret tidak perlu muncul di process arguments.\n\nContoh menyimpan credential:\n\n```bash\nprintf '%s' "$REMOTE_MCP_TOKEN" | \\\n  pnpm --filter @ecorione/connect mcp:manage -- credential:set example-token\n```\n\nContoh server Streamable HTTP:\n\n```json\n{\n  "id": "example",\n  "displayName": "Example MCP",\n  "workspaceIds": ["ws_personal"],\n  "transport": {\n    "type": "streamable-http",\n    "url": "https://mcp.example.com/mcp",\n    "credentialRef": "example-token"\n  },\n  "toolPolicies": []\n}\n```\n\nSimpan config misalnya ke `/tmp/example-mcp.json`, lalu:\n\n```bash\npnpm --filter @ecorione/connect mcp:manage -- server:upsert < /tmp/example-mcp.json\n```\n\nHTTP non-TLS hanya diperbolehkan untuk loopback dan harus menyetel `allowInsecureLoopback: true`. URL dengan username, password, atau fragment ditolak.\n\nContoh stdio:\n\n```json\n{\n  "id": "local-tool",\n  "displayName": "Local Tool MCP",\n  "workspaceIds": ["ws_personal"],\n  "transport": {\n    "type": "stdio",\n    "command": "/opt/example-mcp/bin/server",\n    "args": [],\n    "env": {},\n    "credentialRef": "local-tool-token",\n    "credentialEnv": "EXAMPLE_TOKEN"\n  },\n  "toolPolicies": []\n}\n```\n\nCommand harus cocok exact dengan salah satu entry di `ECORIONE_MCP_STDIO_ALLOWLIST`. `credentialRef` dan `credentialEnv` untuk stdio harus dikonfigurasi bersama. Environment config yang namanya tampak seperti secret ditolak; secret masuk melalui Vault.\n\n## 3. Discovery lalu enable tool\n\nRemote discovery **tidak** otomatis memberikan permission. Setelah melihat tool yang diiklankan remote, operator menetapkan policy lokal secara eksplisit, misalnya:\n\n```bash\npnpm --filter @ecorione/connect mcp:manage -- \\\n  tool:set example search true READ\n\npnpm --filter @ecorione/connect mcp:manage -- \\\n  tool:set example create_record true REVERSIBLE_WRITE\n```\n\n`ActionClass` memakai kontrak shared policy ecorione (`READ`, `REVERSIBLE_WRITE`, `IRREVERSIBLE_WRITE`, `SPEND`, `EXTERNAL_SEND`, `CREDENTIAL_ACCESS`, `EXECUTE`). Class yang gated tetap membutuhkan Hub approval sesuai policy. Jangan menurunkan class hanya karena remote server mengklaim tool aman/read-only.\n\n## 4. Runtime routes\n\nConnect menyediakan:\n\n```text\nGET  /v1/mcp-outbound/servers?workspaceId=ws_...\nGET  /v1/mcp-outbound/servers/:id/status?workspaceId=ws_...\nPOST /v1/mcp-outbound/servers/:id/discover\nPOST /v1/mcp-outbound/servers/:id/tools/:tool/call\nPOST /v1/mcp-outbound/servers/:id/disconnect\n```\n\nDiscovery body membawa `workspaceId`, `operationId`, `scope`, `sensitivity`, `autonomy`, dan `now`. Tool call membawa field yang sama plus `arguments`. Semua request tetap melewati Hub governance.\n\nError penting:\n\n- `403 MCP_PERMISSION_DENIED` — transport/tool tidak diizinkan.\n- `403 MCP_POLICY_DENIED` — Hub menolak action.\n- `409 MCP_APPROVAL_REQUIRED` — approval durable harus diselesaikan.\n- `409 MCP_OUTCOME_UNCERTAIN` — side effect mungkin sudah terjadi; **jangan retry secara blind**.\n- `503 MCP_CREDENTIAL_UNAVAILABLE` — credential reference tidak tersedia.\n- `503 MCP_STATE_UNAVAILABLE` — registry/invocation durable state tidak aman dipakai.\n- `504 MCP_TIMEOUT` — transport/request melewati timeout.\n\n## 5. Ambiguous side effects\n\nUntuk action non-`READ`, Connect membuat durable reservation sebelum `tools/call`. Jika remote call gagal setelah dispatch, reservation dipertahankan sebagai `uncertain`. Retry berikutnya dengan identity yang sama ditolak bahkan sebelum reconnect/network discovery.\n\nJika menerima `MCP_OUTCOME_UNCERTAIN`, operator harus memeriksa state remote atau menjalankan reconciliation yang khusus untuk server tersebut. Jangan menghapus invocation store untuk memaksa retry; itu menghilangkan safety evidence.\n\nRemote success juga tidak diubah menjadi retryable error hanya karena settlement atau audit lokal gagal. Response membawa degraded settlement/audit state agar operator dapat memperbaiki bookkeeping tanpa menggandakan side effect.\n\n## 6. Batas security\n\nOutbound MCP bukan plugin installer. Menambahkan server stdio tidak berarti arbitrary repository boleh dieksekusi. Source/plugin executable harus melewati workstream Plugin/Extension Framework: pinned revision, manifest, permission/security gate, provenance, dan Sandbox bila membawa code.\n''')

          Path("docs/adr/README.md").write_text('''# Architecture Decision Records\n\nDua puluh tiga keputusan yang membentuk ecorione, masing-masing dengan angka atau riset yang\nmendukungnya. Alasan lengkap keputusan awal ada di [`../research.md`](../research.md),\nsedangkan keputusan fase lanjutan juga merujuk dokumen fase terkait.\n\n| ADR | Keputusan |\n|---|---|\n| [01](0001-prefix-stability.md) | Prefix stabil sebagai requirement kelas satu |\n| [02](0002-deterministic-routing.md) | Routing deterministik, bukan prediksi kualitas |\n| [03](0003-no-semantic-cache.md) | Tidak ada semantic caching di v1 |\n| [04](0004-local-model-role.md) | Model lokal adalah classifier, bukan agent |\n| [05](0005-sqlite-not-graph.md) | SQLite + FTS5 + sqlite-vec, bukan graph DB |\n| [06](0006-append-only-log.md) | Log append-only sebagai ground truth |\n| [07](0007-quarantine.md) | Tulisan model hosted masuk karantina |\n| [08](0008-adopt-durable-execution.md) | Adopsi durable execution, jangan bangun sendiri |\n| [09](0009-mcp-server-first.md) | Server MCP dulu; semua fungsi lewat tools |\n| [10](0010-tiered-sandbox.md) | Sandbox bertingkat; bukan "secure sandbox" |\n| [11](0011-rpa-controls.md) | RPA turun ke P2 dengan kontrol khusus |\n| [12](0012-idempotency.md) | Idempotency key wajib pada setiap efek samping |\n| [13](0013-counterfactual-cost.md) | Akuntansi biaya kontrafaktual |\n| [14](0014-pinned-models.md) | Pin versi model; canary harian |\n| [15](0015-mit-license.md) | Lisensi MIT; hindari sumber AGPL |\n| [16](0016-sync-reachability.md) | Sync v1 memakai tunnel pihak ketiga / self-hosted bridge |\n| [17](0017-temporal-for-flow.md) | Flow memakai Temporal untuk durable execution |\n| [18](0018-historical-ledger.md) | Historical Ledger adalah subsystem durable Hub |\n| [19](0019-ecx-agent-exchange.md) | ECX pointer-first untuk exchange internal agent |\n| [20](0020-connect-credential-vault.md) | Connect memiliki credential vault terenkripsi at-rest |\n| [21](0021-durable-spend-budget.md) | Connect melakukan durable reservation sebelum hosted spend |\n| [22](0022-provider-framework-and-runtime-abstraction.md) | Connect memakai provider framework + local runtime abstraction |\n| [23](0023-outbound-mcp-client-manager.md) | Connect memiliki outbound MCP client/manager dengan Hub governance |\n\nKeputusan yang mengubah invarian di [`../../AGENTS.md`](../../AGENTS.md) butuh ADR baru,\nbernomor urut, dengan konteks → keputusan → konsekuensi. Keputusan biasa cukup satu baris\ndi [`../DECISIONS.md`](../DECISIONS.md).\n''')

