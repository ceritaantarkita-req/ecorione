name: W101 Temp Prettier

on:
  push:
    branches:
      - fix/w09-w10-windows-pnpm-doctor-20260915

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print canonical formatted engine
        run: |
          pnpm exec prettier --write scripts/ecorione-engine.mjs
          echo '=== W101_PRETTIER_BEGIN ==='
          cat scripts/ecorione-engine.mjs
          echo '=== W101_PRETTIER_END ==='
