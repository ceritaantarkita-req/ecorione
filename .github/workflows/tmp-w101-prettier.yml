name: W101 Temp Prettier

on:
  push:
    branches:
      - fix/w09-w10-windows-pnpm-doctor-20260915

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical formatting and remove helper
        run: |
          pnpm exec prettier --write scripts/ecorione-engine.mjs
          rm .github/workflows/tmp-w101-prettier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ecorione-engine.mjs .github/workflows/tmp-w101-prettier.yml
          git commit -m "chore: apply canonical formatting"
          git push origin HEAD:fix/w09-w10-windows-pnpm-doctor-20260915
