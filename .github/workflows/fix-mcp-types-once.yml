name: Fix MCP Types Once
on:
  push:
    branches: [agent/outbound-mcp-manager-20260909]
    paths: [".github/workflows/fix-mcp-types-once.yml"]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/outbound-mcp-manager-20260909
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix exact optional and branded-id typing
        run: |
          python - <<'PY'
          from pathlib import Path

          def repl(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected match count for {path}: {old[:60]!r}")
              p.write_text(text.replace(old, new, 1))

          p = "services/connect/src/mcp-client/sdk-client.ts"
          repl(p,
              '''      transport = new StreamableHTTPClientTransport(new URL(config.transport.url), {\n        authProvider:\n          credentialRef === undefined\n            ? undefined\n            : {\n                token: async () => this.secret(credentialRef),\n              },\n      });\n''',
              '''      transport =\n        credentialRef === undefined\n          ? new StreamableHTTPClientTransport(new URL(config.transport.url))\n          : new StreamableHTTPClientTransport(new URL(config.transport.url), {\n              authProvider: {\n                token: async () => this.secret(credentialRef),\n              },\n            });\n''')
          repl(p,
              '''      transport = new StdioClientTransport({\n        command: config.transport.command,\n        args: [...config.transport.args],\n        cwd: config.transport.cwd,\n        env,\n        stderr: "pipe",\n      });\n''',
              '''      const parameters = {\n        command: config.transport.command,\n        args: [...config.transport.args],\n        env,\n        stderr: "pipe" as const,\n        ...(config.transport.cwd === undefined ? {} : { cwd: config.transport.cwd }),\n      };\n      transport = new StdioClientTransport(parameters);\n''')

          p = "services/connect/src/mcp-client/manager.test.ts"
          repl(p,
              '''    const result = await manager.discover("remote", {\n      ...discoverRequest,\n      operationId: "op_discover2",\n    });\n''',
              '''    const result = await manager.discover(\n      "remote",\n      McpDiscoverRequestSchema.parse({ ...discoverRequest, operationId: "op_discover2" }),\n    );\n''')
          repl(p,
              '''    await manager.discover("remote", {\n      ...discoverRequest,\n      workspaceId: "ws_b",\n      operationId: "op_b",\n    });\n    expect(factory.connectCount).toBe(2);\n    expect(manager.status("remote", "ws_a").connected).toBe(true);\n    expect(manager.status("remote", "ws_b").connected).toBe(true);\n''',
              '''    await manager.discover(\n      "remote",\n      McpDiscoverRequestSchema.parse({\n        ...discoverRequest,\n        workspaceId: "ws_b",\n        operationId: "op_b",\n      }),\n    );\n    expect(factory.connectCount).toBe(2);\n    expect(manager.status("remote", WorkspaceIdSchema.parse("ws_a")).connected).toBe(true);\n    expect(manager.status("remote", WorkspaceIdSchema.parse("ws_b")).connected).toBe(true);\n''')
          repl(p,
              'import { afterEach, describe, expect, it } from "vitest";\n',
              'import { WorkspaceIdSchema } from "@ecorione/shared-schema";\nimport { afterEach, describe, expect, it } from "vitest";\n')
          PY
      - run: pnpm exec prettier --write services/connect/src/mcp-client/sdk-client.ts services/connect/src/mcp-client/manager.test.ts
      - run: pnpm --filter @ecorione/connect exec tsc --noEmit
      - name: Commit fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/connect/src/mcp-client/sdk-client.ts services/connect/src/mcp-client/manager.test.ts
          git commit -m "fix: align outbound MCP strict types"
          git push origin HEAD:agent/outbound-mcp-manager-20260909
