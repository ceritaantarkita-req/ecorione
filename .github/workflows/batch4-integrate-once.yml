name: Batch 4 Integrate Once

on:
  push:
    branches:
      - agent/unified-capability-permission-plane-20260909
    paths:
      - .github/workflows/batch4-integrate-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/batch4-integrate-once.mjs
      - run: node scripts/batch4-typefix-once.mjs
      - run: pnpm exec prettier --write packages/shared-schema/src/capabilities.ts packages/shared-schema/src/chat.ts packages/shared-schema/src/flow.ts services/hub/src/capability-registry.ts services/hub/src/capability-registry.test.ts services/hub/src/extension-registry.ts services/hub/src/http.ts services/hub/src/orchestrate.ts services/hub/src/orchestrate.test.ts services/connect/src/mcp-client/governance.ts services/flow/src/activities.ts test/phase3-runtime.test.ts
      - run: pnpm run typecheck
      - run: pnpm exec vitest run packages/shared-schema/src/capabilities.test.ts services/hub/src/capability-registry.test.ts services/hub/src/capability-http.test.ts services/sandbox/src/executor.test.ts services/hub/src/extension-security.test.ts services/hub/src/extension-registry.test.ts services/hub/src/orchestrate.test.ts
      - name: Commit integrated source and remove helper
        run: |
          rm -f scripts/batch4-integrate-once.mjs scripts/batch4-typefix-once.mjs .github/workflows/batch4-integrate-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate unified authority across runtime boundaries"
          git push origin HEAD:agent/unified-capability-permission-plane-20260909
