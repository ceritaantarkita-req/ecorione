name: Batch 10 format fixture fix
on:
  push:
    branches:
      - agent/batch10-space-block-runtime-20260910
    paths:
      - '.github/workflows/batch10-format-fix.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/batch10-space-block-runtime-20260910
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write services/space/src/http.test.ts
      - name: Remove helper and commit
        run: |
          rm .github/workflows/batch10-format-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(batch10): format Flow resolution fixture' || exit 0
          git push origin HEAD:agent/batch10-space-block-runtime-20260910
