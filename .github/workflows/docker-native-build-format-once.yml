name: Docker Native Build Format Fix One-Time

on:
  push:
    branches:
      - fix/docker-native-build-and-hosted-trial-cleanup-20260928

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[format-helper]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format source contract
        run: pnpm exec prettier --write test/docker-native-build-source-contract.test.ts

      - name: Remove helper and commit deterministic format
        run: |
          set -euo pipefail
          git rm .github/workflows/docker-native-build-format-once.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format Docker native build contract [format-helper]"
          git push origin HEAD:fix/docker-native-build-and-hosted-trial-cleanup-20260928
