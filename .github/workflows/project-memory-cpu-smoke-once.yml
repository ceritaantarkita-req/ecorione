name: One-time Synthetic Memory CPU Smoke
on:
  push:
    branches:
      - fix/context-automatic-consolidation-20261014
    paths:
      - .github/workflows/project-memory-cpu-smoke-once.yml

permissions:
  contents: read
  statuses: write

jobs:
  cpu-memory-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OLLAMA_VULKAN: "false"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_MODELS: ${{ runner.temp }}/project-memory-ollama-models
      ECORIONE_LOCAL_REASONING_EFFORT: "none"
      ECORIONE_LOCAL_MAX_TOKENS: "768"
      ECORIONE_LOCAL_TEMPERATURE: "0"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Report synthetic evaluation started
        shell: bash
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context=project-memory-cpu-smoke \
            -f description="Synthetic CPU smoke running; not full Qwen9B/Hermes8B acceptance" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".node-version"
          cache: pnpm
      - name: Prepare isolated QA dependencies
        run: pnpm install --frozen-lockfile
      - name: Install checksum-pinned Ollama on ephemeral CPU
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 2 --fail --location --silent --show-error \
            "https://github.com/ollama/ollama/releases/download/v0.34.0/ollama-linux-amd64.tar.zst" \
            -o "$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          echo "cf95886728959aa09910bb34de5cca1cc5a8f68003b5597197d3f2c2d57c0804  $RUNNER_TEMP/ollama-linux-amd64.tar.zst" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ollama"
          tar --zstd -xf "$RUNNER_TEMP/ollama-linux-amd64.tar.zst" -C "$RUNNER_TEMP/ollama"
          echo "$RUNNER_TEMP/ollama/bin" >> "$GITHUB_PATH"
      - name: Start CPU Ollama and fetch small synthetic QA models
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ollama/bin/ollama" serve > "$RUNNER_TEMP/ollama-smoke.log" 2>&1 &
          for n in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 3 http://127.0.0.1:11434/api/tags >/dev/null
          ollama --version
          ollama pull qwen3.5:0.8b
          ollama pull hermes3:3b
          ollama list
      - name: Execute isolated Project Memory synthetic model smoke
        id: model_smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          echo "CPU SYNTHETIC SMOKE ONLY - not production GPU 9B/8B acceptance"
          node --import tsx scripts/project-memory-local-acceptance.mjs qwen3.5:0.8b hermes3:3b
      - name: Report model smoke verdict to commit status
        if: always()
        shell: bash
        env:
          QA_OUTCOME: ${{ steps.model_smoke.outcome }}
        run: |
          if [ "$QA_OUTCOME" = "success" ]; then
            state=success
            description="Synthetic 0.8B/3B CPU harness PASS; production 9B/8B not verified"
          else
            state=failure
            description="Synthetic 0.8B/3B CPU harness not PASS; inspect isolated logs"
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context=project-memory-cpu-smoke \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
