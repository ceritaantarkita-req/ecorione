name: Session 4E multi credential formatter

on:
  push:
    branches:
      - feat/session4e-multi-credential-foundation-20260930

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format multi-credential slice
        run: >
          pnpm exec prettier --write
          apps/ai/app/AiProviderConnectDialog.tsx
          apps/ai/app/settings/Settings.module.css
          apps/ai/app/settings/SettingsProviderSection.tsx
          apps/ai/app/settings/useSettingsController.ts
          scripts/pcs06-browser-acceptance.mjs
          services/connect/src/complete.ts
          services/connect/src/control-http.ts
          services/connect/src/credential-vault.test.ts
          services/connect/src/credential-vault.ts
          test/session4e-multi-credential-source-contract.test.ts
      - run: git diff --check
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/ai/app/AiProviderConnectDialog.tsx             apps/ai/app/settings/Settings.module.css             apps/ai/app/settings/SettingsProviderSection.tsx             apps/ai/app/settings/useSettingsController.ts             scripts/pcs06-browser-acceptance.mjs             services/connect/src/complete.ts             services/connect/src/control-http.ts             services/connect/src/credential-vault.test.ts             services/connect/src/credential-vault.ts             test/session4e-multi-credential-source-contract.test.ts
          git commit -m "style: format Session 4E multi-credential slice"
          git push origin HEAD:${GITHUB_REF_NAME}
