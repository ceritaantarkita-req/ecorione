name: ECX B5 Format Preview

on:
  pull_request:
    paths:
      - "scripts/ecx-round-trip-b5-evidence.mjs"
      - "services/hub/src/ecx-b5-observability.test.ts"
      - "services/hub/src/exchange-http.ts"
      - ".github/workflows/ecx-b5-format-preview.yml"

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write scripts/ecx-round-trip-b5-evidence.mjs services/hub/src/ecx-b5-observability.test.ts services/hub/src/exchange-http.ts
          git diff --no-ext-diff --unified=3 -- scripts/ecx-round-trip-b5-evidence.mjs services/hub/src/ecx-b5-observability.test.ts services/hub/src/exchange-http.ts
