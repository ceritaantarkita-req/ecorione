name: Batch 4 Chat Audit Testfix Once

on:
  push:
    branches:
      - agent/unified-capability-permission-plane-20260909
    paths:
      - .github/workflows/batch4-chat-audit-testfix-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/batch4-chat-audit-testfix-once.mjs
      - run: pnpm exec prettier --write test/chat-loop.test.ts
      - run: pnpm run typecheck
      - run: pnpm exec vitest run test/chat-loop.test.ts
      - name: Commit regression expectation and remove helper
        run: |
          rm -f scripts/batch4-chat-audit-testfix-once.mjs .github/workflows/batch4-chat-audit-testfix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: include authority audit event in chat loop"
          git push origin HEAD:agent/unified-capability-permission-plane-20260909
