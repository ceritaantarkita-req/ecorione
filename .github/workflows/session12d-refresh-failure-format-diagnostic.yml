name: Session12D Refresh Failure Format Diagnostic

on:
  push:
    branches:
      - test/session12d-drive-refresh-failure-preservation-20261003

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier output
        run: |
          echo '=== PRETTIER BEGIN ==='
          pnpm exec prettier test/session12d-google-drive-mock-acceptance.test.ts
          echo '=== PRETTIER END ==='
