          text = text.replace('import { registerMcpRoutes } from "./mcp.js";', 'import { registerMcpRoutes } from "./mcp.js";\nimport { registerVoiceRoutes } from "./voice-http.js";\nimport { RealtimeVoiceRuntime } from "./voice-runtime.js";\nimport { VoiceSessionStore } from "./voice-store.js";', 1)
          marker = '''  const deps: OrchestrateDeps = {
