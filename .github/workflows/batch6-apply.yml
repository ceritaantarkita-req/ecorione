name: Batch 6 Apply Realtime Voice

on:
  push:
    branches:
      - agent/batch6-realtime-voice-20260910
    paths:
      - .github/workflows/batch6-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/batch6-realtime-voice-20260910
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch realtime voice integration
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch marker in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Clean imports in the newly added runtime.
          replace_once(
              "services/hub/src/voice-runtime.ts",
              'import {\n  VoiceChunkConflictError,\n  VoiceSessionStore,\n  type VoiceSessionNotFoundError,\n} from "./voice-store.js";',
              'import type { VoiceSessionStore } from "./voice-store.js";',
          )
          replace_once(
              "services/hub/src/voice-runtime.ts",
              '\nexport { VoiceChunkConflictError, VoiceSessionStore };\nexport type { VoiceSessionNotFoundError };\n',
              '\n',
          )

          # Reuse Batch 5 route/authority logic; no second permission plane.
          replace_once(
              "services/hub/src/multimodal-http.ts",
              'function requestedRoutes(',
              'export function requestedRoutes(',
          )
          replace_once(
              "services/hub/src/multimodal-http.ts",
              'function authorizeInference(input: {',
              'export function authorizeInference(input: {',
          )

          # Chat orchestration can now execute through the existing local or hosted Connect path,
          # and accepts cancellation from a live voice generation.
          p = Path("services/hub/src/orchestrate.ts")
          text = p.read_text()
          text = text.replace('  type RetrievalHit,\n  type Timestamp,', '  type RetrievalHit,\n  type SyncClass,\n  type Timestamp,', 1)
          text = text.replace(
              '  init: { readonly method?: "GET" | "POST"; readonly body?: unknown } = {},',
              '  init: {\n    readonly method?: "GET" | "POST";\n    readonly body?: unknown;\n    readonly signal?: AbortSignal | undefined;\n  } = {},',
              1,
          )
          marker = 'interface CompleteResponse {\n  readonly reply: string;\n  readonly model: string;\n  readonly responseModel: string;\n  readonly cacheHit: boolean;\n  readonly usage: TokenUsage;\n  readonly cost: CallCostRecord;\n  readonly routeReason: string;\n}\n'
          if marker not in text:
              raise SystemExit("missing CompleteResponse marker")
          text = text.replace(
              marker,
              marker + 'export interface ChatExecutionOptions {\n  readonly target?: "hosted" | "local" | undefined;\n  readonly syncClass?: SyncClass | undefined;\n  readonly signal?: AbortSignal | undefined;\n  readonly sourceApp?: string | undefined;\n}\n',
              1,
          )
          old_sig = 'export async function chat(\n  deps: OrchestrateDeps,\n  req: ChatRequest,\n  now: Timestamp,\n): Promise<ChatResponse> {\n  const operationId: OperationId = makeId("operation");'
          new_sig = 'export async function chat(\n  deps: OrchestrateDeps,\n  req: ChatRequest,\n  now: Timestamp,\n  options: ChatExecutionOptions = {},\n): Promise<ChatResponse> {\n  const target = options.target ?? "hosted";\n  const hosted = target === "hosted";\n  const syncClass = options.syncClass ?? (hosted ? "CLOUD_ALLOWED" : "LOCAL_ONLY");\n  const operationId: OperationId = makeId("operation");'
          if old_sig not in text:
              raise SystemExit("missing chat signature marker")
          text = text.replace(old_sig, new_sig, 1)

          start = text.index('  const workspaceId = req.workspaceId ?? assertId("workspace", "ws_personal");')
          end_marker = '  if (authority.outcome === "DENY") {\n    throw new CapabilityAuthorityDeniedError(authority.reason);\n  }\n'
          end = text.index(end_marker, start) + len(end_marker)
          authority = '''  const workspaceId = req.workspaceId ?? assertId("workspace", "ws_personal");
          const capabilityId = (hosted ? "model.invoke.hosted" : "model.invoke.local") as CapabilityId;
          const permissionIds = (hosted
            ? ["model.invoke", "network.connect", "provider.spend"]
            : ["model.invoke", "execution.local"]) as PermissionId[];
          const authority = deps.authority.authorize({
            operationId,
            workspaceId,
            subject: { kind: "model", id: target },
            capabilityId,
            permissionIds,
            scope: req.scope,
            sensitivity: req.maxSensitivity,
            autonomy: req.autonomy,
          });
          deps.repo.recordAuditEvent({
            type: authority.outcome === "ALLOW" ? "CAPABILITY_AUTHORIZED" : "CAPABILITY_DENIED",
            operationId,
            module: "Hub",
            detail: {
              workspaceId,
              subject: { kind: "model", id: target },
              capabilityId,
              permissionIds,
              scope: req.scope,
              sensitivity: req.maxSensitivity,
              outcome: authority.outcome,
            },
            now,
          });
          if (authority.outcome === "DENY") {
            throw new CapabilityAuthorityDeniedError(authority.reason);
          }
          '''
          text = text[:start] + authority + text[end:]
          text = text.replace('    syncClass: "CLOUD_ALLOWED",', '    syncClass,', 1)
          text = text.replace(
              '  // Chat Fase 1 is hosted. Only memory explicitly eligible for hosted plaintext egress may leave the machine.\n',
