      - name: Write Batch 6 architecture docs
        run: |
          cat > docs/adr/0027-realtime-voice.md <<'EOF'
          # ADR-27 — Realtime Voice

          Status: Accepted — Batch 6 implementation

          ## Context

          Batch 5 established the native speech primitives: normalized STT/TTS through Connect, Hub-owned authority, SyncClass egress checks, cumulative hosted spend guards, Context/History provenance, and explicit local/hosted routing. Realtime voice must add low-latency conversation without creating a second provider gateway, permission plane, memory source, or durability engine.

          Persisting every microphone frame into Artifact would create a high-cardinality blob stream that is neither useful memory nor a stable user artifact. Conversely, keeping every realtime state only in browser memory would make ordering, audit, reconnect, and fail-closed restart behavior unverifiable.

          ## Decision

          1. Hub owns realtime voice session coordination. A durable SQLite session record tracks lifecycle, generation, monotonic client sequence, language mode, VAD configuration, and append-only event metadata.
          2. Audio uplink is chunked `audio/*` with explicit `clientSequence`. Each chunk has an immutable receipt/fingerprint. Exact completed replay is safe; same sequence with different bytes or ambiguous PROCESSING/FAILED receipt fails closed.
          3. Browser VAD is the first speech boundary. Hub does not trust it for security: MIME, schema, ordering, capability, SyncClass, Connect routing, credential, kill-switch, and spend controls are still re-evaluated server-side.
          4. Speech chunks use Batch 5 `/v1/multimodal/infer` STT. Normalized language metadata drives `auto` Indonesian/English switching. Explicit `id` or `en` pins the language.
          5. Final transcript enters the normal Hub chat path, so user/assistant text, Context memory, Historical Ledger, authority, provider accounting, and RnD tracing do not get a voice-specific duplicate implementation. Voice may select the existing local or hosted Connect completion target.
          6. Assistant text is delivered downstream incrementally as bounded `assistant.delta` events. The current provider completion contract remains request/response; therefore Batch 6 guarantees realtime incremental downstream delivery, not provider-native first-token streaming. Provider-native token streaming may be added later only if it preserves exact cache, cost, reservation, and final-state semantics.
          7. Each text delta is synthesized through Batch 5 TTS and delivered as transient `assistant.audio`. Durable voice events retain only audio metadata. Raw live microphone/TTS bytes are intentionally not duplicated into the durable voice event database.
          8. Server-Sent Events provide ordered downlink events while chunk POSTs provide the uplink. Together they form a duplex application transport without introducing a second RPC authority boundary.
          9. Barge-in increments a generation counter and aborts the active request chain. Stale generations are never emitted after interruption. AbortSignal is propagated Hub → Connect → local/hosted completion and STT/TTS fetches.
          10. Open live sessions are not adopted after a Hub process restart. They are marked FAILED with an append-only restart event; clients must explicitly start a new live session.
          11. Latency events record model latency, first TTS-chunk latency, end-to-end latency, and barge-in count. STT chunk latency is recorded with partial transcript events. These are telemetry facts, not performance claims.

          ## Consequences

          - Batch 6 reuses the security/cost/provider boundaries already proven in Batch 4–5.
          - Final conversational text remains reconstructable from Historical Ledger/Context without storing raw live audio.
          - Reconnect can replay durable transcript/state events; already-delivered transient audio is not guaranteed after process loss.
          - A browser can stop audible output immediately on barge-in while server cancellation prevents stale provider/TTS work where the underlying fetch honors AbortSignal.
          - Realtime voice does not create a new durable workflow engine; long-running workflow durability remains Temporal/Flow's domain.
          EOF

          cat > docs/voice-operations.md <<'EOF'
          # Realtime Voice Operations — Batch 6

          ## Boundary

          `Ai microphone/VAD -> Hub voice session -> Connect STT -> Hub chat -> Connect model -> Connect TTS -> Hub SSE -> Ai playback`

          Hub owns session/order/audit. Connect owns model/STT/TTS runtime and credentials. Context/History keep final conversational semantics/provenance. Raw live audio is transient transport data.

          ## Endpoints

          - `POST /v1/voice/sessions` — create/idempotently reopen the same configuration.
          - `POST /v1/voice/chunks` — monotonic audio uplink with `clientSequence`.
          - `POST /v1/voice/interrupt` — explicit barge-in/cancel.
          - `POST /v1/voice/close` — close the live session.
          - `GET /v1/voice/events?sessionId=...&after=N` — finite event replay/debug view.
          - `GET /v1/voice/stream?sessionId=...&after=N` — ordered SSE downlink.

          Ai exposes same-origin proxy routes under `/api/voice/*`; `lib/voice-client.ts` provides microphone capture, VAD, PCM16 WAV chunking, SSE handling, and audio playback without introducing a separate UI contract.

          ## Session lifecycle

          Normal path: `LISTENING -> THINKING -> SPEAKING -> LISTENING`. Barge-in moves through `INTERRUPTED`, increments generation, aborts stale work, then returns to `LISTENING`. `CLOSED` and `FAILED` are terminal for audio chunks.

          A Hub restart marks any non-terminal live session `FAILED`. This is deliberate: a realtime stream cannot be truthfully adopted after process loss when transient audio buffers no longer exist.

          ## VAD and chunking

          Default client VAD: RMS threshold `0.02`, silence `700 ms`, chunk target `800 ms`. These are user-adjustable transport parameters, not security controls. Server still validates MIME, body schema, ordering, authority, and routing.

          ## Language

          `languageMode=auto` follows normalized STT language when it is confidently `id` or `en`; `mixed/unknown` retain the current language. Explicit `id`/`en` disables automatic switching. The active language is used for TTS.

          ## Routing and privacy

          The voice session uses the existing Batch 5 `route` object. STT/TTS can use explicit hosted fallback exactly as Batch 5 permits. The assistant model uses the preferred route directly; it does not silently retry a completed/partially-recorded chat turn on another provider. Hosted paths still require cloud-eligible SyncClass, Hub grants, Connect credentials, cost kill switch, and durable spend reservation.

          ## Streaming semantics

          STT is incremental per audio chunk. Assistant text/audio is streamed from Hub to the browser as ordered events. The current Connect chat provider contract produces a completed model reply before Hub slices it into downstream deltas; this baseline intentionally does not claim provider-native first-token streaming.

          ## Failure / replay rules

          - Exact completed audio-chunk replay returns the prior ack.
          - Same `clientSequence` with different payload is HTTP 409.
          - PROCESSING/FAILED chunk replay is treated as ambiguous and fails closed.
          - Missing sequence gaps are HTTP 409.
          - Stale generations are suppressed after interruption.
          - Durable voice events never store `audioBase64`; only in-process live delivery overlays transient audio bytes.
          EOF

          python <<'PY'
          from pathlib import Path
          p = Path("docs/adr/README.md")
          text = p.read_text().replace("Dua puluh enam keputusan", "Dua puluh tujuh keputusan", 1)
          marker = '| [26](0026-native-multimodal-pipeline.md) | Native multimodal memakai Artifact/Context/Connect/Hub owner boundaries + explicit hosted fallback |\n'
          if marker not in text:
              raise SystemExit("missing ADR 26 row")
          text = text.replace(marker, marker + '| [27](0027-realtime-voice.md) | Realtime voice memakai Hub session/SSE + Batch 5 STT/TTS dengan barge-in generation cancellation |\n', 1)
          p.write_text(text)

