          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one work-plan marker, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/w17-doc-sync-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/active-work-plan.md .github/workflows/w17-doc-sync-once.yml
          git diff --cached --check
          git commit -m "docs(w17): sync formal local closure status"
          git push origin HEAD:docs/w17-closure-sync-20260916
