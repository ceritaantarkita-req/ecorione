        with:
          ref: docs/w17-closure-sync-20260916
          fetch-depth: 0
      - name: Sync active work plan to verified W17 closure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/active-work-plan.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
          ('''current main repo-verified baseline: 504e6aef86092d6f398ff290a40f77593c8882ca
PR #112: merged — W16 automatic semantic ECX reference selector
