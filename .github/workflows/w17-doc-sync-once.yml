          ('''W16 is now merged and green on `main`. The automatic semantic selector supports bounded `selection: { mode: "semantic-v1", maxRefs }` hydration without requiring caller/oracle-supplied `refIndexes`, while preserving the explicit-index compatibility path and existing hydration policy/budget gates.''', '''W16 remains merged and green on `main`. W17 is now closed on top of that selector: the formal fail-closed local run completed 100 measured calls across full-inline, all-ref, automatic no-oracle, and oracle-control lanes with 5/5 task gates, selector recall 1, zero cache hits, and verified immutable `qwen3.5:9b` identity. Automatic-selector evidence remains bounded and does not establish hosted billed-cost or end-to-end network savings.'''),
          ('''| W17 | ECX no-oracle validation | **STARTED — HARNESS READY / REAL LOCAL RUN PENDING** | Four-lane full/all/auto/oracle harness + 5/5 fixture selector recall contract ready; formal real local-model run belum dilakukan. |''', '''| W17 | ECX no-oracle validation | **DONE — VERIFIED LOCAL MODEL PASS (100 CALLS)** | 5 tasks × 5 repeats × 4 lanes; 5/5 task gates; auto selector recall 1; cache hits 0; immutable `qwen3.5:9b` verified; bounded local evidence only. |'''),
