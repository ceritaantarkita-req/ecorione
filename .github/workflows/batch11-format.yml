name: Batch 11 exact formatter

on:
  push:
    branches: [agent/batch11-production-ops-observability-20260910]
    paths:
      - .github/workflows/batch11-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/batch11-production-ops-observability-20260910
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write services/connect/src/operations.test.ts
      - run: pnpm exec prettier --check services/connect/src/operations.test.ts
      - name: Commit exact formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/connect/src/operations.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'style(batch11): apply exact Prettier formatting'
          git push origin HEAD:agent/batch11-production-ops-observability-20260910
