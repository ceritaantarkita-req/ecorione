name: Batch 8 Tracker Integrate

on:
  push:
    branches: [agent/batch8-data-governance-dr-20260910]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/batch8-data-governance-dr-20260910
      - name: Update canonical execution tracker
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("docs/EXECUTION-PROGRESS.md")
          s = p.read_text()
          s = s.replace(
              '- Batch 7 status: **CLOSED**\n- next implementation target: **Batch 8 — Dataset Governance + Backup / Restore / DR**',
              '- Batch 7 status: **CLOSED**\n- Batch 8 status: **IN PROGRESS**\n- active implementation branch: `agent/batch8-data-governance-dr-20260910`'
          )
          old = (
              '## Batch 8 — Dataset Governance + Backup / Restore / DR\n\n'
              'Status: **PLANNED**\n\n'
              'Dataset governance:\n\n'
              '- registry\n- schema/version\n- lineage/source\n- immutable releases\n- dedupe\n'
              '- PII/secret sanitation\n- train/eval/regression split bila relevan\n- quality checks\n\n'
              'Operations:\n\n'
              '- backup service data\n- vault-safe backup\n- restore\n- integrity verification\n'
              '- disaster recovery procedure\n- recovery drill\n\n---\n'
          )
          new = (
              '## Batch 8 — Dataset Governance + Backup / Restore / DR\n\n'
              'Status: **IN PROGRESS**\n\n'
              'Dataset governance:\n\n'
              '- registry\n- schema/version\n- lineage/source\n- immutable releases\n- dedupe\n'
              '- PII/secret sanitation\n- train/eval/regression split bila relevan\n- quality checks\n\n'
              'Operations:\n\n'
              '- backup service data\n- vault-safe backup\n- restore\n- integrity verification\n'
              '- disaster recovery procedure\n- recovery drill\n\n'
              'Implementation branch: `agent/batch8-data-governance-dr-20260910`\n\n'
              'Current implementation boundary:\n\n'
              '- RnD-owned immutable dataset registry + content-identified releases;\n'
              '- explicit schema/version + source lineage digests;\n'
              '- deterministic secret/email/phone/Bearer sanitation baseline before release;\n'
              '- governed-payload dedupe + deterministic group-safe train/eval/regression split;\n'
              '- dataset quality report + tamper detection + registry crash self-heal;\n'
              '- owner-scoped backup manifest with per-file SHA-256 + aggregate digest;\n'
              '- SQLite online backup adapters for Context, Hub, RnD, Sync, and Space;\n'
              '- directory/bundle backup + staged restore for Artifact, Sandbox, RnD datasets, and Connect state;\n'
              '- Connect credential vault backup as ciphertext only; master key remains out-of-band;\n'
              '- pre-restore safety backup + operation lock + post-restore digest verification;\n'
              '- Flow DR remains Temporal-persistence responsibility; no second durability store;\n'
              '- documented separate-failure-domain requirement for production DR.\n\n'
              'Pre-PR evidence:\n\n'
              '- integration gate `34428172190`: Format, Lint, root Typecheck, focused Batch 8 regression PASS;\n'
              '- hardening gate `34428476195`: Format, Lint, root Typecheck, empty-directory recovery, dataset registry crash self-heal, RnD dataset restore, Context SQLite recovery drill, Connect vault-safe backup/restore regression PASS;\n'
              '- temporary integration/hardening workflows self-delete and are not part of the candidate tree.\n\n'
              'Batch 8 remains **IN PROGRESS** until exact-head PR gates, merge, and post-merge verification satisfy the closure definition.\n\n---\n'
          )
          if old not in s:
              raise SystemExit("Batch 8 tracker block not found")
          p.write_text(s.replace(old, new))
          PY
      - name: Remove helper and commit tracker
        run: |
          rm .github/workflows/batch8-tracker-integrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/EXECUTION-PROGRESS.md .github/workflows/batch8-tracker-integrate.yml
          git commit -m "docs: record Batch 8 implementation progress"
          git push origin HEAD:agent/batch8-data-governance-dr-20260910
