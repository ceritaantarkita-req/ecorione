name: Batch 6 Apply Realtime Voice v3

on:
  push:
    branches:
      - agent/batch6-realtime-voice-20260910
    paths:
      - .github/workflows/batch6-apply-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/batch6-realtime-voice-20260910
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Batch 6 integration
        run: |
          python scripts/batch6-apply.py
          python scripts/batch6-exact-optional-fix.py
      - name: Format Batch 6 candidate
        run: |
          pnpm exec prettier --write \
            packages/shared-schema/src/voice.ts packages/shared-schema/src/index.ts \
            services/hub/src/voice-store.ts services/hub/src/voice-runtime.ts services/hub/src/voice-http.ts \
            services/hub/src/voice-store.test.ts services/hub/src/voice-runtime.test.ts \
            services/hub/src/multimodal-http.ts services/hub/src/orchestrate.ts services/hub/src/http.ts \
            services/connect/src/providers/local.ts services/connect/src/providers/local-runtime.ts \
            services/connect/src/providers/anthropic.ts services/connect/src/providers/openai-compatible.ts \
            services/connect/src/providers/openai.ts services/connect/src/providers/openrouter.ts \
            services/connect/src/providers/hosted.ts services/connect/src/complete.ts \
            services/connect/src/multimodal.ts services/connect/src/http.ts \
            apps/ai/lib/voice-client.ts apps/ai/lib/voice-client.test.ts \
            apps/ai/app/api/voice/session/route.ts apps/ai/app/api/voice/chunk/route.ts \
            apps/ai/app/api/voice/interrupt/route.ts apps/ai/app/api/voice/close/route.ts \
            apps/ai/app/api/voice/stream/route.ts docs/adr/0027-realtime-voice.md \
            docs/voice-operations.md docs/adr/README.md docs/DECISIONS.md docs/EXECUTION-PROGRESS.md
      - name: Typecheck
        run: pnpm typecheck
      - name: Focused voice regression
        run: pnpm vitest run services/hub/src/voice-store.test.ts services/hub/src/voice-runtime.test.ts apps/ai/lib/voice-client.test.ts
      - name: Remove helpers and commit
        run: |
          git rm .github/workflows/batch6-apply.yml .github/workflows/batch6-apply-v2.yml .github/workflows/batch6-apply-v3.yml \
            scripts/batch6-apply.py scripts/batch6-exact-optional-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: Batch 6 realtime voice baseline"
          git push origin HEAD:agent/batch6-realtime-voice-20260910
