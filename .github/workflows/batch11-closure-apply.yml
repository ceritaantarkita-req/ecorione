name: Batch 11 closure tracker updater

on:
  push:
    branches: [docs/batch11-closure-20260910]
    paths:
      - .github/workflows/batch11-closure-apply.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/batch11-closure-20260910
      - name: Update canonical tracker
        run: python scripts/batch11-closure.py
      - name: Commit tracker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/EXECUTION-PROGRESS.md
          git diff --cached --check
          git commit -m 'docs: close Batch 11 in execution tracker'
          git push origin HEAD:docs/batch11-closure-20260910
