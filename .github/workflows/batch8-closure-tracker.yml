name: Batch 8 Closure Tracker Integrate

on:
  push:
    branches: [agent/batch8-closure-20260910]

permissions:
  contents: write

concurrency:
  group: batch8-closure-tracker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/batch8-closure-20260910
      - name: Close Batch 8 in canonical tracker
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit closure tracker and remove helper
        run: |
          rm .github/workflows/batch8-closure-tracker.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/EXECUTION-PROGRESS.md docs/verification/batch8-closure-2026-09-10.md .github/workflows/batch8-closure-tracker.yml
          git commit -m "docs: close Batch 8 and advance to Batch 9"
          git push origin HEAD:agent/batch8-closure-20260910
