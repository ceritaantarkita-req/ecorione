name: Post-402 final formatter

on:
  push:
    branches:
      - fix/post402-stabilization-20260930

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write \
            apps/ai/app/settings/SettingsProviderSection.tsx \
            services/connect/src/providers/openrouter.test.ts
      - run: git diff --check
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ai/app/settings/SettingsProviderSection.tsx services/connect/src/providers/openrouter.test.ts
          git commit -m "style: format final post-402 stabilization"
          git push origin HEAD:${GITHUB_REF_NAME}
