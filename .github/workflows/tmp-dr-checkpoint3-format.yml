name: Temporary DR checkpoint3 formatter

on:
  push:
    branches:
      - ops/offhost-dr-recovery-checkpoint3-20260922

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ops/offhost-dr-recovery-checkpoint3-20260922
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format checkpoint3 sources/docs and self-remove
        run: |
          set -euo pipefail
          pnpm exec prettier --write             AGENTS.md             deploy/compose.dr-recovery.yml             docs/EXECUTION-PROGRESS.md             docs/README.md             docs/active-work-plan.md             docs/current-state-and-next-steps.md             docs/offhost-dr-recovery.md             docs/verification/offhost-dr-checkpoint-2-2026-09-22.md             docs/verification/offhost-dr-checkpoint-3-2026-09-22.md             package.json             scripts/staging-offhost-dr-acceptance.mjs             scripts/staging-offhost-dr-local-smoke.mjs             scripts/staging-offhost-dr-reboot-evidence.mjs             test/offhost-dr-source-contract.test.ts
          git rm .github/workflows/tmp-dr-checkpoint3-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             AGENTS.md             deploy/compose.dr-recovery.yml             docs/EXECUTION-PROGRESS.md             docs/README.md             docs/active-work-plan.md             docs/current-state-and-next-steps.md             docs/offhost-dr-recovery.md             docs/verification/offhost-dr-checkpoint-2-2026-09-22.md             docs/verification/offhost-dr-checkpoint-3-2026-09-22.md             package.json             scripts/staging-offhost-dr-acceptance.mjs             scripts/staging-offhost-dr-local-smoke.mjs             scripts/staging-offhost-dr-reboot-evidence.mjs             test/offhost-dr-source-contract.test.ts
          git diff --cached --check
          git commit -m "style: format off-host DR checkpoint 3"
          git push origin HEAD:ops/offhost-dr-recovery-checkpoint3-20260922
