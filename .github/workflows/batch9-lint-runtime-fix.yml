name: Batch 9 lint runtime fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/batch9-node-registry-canvas-20260910'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch lint and Space owner runtime wiring
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'services/flow/src/graph-activities.ts';
          let text = fs.readFileSync(path, 'utf8');
          text = text.replace('  type FlowGraphId,\n', '');
          text = text.replace('  type FlowGraphNode,\n', '');
          if (!text.includes('readonly spaceUrl: string;')) {
            text = text.replace('  readonly artifactUrl: string;\n', '  readonly artifactUrl: string;\n  readonly spaceUrl: string;\n');
          }
          if (!text.includes('space: config.spaceUrl')) {
            text = text.replace('    artifact: config.artifactUrl,\n', '    artifact: config.artifactUrl,\n    space: config.spaceUrl,\n');
          }
          fs.writeFileSync(path, text);
          NODE
      - run: pnpm exec prettier --write services/flow/src/graph-activities.ts
      - run: pnpm run lint
      - name: Commit patch
        run: |
          git config user.name 'ecorione-batch9-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add services/flow/src/graph-activities.ts
          git commit -m 'fix(flow): close Batch 9 lint and Space owner wiring'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
