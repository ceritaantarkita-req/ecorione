name: Update Progress Close Batch 1 Once

on:
  push:
    branches: [agent/progress-close-batch1-20260909]
    paths:
      - ".github/workflows/update-progress-close-batch1-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/progress-close-batch1-20260909
      - name: Close Batch 1 in canonical tracker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("docs/EXECUTION-PROGRESS.md")
          text = p.read_text()

          main_pattern = re.compile(r'''### Main\n\n.*?\n### Active branch\n\n.*?\n---\n''', re.S)
          main_new = '''### Main\n\nCurrent `main` SHA after Phase 4 readiness hotfix merge:\n\n- `d79793977c9d4ea5d6e472ca4eeeabfed3259e60`\n\nCurrent `main` condition:\n\n- Format: PASS\n- Lint: PASS\n- Typecheck: PASS\n- Test: PASS\n- Secret Scan: PASS\n- Production Build: PASS\n- Naming: PASS\n\nPost-merge evidence:\n\n- PR #7 merged with expected-head lock\n- merge SHA: `d79793977c9d4ea5d6e472ca4eeeabfed3259e60`\n- main CI: `34350438424` — full green\n- the previously flaky forced Temporal crash/replacement acceptance passed in the full post-merge suite\n\n### Active branch\n\nNo implementation branch is active at this checkpoint. **Batch 2 — Outbound MCP Client + MCP Manager** is the next planned execution batch.\n\n---\n'''
          text, count = main_pattern.subn(main_new, text, count=1)
          if count != 1:
              raise SystemExit(f"main/active section replacement count={count}")

          mcp_pattern = re.compile(r'''## 5\. External MCP HTTPS status\n\nStatus: \*\*IMPLEMENTED / CLOSURE PENDING\*\*''')
          text, count = mcp_pattern.subn('''## 5. External MCP HTTPS status\n\nStatus: **CLOSED**''', text, count=1)
          if count != 1:
              raise SystemExit(f"MCP status replacement count={count}")

          pending_sentence = '''Closure masih pending hanya karena post-merge `main` membuka Fase 4 Temporal flake yang tidak berasal dari MCP workstream.'''
          closed_sentence = '''Closure completed after the unrelated Fase 4 Temporal readiness flake was hardened in PR #7 and post-merge `main` CI `34350438424` passed fully. External MCP HTTPS implementation and its real public-network evidence remain unchanged.'''
          if pending_sentence not in text:
              raise SystemExit("MCP pending closure sentence not found")
          text = text.replace(pending_sentence, closed_sentence, 1)

          batch_pattern = re.compile(r'''## Batch 1 — Fase 4 Temporal CI Flake Hardening\n\n.*?\n---\n''', re.S)
          batch_new = '''## Batch 1 — Fase 4 Temporal CI Flake Hardening\n\nStatus: **CLOSED**\n\nGoal: restore deterministic full-green CI after the repeated forced-worker-recovery flake.\n\nImplemented:\n\n- OS child-process `spawn` is no longer treated as Temporal polling readiness\n- acceptance-only IPC readiness is emitted only after `Worker.getState()` reaches `RUNNING`\n- production behavior remains unchanged when the acceptance IPC env is disabled\n- readiness wait is bounded and fail-closed on terminal worker states\n- the process acceptance waits for explicit readiness for both the initial and replacement workers\n- forced crash remains `SIGKILL`; it was not weakened into graceful shutdown\n- durable Hub approval, commit-before-signal, AI, Sandbox, and RnD verification semantics remain intact\n\nEvidence:\n\n- originating main failure: `34346631709` — `Timed out waiting for durable Hub approval.`\n- repeated stress: `34349246133` — 3/3 real forced crash/replacement acceptance PASS\n- candidate code CI: `34349843284` — full green\n- final PR head: `3e2d224d49fa9ce80ed9ad653268a8e6425808c7`\n- final exact-head CI: `34350133864` — full green\n- PR #7 merge SHA: `d79793977c9d4ea5d6e472ca4eeeabfed3259e60`\n- post-merge main CI: `34350438424` — full green\n\nClosure result:\n\n- Phase 4 process acceptance is stable against the previously observed startup race\n- External MCP HTTPS workstream is also fully `CLOSED`\n- next execution target is Batch 2\n\n---\n'''
          text, count = batch_pattern.subn(batch_new, text, count=1)
          if count != 1:
              raise SystemExit(f"Batch 1 section replacement count={count}")

          text = text.replace(
              'Dari current state, sisa roadmap dibagi menjadi **12 batch besar** termasuk hotfix aktif sekarang.',
              'Dari current state, **Batch 1 sudah CLOSED**. Sisa roadmap aktif adalah **11 batch besar (Batch 2–12)**.',
              1,
          )
          text = text.replace('## Batch 2 — Outbound MCP Client + MCP Manager\n\nStatus: **PLANNED**', '## Batch 2 — Outbound MCP Client + MCP Manager\n\nStatus: **NEXT / PLANNED**', 1)
          text = text.replace('- **1 active hotfix batch**\n- **11 subsequent platform/production batches**\n- total: **±12 major batches** dari state saat file ini dibuat', '- **Batch 1: CLOSED**\n- **11 platform/production batches remaining (Batch 2–12)**\n- next: **Batch 2 — Outbound MCP Client + MCP Manager**', 1)

          p.write_text(text)
          PY
      - name: Commit canonical progress closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/EXECUTION-PROGRESS.md
          git commit -m "docs: close Batch 1 and external MCP progress"
          git push origin HEAD:agent/progress-close-batch1-20260909
