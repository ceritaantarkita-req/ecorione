name: TEMP UX Typecheck Diagnostic

on:
  push:
    branches:
      - feat/ux-product-validation-20260912

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ux-product-validation-20260912
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture typecheck output
        run: |
          pnpm typecheck > ux-typecheck-output.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ux-typecheck-output.txt
          git commit -m "chore: capture UX typecheck output"
          git push origin HEAD:feat/ux-product-validation-20260912
