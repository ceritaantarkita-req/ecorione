name: TEMP Flow State Patch

on:
  push:
    branches:
      - fix/frontend-interaction-state-20260912

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/frontend-interaction-state-20260912
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply and format flow patch
        run: |
          python scripts/temp-frontend-flow-state-patch.py
          pnpm exec prettier --write apps/ai/app/flow/page.tsx apps/ai/app/ops/page.tsx apps/ai/app/ProductNav.tsx
          git rm scripts/temp-frontend-flow-state-patch.py .github/workflows/temp-flow-state-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ai/app/flow/page.tsx apps/ai/app/ops/page.tsx apps/ai/app/ProductNav.tsx
          git commit -m "fix: harden frontend async interaction states"
          git push origin HEAD:fix/frontend-interaction-state-20260912
