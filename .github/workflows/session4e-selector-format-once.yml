name: Session 4E selector formatter

on:
  push:
    branches:
      - feat/session4e-provider-model-selectors-20260930

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format selector slice
        run: >
          pnpm exec prettier --write
          apps/ai/app/page.tsx
          apps/ai/app/useChatModelRouting.ts
          apps/ai/lib/chat-model-routing.ts
          apps/ai/lib/chat-model-routing.test.ts
          scripts/pcs06-browser-acceptance.mjs
          test/pcs03-local-runtime-source-contract.test.ts
          test/pcs04-visual-ia-source-contract.test.ts
          test/pcs06-browser-acceptance-source-contract.test.ts
      - run: git diff --check
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/ai/app/page.tsx             apps/ai/app/useChatModelRouting.ts             apps/ai/lib/chat-model-routing.ts             apps/ai/lib/chat-model-routing.test.ts             scripts/pcs06-browser-acceptance.mjs             test/pcs03-local-runtime-source-contract.test.ts             test/pcs04-visual-ia-source-contract.test.ts             test/pcs06-browser-acceptance-source-contract.test.ts
          git commit -m "style: format Session 4E selector slice"
          git push origin HEAD:${GITHUB_REF_NAME}
