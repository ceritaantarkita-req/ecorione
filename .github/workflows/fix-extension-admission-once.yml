name: Fix Extension Admission Once

on:
  push:
    branches: [agent/plugin-extension-framework-20260909]
    paths: [".github/workflows/fix-extension-admission-once.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/plugin-extension-framework-20260909
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/patch-extension-admission.py
      - run: pnpm exec prettier --write services/hub/src/extension-http.ts services/hub/src/extension-http.test.ts
      - run: pnpm exec tsc --build
      - run: pnpm exec vitest run services/hub/src/extension-http.test.ts services/hub/src/extension-registry.test.ts services/hub/src/extension-security.test.ts packages/shared-schema/src/extensions.test.ts
      - name: Commit admission fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/hub/src/extension-http.ts services/hub/src/extension-http.test.ts
          git diff --cached --quiet || git commit -m "fix: enforce extension security admission before policy"
          git push origin HEAD:agent/plugin-extension-framework-20260909
