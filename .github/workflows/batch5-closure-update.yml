name: Batch 5 Closure Update

on:
  pull_request:
    paths:
      - ".github/workflows/batch5-closure-update.yml"

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Freeze Batch 5 closure evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/EXECUTION-PROGRESS.md")
          text = path.read_text()

          old = '''### Main

          Batch 4 closure remains the current `main` baseline:

          - `b4df2c364874e6420b6008de7a330a1528546fed`
          - Batch 4 implementation merge: `455b5cef72d5847b67ddedebc81471432fb0ba42`
          - post-merge Batch 4 main CI `34380385839`: full green

          ### Active execution

          - Batch 1 status: **CLOSED**
          - Batch 2 status: **CLOSED**
          - Batch 3 status: **CLOSED**
          - Batch 4 status: **CLOSED**
          - Batch 5 status: **IMPLEMENTED / CLOSURE PENDING**
          - active branch: `agent/batch5-native-multimodal-20260910`
          - PR: **#15**
          - latest green implementation candidate: `66644a059d464b37af98894bdf3353b3e0e8a1a2`
          - candidate CI `34387285455`: full green
          - candidate MCP External HTTPS Acceptance `34387285379`: PASS
          - next after Batch 5 closure: **Batch 6 — Realtime Voice**'''
          new = '''### Main

          Batch 5 implementation is merged and post-merge verified on `main`:

          - implementation PR #15 merge: `2226493ae54ed83315a9f84fd3b72fe67c947157`
          - exact final PR head: `a202c74eea504b9c7220e0b45fc1d113d1ff1be9`
          - exact-head CI `34387886010`: full green
          - exact-head MCP External HTTPS Acceptance `34387885874`: PASS
          - post-merge main CI `34388114706`: full green

          ### Active execution

          - Batch 1 status: **CLOSED**
          - Batch 2 status: **CLOSED**
          - Batch 3 status: **CLOSED**
          - Batch 4 status: **CLOSED**
          - Batch 5 status: **CLOSED**
          - next implementation target: **Batch 6 — Realtime Voice**'''
          if old not in text:
              raise SystemExit("current state block not found")
          text = text.replace(old, new, 1)

          text = text.replace(
              '''Dari current state, **Batch 1–4 sudah CLOSED** dan **Batch 5 sudah implemented tetapi closure masih pending**. Setelah Batch 5 ditutup, tersisa **7 batch platform/production (Batch 6–12)**; next implementation target adalah **Batch 6 — Realtime Voice**.''',
              '''Dari current state, **Batch 1–5 sudah CLOSED**. Tersisa **7 batch platform/production (Batch 6–12)**; next implementation target adalah **Batch 6 — Realtime Voice**.''',
              1,
          )

          text = text.replace(
              '''## Batch 5 — Native Multimodal Pipeline

          Status: **IMPLEMENTED / CLOSURE PENDING**''',
              '''## Batch 5 — Native Multimodal Pipeline

          Status: **CLOSED**''',
              1,
          )

          old = '''Closure still required:

          - exact final PR head after this tracker update must remain green
          - PR #15 merge must use expected-head lock
          - merged `main` must pass post-merge CI/runtime gates
          - closure evidence must then be frozen in the canonical tracker before status changes to `CLOSED`'''
          new = '''Closure evidence:

          - final exact PR head: `a202c74eea504b9c7220e0b45fc1d113d1ff1be9`
          - exact-head CI `34387886010` — Naming, Format, Lint, Typecheck, Test, Phase 4 real-process acceptance, Secret Scan, Production Build PASS
          - exact-head MCP External HTTPS Acceptance `34387885874` — PASS
          - PR #15 merged with expected-head lock as `2226493ae54ed83315a9f84fd3b72fe67c947157`
          - `main` points to the expected merge
          - post-merge main CI `34388114706` — full green
          - no temporary Batch 5 helper workflow remains in the implementation tree

          Batch 5 resmi **CLOSED**; next implementation batch adalah Batch 6.'''
          if old not in text:
              raise SystemExit("closure block not found")
          text = text.replace(old, new, 1)

          text = text.replace(
              '''- **Batch 5: IMPLEMENTED / CLOSURE PENDING**
          - **7 future platform/production batches remain after closure (Batch 6–12)**''',
              '''- **Batch 5: CLOSED**
          - **7 platform/production batches remaining (Batch 6–12)**''',
              1,
          )

          old = '''**Immediate next:** selesaikan exact-head closure PR #15 untuk Batch 5, merge dengan expected-head lock, verifikasi post-merge `main`, lalu freeze closure evidence dan baru mulai **Batch 6 — Realtime Voice**.'''
          new = '''**Immediate next:** mulai **Batch 6 — Realtime Voice** dari baseline `main` setelah Batch 5 CLOSED, tanpa mengubah owner boundaries dan multimodal primitives yang sudah dibekukan di ADR-26.'''
          if old not in text:
              raise SystemExit("next action block not found")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Format tracker
        run: pnpm exec prettier --write docs/EXECUTION-PROGRESS.md

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/batch5-closure-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/EXECUTION-PROGRESS.md .github/workflows/batch5-closure-update.yml
          git commit -m "docs: close Batch 5 multimodal pipeline"
          git push origin "HEAD:${{ github.head_ref }}"
