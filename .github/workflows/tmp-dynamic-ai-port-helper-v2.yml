name: Dynamic Ai Port Refactor Helper v2

on:
  push:
    branches:
      - automation/dynamic-ai-port-helper-20260915

permissions:
  contents: write

jobs:
  build-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply dynamic Ai port architecture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def one(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected one match, got {n}")
              return text.replace(old, new, 1)

          def sub1(text, pattern, repl, label):
              out, n = re.subn(pattern, repl, text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f"{label}: expected one regex match, got {n}")
              return out

          # Engine: central port policy + runtime state + dynamic start/doctor.
          p = Path('scripts/ecorione-engine.mjs')
          t = p.read_text()
          t = one(t,
            'import { existsSync, mkdirSync, readFileSync, writeFileSync, copyFileSync } from "node:fs";',
            'import { existsSync, mkdirSync, readFileSync, writeFileSync, copyFileSync, rmSync } from "node:fs";',
            'engine fs import')
          anchor = '''const REQUIRED_SERVICES = [
            ["RnD", "http://127.0.0.1:17021/healthz"],
            ["Context", "http://127.0.0.1:17022/healthz"],
            ["Connect", "http://127.0.0.1:17023/healthz"],
            ["Hub", "http://127.0.0.1:17024/healthz"],
            ["Artifact", "http://127.0.0.1:17025/healthz"],
            ["Sandbox", "http://127.0.0.1:17026/healthz"],
            ["Space", "http://127.0.0.1:17027/healthz"],
            ["Flow", "http://127.0.0.1:17028/healthz"],
          ];'''
          replacement = anchor + '''
          export const DEFAULT_AI_PORT = 17020;
          export const AI_FALLBACK_PORTS = Object.freeze(
            Array.from({ length: 11 }, (_, index) => 17029 + index),
          );
          export const RESERVED_SERVICE_PORTS = Object.freeze(
            Array.from({ length: 8 }, (_, index) => 17021 + index),
          );'''
          t = one(t, anchor, replacement, 'engine constants')

          port_fn = '''export function isPortReachable(port, host = "127.0.0.1", timeoutMs = 750) {
            return new Promise((resolvePromise) => {
              const socket = connect({ port, host });
              let settled = false;
              const finish = (value) => {
                if (settled) return;
                settled = true;
                socket.destroy();
                resolvePromise(value);
              };
              socket.setTimeout(timeoutMs);
              socket.once("connect", () => finish(true));
              socket.once("timeout", () => finish(false));
              socket.once("error", () => finish(false));
            });
          }
          '''
          helpers = port_fn + '''
          export function aiUrl(port) {
            return `http://127.0.0.1:${String(port)}`;
          }

          export function resolvePreferredAiPort(env = process.env) {
            const raw = env.ECORIONE_AI_PORT;
            if (raw === undefined || String(raw).trim() === "") return DEFAULT_AI_PORT;
            const value = Number(String(raw).trim());
            if (!Number.isInteger(value) || value < 1 || value > 65535) {
              throw new Error(`ECORIONE_AI_PORT tidak valid: ${String(raw)}.`);
            }
            if (RESERVED_SERVICE_PORTS.includes(value)) {
              throw new Error(
                `ECORIONE_AI_PORT ${String(value)} bentrok dengan reserved service port 17021–17028.`,
              );
            }
            return value;
          }

          export function aiPortCandidates(preferredPort) {
            return [preferredPort, DEFAULT_AI_PORT, ...AI_FALLBACK_PORTS].filter(
              (port, index, values) =>
                !RESERVED_SERVICE_PORTS.includes(port) && values.indexOf(port) === index,
            );
          }

          export async function classifyAiPort(port) {
            if (!(await isPortReachable(port))) return "free";
            try {
              const response = await fetch(`${aiUrl(port)}/`, {
                redirect: "error",
                signal: AbortSignal.timeout(1_500),
              });
              const html = await response.text();
              if (/ecorione\\s*[—-]\\s*Ai/i.test(html)) return "ecorione";
            } catch {
              // A non-HTTP listener or unrelated application is still an occupied port.
            }
            return "occupied";
          }

          export async function selectAiPort(preferredPort, classify = classifyAiPort) {
            const collisions = [];
            for (const port of aiPortCandidates(preferredPort)) {
              const disposition = await classify(port);
              if (disposition === "free") {
                return { port, preferredPort, fallbackUsed: port !== preferredPort, collisions };
              }
              if (disposition === "ecorione") {
                throw new Error(
                  `ECORIONE sudah berjalan di ${aiUrl(port)}. Gunakan instance tersebut atau hentikan dulu sebelum start baru.`,
                );
              }
              collisions.push(port);
            }
            throw new Error(
              `Tidak ada Ai port kosong. Preferred ${String(preferredPort)} dan fallback 17020, 17029–17039 sedang terpakai.`,
            );
          }

          function runtimeStatePath(root = ROOT) {
            return resolve(root, ".ecorione", "runtime", "engine.json");
          }

          export function writeEngineRuntimeState(state, root = ROOT) {
            const path = runtimeStatePath(root);
            mkdirSync(dirname(path), { recursive: true });
            writeFileSync(path, `${JSON.stringify(state, null, 2)}\n`, {
              encoding: "utf8",
              mode: 0o600,
            });
            return path;
          }

          export function readEngineRuntimeState(root = ROOT) {
            const path = runtimeStatePath(root);
            if (!existsSync(path)) return null;
            try {
              const value = JSON.parse(readFileSync(path, "utf8"));
              if (
                value?.schemaVersion !== 1 ||
                !Number.isInteger(value?.aiPort) ||
                value.aiPort < 1 ||
                value.aiPort > 65535 ||
                value?.aiUrl !== aiUrl(value.aiPort)
              ) {
                return null;
              }
              return value;
            } catch {
              return null;
            }
          }

          export function clearEngineRuntimeState(root = ROOT) {
            rmSync(runtimeStatePath(root), { force: true });
          }

          export function resolveAiRuntime(env = process.env, root = ROOT) {
            const state = readEngineRuntimeState(root);
            if (state) {
              return {
                port: state.aiPort,
                url: state.aiUrl,
                preferredPort: state.preferredAiPort,
                fallbackUsed: state.fallbackUsed === true,
                source: "runtime-state",
              };
            }
            const preferredPort = resolvePreferredAiPort(env);
            return {
              port: preferredPort,
              url: aiUrl(preferredPort),
              preferredPort,
              fallbackUsed: false,
              source: "config",
            };
          }
          '''
          t = one(t, port_fn, helpers, 'engine helpers')
          t = one(t,
            '  console.log(`${(await isPortReachable(3000)) ? "✓" : "·"} Ai http://127.0.0.1:3000`);',
            '''  const aiRuntime = resolveAiRuntime(env);
            const aiDisposition = await classifyAiPort(aiRuntime.port);
            const aiSuffix =
              aiDisposition === "occupied"
                ? " (port occupied by another application)"
                : aiRuntime.fallbackUsed
                  ? ` (fallback from ${String(aiRuntime.preferredPort)})`
                  : "";
            console.log(`${aiDisposition === "ecorione" ? "✓" : "·"} Ai ${aiRuntime.url}${aiSuffix}`);''',
            'doctor ai')

          start = '''async function start() {
            const local = ensureLocalEnv();
            if (local.created) console.log("✓ .env dibuat dari .env.example");
            for (const key of local.generated)
              console.log(`✓ ${key} dibuat otomatis untuk local-only runtime`);
            const env = { ...local.values, ...process.env };
            const preferredAiPort = resolvePreferredAiPort(env);
            const selectedAi = await selectAiPort(preferredAiPort);
            for (const occupiedPort of selectedAi.collisions) {
              console.log(
                `· Ai port ${String(occupiedPort)} dipakai aplikasi lain; mencoba fallback ECORIONE…`,
              );
            }
            if (selectedAi.fallbackUsed) {
              console.log(
                `✓ Ai fallback port ${String(selectedAi.port)} dipilih (preferred ${String(preferredAiPort)})`,
              );
            }

            const runtimeEnv = {
              ...env,
              ECORIONE_AI_PORT: String(selectedAi.port),
              PORT: String(selectedAi.port),
            };
            const runtimeBase = {
              schemaVersion: 1,
              enginePid: process.pid,
              preferredAiPort,
              aiPort: selectedAi.port,
              aiUrl: aiUrl(selectedAi.port),
              fallbackUsed: selectedAi.fallbackUsed,
              collisions: selectedAi.collisions,
              startedAt: new Date().toISOString(),
            };
            clearEngineRuntimeState();
            writeEngineRuntimeState({ ...runtimeBase, status: "starting" });

            let temporalChild = null;
            try {
              temporalChild = await ensureTemporal(runtimeEnv);
              console.log("• Menyalakan full Phase 4 stack…");
              const pnpmInvocation = resolveCommandInvocation(
                "pnpm",
                ["run", "dev:phase4"],
                process.platform,
                runtimeEnv,
              );
              const child = spawn(pnpmInvocation.command, pnpmInvocation.args, {
                cwd: ROOT,
                env: runtimeEnv,
                stdio: "inherit",
                windowsHide: true,
              });
              const lifecycle = waitForSpawnedChild(child);
              const token = runtimeEnv.ECORIONE_INTERNAL_TOKEN ?? "";
              const readiness = Promise.all([
                waitForPort(selectedAi.port, 90_000, "Ai"),
                waitForRequiredServices(token, 90_000),
              ]).then(() => ({ ready: true }));

              let first;
              try {
                first = await Promise.race([readiness, lifecycle]);
              } catch (error) {
                await stopSpawnedChild(child);
                if (temporalChild) await stopSpawnedChild(temporalChild);
                throw error;
              }

              if ("ready" in first) {
                const url = aiUrl(selectedAi.port);
                writeEngineRuntimeState({
                  ...runtimeBase,
                  status: "ready",
                  readyAt: new Date().toISOString(),
                });
                console.log(`\n✓ ECORIONE ready: ${url}`);
                console.log("  Tekan Ctrl+C untuk menghentikan proses development stack.\n");
                openBrowser(url);
                const finished = await lifecycle;
                if (temporalChild) await stopSpawnedChild(temporalChild);
                if ("error" in finished) {
                  throw new Error(
                    `Phase 4 stack mengalami process error: ${finished.error instanceof Error ? finished.error.message : String(finished.error)}.`,
                  );
                }
                if (finished.code !== 0 && finished.code !== null) process.exitCode = finished.code;
                return;
              }

              if (temporalChild) await stopSpawnedChild(temporalChild);
              if ("error" in first) {
                throw new Error(
                  `Tidak bisa menjalankan Phase 4 stack: ${first.error instanceof Error ? first.error.message : String(first.error)}.`,
                );
              }
              throw new Error(
                `Phase 4 stack berhenti sebelum seluruh service ready${first.code === null ? ` (${first.signal ?? "signal"})` : ` (exit ${String(first.code)})`}.`,
              );
            } finally {
              clearEngineRuntimeState();
            }
          }

          function stopTemporal()'''
          t = sub1(t, r'async function start\(\) \{.*?\n\}\n\nfunction stopTemporal\(\)', start, 'engine start')
          p.write_text(t)

          # New installs prefer 17020; legacy .env values remain valid preferences.
          p = Path('.env.example')
          t = p.read_text()
          t = one(t, 'ECORIONE_AI_PORT=3000', '# Preferred Ai/Web port; engine:start safely falls back through 17029–17039.\nECORIONE_AI_PORT=17020', 'env port')
          p.write_text(t)

          # UX inventory resolves the active runtime URL instead of assuming 3000.
          p = Path('scripts/local-ux-product-evidence.mjs')
          t = p.read_text()
          t = one(t,
            'import { parseSimpleEnv } from "./ecorione-engine.mjs";',
            'import { DEFAULT_AI_PORT, parseSimpleEnv, resolveAiRuntime } from "./ecorione-engine.mjs";',
            'ux import')
          t = one(t,
            '''export const UI_SURFACES = [
            ["ai", "http://127.0.0.1:3000/", "ecorione — Ai"],
            ["space", "http://127.0.0.1:3000/space", "Space"],
            ["flow", "http://127.0.0.1:3000/flow", "Visual workflow builder"],
            ["ops", "http://127.0.0.1:3000/ops", "Runtime health & telemetry"],
            ["settings", "http://127.0.0.1:3000/settings", "Control Center"],
          ];''',
            '''export function buildUiSurfaces(baseUrl) {
            const base = baseUrl.replace(/\\/+$/, "");
            return [
              ["ai", `${base}/`, "ecorione — Ai"],
              ["space", `${base}/space`, "Space"],
              ["flow", `${base}/flow`, "Visual workflow builder"],
              ["ops", `${base}/ops`, "Runtime health & telemetry"],
              ["settings", `${base}/settings`, "Control Center"],
            ];
          }

          export const UI_SURFACES = buildUiSurfaces(`http://127.0.0.1:${String(DEFAULT_AI_PORT)}`);''',
            'ux surfaces')
          t = one(t,
            '''  const owners = [];
            for (const [name, url] of OWNER_HEALTH) {''',
            '''  const envPath = resolve(ROOT, ".env");
            const fileEnv = existsSync(envPath) ? parseSimpleEnv(readFileSync(envPath, "utf8")) : {};
            const aiRuntime = resolveAiRuntime({ ...fileEnv, ...process.env }, ROOT);
            const uiSurfaces = buildUiSurfaces(aiRuntime.url);

            const owners = [];
            for (const [name, url] of OWNER_HEALTH) {''',
            'ux runtime')
          t = one(t, '  for (const [name, url, marker] of UI_SURFACES) {', '  for (const [name, url, marker] of uiSurfaces) {', 'ux surfaces loop')
          t = t.replace('request("http://127.0.0.1:3000/api/settings/settings/runtime")', 'request(`${aiRuntime.url}/api/settings/settings/runtime`)')
          t = t.replace('`http://127.0.0.1:3000/api/settings/settings/mcp/servers?workspaceId=${UX_WORKSPACE_ID}`', '`${aiRuntime.url}/api/settings/settings/mcp/servers?workspaceId=${UX_WORKSPACE_ID}`')
          t = t.replace('request("http://127.0.0.1:3000/api/ops")', 'request(`${aiRuntime.url}/api/ops`)')
          t = t.replace('`http://127.0.0.1:3000/api/space/pages?workspaceId=${UX_WORKSPACE_ID}`', '`${aiRuntime.url}/api/space/pages?workspaceId=${UX_WORKSPACE_ID}`')
          t = t.replace('request("http://127.0.0.1:3000/api/flow/nodes")', 'request(`${aiRuntime.url}/api/flow/nodes`)')
          p.write_text(t)

          # Windows acceptance follows the resolved ready URL and ignores unrelated preferred-port listeners.
          p = Path('scripts/windows-engine-acceptance.mjs')
          t = p.read_text()
          t = one(t,
            '''import {
            isPortReachable,
            parseSimpleEnv,
            resolveCommandInvocation,
          } from "./ecorione-engine.mjs";''',
            '''import {
            DEFAULT_AI_PORT,
            isPortReachable,
            parseSimpleEnv,
            resolveCommandInvocation,
            resolvePreferredAiPort,
          } from "./ecorione-engine.mjs";''',
            'acceptance imports')
          t = one(t,
            '''const APP_PORTS = [3000, ...REQUIRED_SERVICES.map(([, port]) => port)];
          const READY_MARKER = "✓ ECORIONE ready: http://127.0.0.1:3000";''',
            '''const SERVICE_PORTS = REQUIRED_SERVICES.map(([, port]) => port);

          export function parseReadyAi(output) {
            const match = output.match(/✓ ECORIONE ready: (http:\\/\\/127\\.0\\.0\\.1:(\\d+))/);
            if (!match) return null;
            return { url: match[1], port: Number(match[2]) };
          }''',
            'acceptance constants')
          t = t.replace('pass: "second pnpm engine:start fails closed on occupied port 3000 before mutating runtime",', 'pass: "second pnpm engine:start detects the already-running ECORIONE Ai identity and fails closed",')
          t = one(t,
            '''export function evaluateRunningDoctor(output) {
            const requiredMarkers = [
              "✓ Temporal 127.0.0.1:7233",
              ...REQUIRED_SERVICES.map(([name]) => `✓ ${name}`),
              "✓ Ai http://127.0.0.1:3000",
            ];''',
            '''export function evaluateRunningDoctor(output, aiPort = DEFAULT_AI_PORT) {
            const requiredMarkers = [
              "✓ Temporal 127.0.0.1:7233",
              ...REQUIRED_SERVICES.map(([name]) => `✓ ${name}`),
              `✓ Ai http://127.0.0.1:${String(aiPort)}`,
            ];''',
            'acceptance doctor')
          wait = '''async function waitForRuntime(childState, stdoutRef, timeoutMs = 150_000) {
            const deadline = Date.now() + timeoutMs;
            while (Date.now() < deadline) {
              if (childState.exited) {
                throw new Error(
                  `engine:start berhenti sebelum ready (exit ${String(childState.code)}, signal ${String(childState.signal)}).`,
                );
              }
              const token = readLocalToken();
              const readyAi = parseReadyAi(stdoutRef.value);
              const aiReady = readyAi ? await isPortReachable(readyAi.port) : false;
              const health = await Promise.all(
                REQUIRED_SERVICES.map(async ([name, , url]) => ({
                  name,
                  ready: await fetchHealth(url, token),
                })),
              );
              if (readyAi && aiReady && health.every((entry) => entry.ready)) {
                return { health, ...readyAi };
              }
              await new Promise((resolvePromise) => setTimeout(resolvePromise, 750));
            }
            throw new Error("engine:start belum mencapai full readiness setelah 150 detik.");
          }

          async function waitForPortsClosed'''
          t = sub1(t, r'async function waitForRuntime\(childState, stdoutRef, timeoutMs = 150_000\) \{.*?\n\}\n\nasync function waitForPortsClosed', wait, 'acceptance wait')
          t = one(t,
            '''    const beforePorts = await portState(APP_PORTS);
            const occupied = Object.entries(beforePorts)
              .filter(([, reachable]) => reachable)
              .map(([port]) => port);
            if (occupied.length > 0) {
              throw new Error(
                `ECORIONE harus berhenti sebelum acceptance. Port aplikasi masih terpakai: ${occupied.join(", ")}.`,
              );
            }

            report.phases.preflight = {''',
            '''    const configuredEnv = { ...localEnv, ...process.env };
            const preferredAiPort = resolvePreferredAiPort(configuredEnv);
            const preferredAiOccupiedBefore = await isPortReachable(preferredAiPort);
            const beforePorts = await portState(SERVICE_PORTS);
            const occupied = Object.entries(beforePorts)
              .filter(([, reachable]) => reachable)
              .map(([port]) => port);
            if (occupied.length > 0) {
              throw new Error(
                `ECORIONE fixed service ports harus kosong sebelum acceptance: ${occupied.join(", ")}.`,
              );
            }

            report.phases.preflight = {''',
            'acceptance preflight')
          t = one(t, '      dockerReachable: dockerReady,', '      dockerReachable: dockerReady,\n      preferredAiPort,\n      preferredAiOccupiedBefore,', 'acceptance report preflight')
          t = one(t,
            '''    await waitForRuntime(childState, stdoutRef);
            report.phases.start = {
              pass: true,
              readyMarker: true,
              ports: await portState(APP_PORTS),
              logTail: tail(`${stdoutRef.value}\n${stderrRef.value}`),
            };''',
            '''    const started = await waitForRuntime(childState, stdoutRef);
            const appPorts = [started.port, ...SERVICE_PORTS];
            report.phases.start = {
              pass: true,
              readyMarker: true,
              preferredAiPort,
              resolvedAiPort: started.port,
              aiUrl: started.url,
              fallbackUsed: started.port !== preferredAiPort,
              ports: await portState(appPorts),
              logTail: tail(`${stdoutRef.value}\n${stderrRef.value}`),
            };''',
            'acceptance start result')
          t = t.replace('const doctorEvaluation = evaluateRunningDoctor(runningDoctor.stdout);', 'const doctorEvaluation = evaluateRunningDoctor(runningDoctor.stdout, started.port);')
          t = one(t, 'if (duplicate.code === 0 || !duplicateText.includes("Port 3000 sudah dipakai")) {', 'if (duplicate.code === 0 || !duplicateText.includes("ECORIONE sudah berjalan di")) {', 'acceptance duplicate')
          t = t.replace('const closedPorts = await waitForPortsClosed(APP_PORTS);', 'const closedPorts = await waitForPortsClosed(appPorts);')
          p.write_text(t)

          # Desktop host port is dynamic; container-internal Ai stays on 3000.
          p = Path('desktop/compose.yml')
          t = p.read_text()
          t = one(t, '      - "127.0.0.1:3000:3000"', '      - "127.0.0.1:${ECORIONE_AI_PORT:-17020}:3000"', 'desktop compose mapping')
          p.write_text(t)

          p = Path('desktop/ecorione.ps1')
          t = p.read_text()
          t = one(t, '$AiUrl = "http://127.0.0.1:3000"', '$AiPort = 17020\n$AiUrl = "http://127.0.0.1:$AiPort"', 'desktop url')
          t = one(t, '    "ECORIONE_DESKTOP_IMAGE=ecorione:desktop",', '    "ECORIONE_DESKTOP_IMAGE=ecorione:desktop",\n    "ECORIONE_AI_PORT=17020",', 'desktop env')
          helper_anchor = 'function Assert-Docker {'
          helper = '''function Get-ConfiguredAiPort([hashtable]$Config) {
            $raw = [string]$Config["ECORIONE_AI_PORT"]
            if (-not $raw) { return 17020 }
            $value = 0
            if (-not [int]::TryParse($raw, [ref]$value) -or $value -lt 1 -or $value -gt 65535) {
              throw "ECORIONE_AI_PORT tidak valid: $raw"
            }
            if ($value -ge 17021 -and $value -le 17028) {
              throw "ECORIONE_AI_PORT $value bentrok dengan reserved service port 17021-17028."
            }
            return $value
          }

          function Test-PortAvailable([int]$Port) {
            $listener = New-Object System.Net.Sockets.TcpListener([System.Net.IPAddress]::Loopback, $Port)
            try { $listener.Start(); return $true } catch { return $false } finally { try { $listener.Stop() } catch {} }
          }

          function Set-DesktopAiPort([int]$Port) {
            $lines = [System.IO.File]::ReadAllLines($EnvFile)
            $found = $false
            for ($i = 0; $i -lt $lines.Length; $i++) {
              if ($lines[$i].TrimStart().StartsWith("ECORIONE_AI_PORT=")) {
                $lines[$i] = "ECORIONE_AI_PORT=$Port"
                $found = $true
                break
              }
            }
            if (-not $found) { $lines += "ECORIONE_AI_PORT=$Port" }
            Write-Utf8NoBom $EnvFile (($lines -join [Environment]::NewLine) + [Environment]::NewLine)
          }

          function Select-FreeAiPort([int]$PreferredPort) {
            $candidates = @($PreferredPort, 17020) + (17029..17039)
            $seen = @{}
            foreach ($candidate in $candidates) {
              if ($candidate -ge 17021 -and $candidate -le 17028) { continue }
              if ($seen.ContainsKey($candidate)) { continue }
              $seen[$candidate] = $true
              if (Test-PortAvailable $candidate) { return [int]$candidate }
            }
            throw "Tidak ada Ai port kosong. Preferred $PreferredPort dan fallback 17020, 17029-17039 sedang terpakai."
          }

          function Set-AiEndpoint([int]$Port) {
            $script:AiPort = $Port
            $script:AiUrl = "http://127.0.0.1:$Port"
          }

          function Assert-Docker {'''
          t = one(t, helper_anchor, helper, 'desktop helpers')
          t = one(t,
            '''  $config = Ensure-DesktopEnv
              $image = Ensure-RuntimeImage $config
              Write-Info "Menyalakan ECORIONE ($image)..."
              Invoke-Compose @("up", "-d")''',
            '''  $config = Ensure-DesktopEnv
              $configuredPort = Get-ConfiguredAiPort $config
              $selectedPort = Select-FreeAiPort $configuredPort
              if ($selectedPort -ne $configuredPort) {
                Write-Info "Ai port $configuredPort sedang dipakai; memakai fallback $selectedPort."
              }
              Set-DesktopAiPort $selectedPort
              Set-AiEndpoint $selectedPort
              $config = Read-DesktopEnv
              $image = Ensure-RuntimeImage $config
              Write-Info "Menyalakan ECORIONE ($image)..."
              Invoke-Compose @("up", "-d")''',
            'desktop start')
          t = one(t,
            '''  $config = Ensure-DesktopEnv
              $image = [string]$config["ECORIONE_DESKTOP_IMAGE"]''',
            '''  $config = Ensure-DesktopEnv
              Set-AiEndpoint (Get-ConfiguredAiPort $config)
              $image = [string]$config["ECORIONE_DESKTOP_IMAGE"]''',
            'desktop doctor')
          t = one(t,
            '''  "open" {
                if (-not (Test-AiReady)) {''',
            '''  "open" {
