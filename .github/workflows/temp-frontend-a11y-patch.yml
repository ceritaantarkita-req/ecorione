name: TEMP Frontend Accessibility Patch

on:
  push:
    branches:
      - feat/frontend-typography-accessibility-20260912

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/frontend-typography-accessibility-20260912
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply remaining accessibility fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          space_path = Path('apps/ai/app/space/page.tsx')
          text = space_path.read_text()
          inspect_label = 'aria-label={`Inspect ${block.type} block`}'
          marker = '<span className={styles.blockActions}>'
          if inspect_label not in text:
              if marker not in text:
                  raise SystemExit('space block action marker not found')
              insert = '''<span className={styles.blockActions}>
                          <button
                            type="button"
                            className={styles.iconButton}
                            aria-label={`Inspect ${block.type} block`}
                            aria-pressed={selectedBlockId === block.id}
                            onClick={(event) => {
                              event.stopPropagation();
                              setSelectedBlockId(block.id);
                            }}
                          >
                            Inspect
                          </button>'''
              text = text.replace(marker, insert, 1)
              space_path.write_text(text)

          ops_path = Path('apps/ai/app/ops/page.tsx')
          text = ops_path.read_text()
          text = text.replace('          <p className={styles.eyebrow}>ECORIONE OPERATIONS</p>\n', '', 1)
          old = '      {error !== null ? <p className={styles.error}>Ops fetch failed: {error}</p> : null}\n'
          if old in text:
              new = '''      {error !== null ? (
            <p className={styles.error} role="alert">
              Ops fetch failed: {error}
            </p>
          ) : null}
'''
              text = text.replace(old, new, 1)
          elif 'className={styles.error} role="alert"' not in text:
              raise SystemExit('ops error target not found')
          ops_path.write_text(text)
          PY
          pnpm exec prettier --write \
            apps/ai/app/space/page.tsx \
            apps/ai/app/ops/page.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ai/app/space/page.tsx apps/ai/app/ops/page.tsx
          if git diff --cached --quiet; then
            echo "No remaining patch changes"
            exit 0
          fi
          git commit -m "fix: finish frontend accessibility pass"
          git push origin HEAD:feat/frontend-typography-accessibility-20260912
