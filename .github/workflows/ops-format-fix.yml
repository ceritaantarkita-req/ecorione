name: Ops format fix

on:
  push:
    branches:
      - ops/production-activation-20260910
    paths:
      - .github/workflows/ops-format-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ops/production-activation-20260910
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format production activation files
        run: |
          pnpm exec prettier --write \
            scripts/production-data-evidence.mjs \
            scripts/production-ops-snapshot.mjs \
            scripts/production-public-smoke.mjs \
            scripts/provider-matrix-canary.mjs \
            test/production-activation.test.ts
          rm .github/workflows/ops-format-fix.yml
          git diff --check
      - name: Commit format fix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: format production activation tooling"
          git push origin HEAD:ops/production-activation-20260910
