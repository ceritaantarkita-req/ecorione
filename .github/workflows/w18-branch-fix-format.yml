name: Temporary W18 branch fix and format

on:
  push:
    branches:
      - feat/w18-hosted-economics-harness-20260917

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/w18-hosted-economics-harness-20260917
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Harden W18 runner before formatting
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('scripts/w18-hosted-economics.mjs')
          text = path.read_text(encoding='utf-8')

          text, count = re.subn(
              r'\n\s*if \(settings\.hostedCallsEnabled !== true\) \{\s*failures\.push\("runtime hostedCallsEnabled harus true"\);\s*\}',
              '',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('hostedCallsEnabled readiness block not found')

          marker = '  const timeoutMs = Number(env.ECORIONE_W18_TIMEOUT_MS ?? "120000");'
          addition = '  if (!readiness.runtime.hostedCallsEnabled) {\n    throw new Error("runtime hostedCallsEnabled harus true untuk run W18 formal");\n  }\n\n'
          if marker not in text:
              raise SystemExit('formal timeout anchor not found')
          text = text.replace(marker, addition + marker, 1)

          marker = '    if (run.quality?.score !== 1) {'
          addition = '    if (!run.responseModel) {\n      failures.push(`${run.mode} pair ${run.pairIndex} responseModel kosong`);\n    }\n'
          if marker not in text:
              raise SystemExit('quality gate anchor not found')
          text = text.replace(marker, addition + marker, 1)

          marker = '  const fullCostUsd = sum(fullRuns.map((run) => run.billedCostUsd));'
          addition = '  if (new Set(runs.map((run) => run.responseModel)).size !== 1) {\n    failures.push("provider responseModel berubah dalam paired task run");\n  }\n'
          if marker not in text:
              raise SystemExit('cost aggregation anchor not found')
          text = text.replace(marker, addition + marker, 1)

          marker = '        actualSpentUsd += run.billedCostUsd;\n'
          addition = '        console.log(\n          `W18 billed call costUsd=${run.billedCostUsd.toFixed(8)} cumulativeUsd=${actualSpentUsd.toFixed(8)}`,\n        );\n'
          if marker not in text:
              raise SystemExit('spend logging anchor not found')
          text = text.replace(marker, marker + addition, 1)

          old = '  const summaryPath = outputPath.replace(/\\.json$/u, ".summary.json");'
          new = '  const summaryPath = summaryPathFor(outputPath);\n  if (existsSync(summaryPath)) throw new Error(`summary output sudah ada: ${summaryPath}`);'
          if old not in text:
              raise SystemExit('summary path anchor not found')
          text = text.replace(old, new, 1)

          marker = 'async function main(argv = process.argv.slice(2)) {'
          helper = 'export function summaryPathFor(outputPath) {\n  return outputPath.endsWith(".json")\n    ? `${outputPath.slice(0, -".json".length)}.summary.json`\n    : `${outputPath}.summary.json`;\n}\n\n'
          if marker not in text:
              raise SystemExit('main anchor not found')
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('test/w18-hosted-economics.test.mjs')
          test = test_path.read_text(encoding='utf-8')
          marker = '  evaluateW18Task,\n'
          if marker not in test:
              raise SystemExit('test import anchor not found')
          test = test.replace(marker, marker + '  summaryPathFor,\n', 1)
          marker = '  it("derives the tighter durable spend ceiling", () => {'
          addition = '  it("keeps evidence and summary paths distinct", () => {\n    expect(summaryPathFor("C:/tmp/w18.json")).toBe("C:/tmp/w18.summary.json");\n    expect(summaryPathFor("C:/tmp/w18-evidence")).toBe("C:/tmp/w18-evidence.summary.json");\n  });\n\n'
          if marker not in test:
              raise SystemExit('test insertion anchor not found')
          test = test.replace(marker, addition + marker, 1)
          test_path.write_text(test, encoding='utf-8')

          doc_path = Path('docs/verification/w18-hosted-economics-preflight-2026-09-17.md')
          doc = doc_path.read_text(encoding='utf-8')
          old = 'It checks repository state, service health, runtime provider state, credential metadata, and durable budget configuration. It never prints credential secrets.'
          new = old + ' Preflight may run while hosted calls remain disabled; `hostedCallsEnabled=true` is required only after current-run spend authorization for the formal paid run.'
          if old not in doc:
              raise SystemExit('doc preflight anchor not found')
          doc_path.write_text(doc.replace(old, new, 1), encoding='utf-8')
      - name: Format W18 scope
        run: pnpm exec prettier --write scripts/w18-hosted-economics.mjs test/w18-hosted-economics.test.mjs services/connect/src/providers/openai-compatible.ts services/connect/src/providers/openai-compatible-cost.test.ts docs/verification/w18-hosted-economics-preflight-2026-09-17.md
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/w18-branch-fix-format.yml
          git config user.name "ceritaantarkita-req"
          git config user.email "ceritaantarkita@gmail.com"
          git add -A
          git commit -m "fix(w18): harden preflight and evidence output"
          git push origin HEAD:feat/w18-hosted-economics-harness-20260917
