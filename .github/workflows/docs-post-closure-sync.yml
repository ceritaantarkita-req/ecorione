name: Post-closure docs sync

on:
  push:
    branches:
      - docs/post-closure-cloudflare-20260910
    paths:
      - .github/workflows/docs-post-closure-sync.yml

permissions:
  contents: write

jobs:
  sync_docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/post-closure-cloudflare-20260910
          fetch-depth: 0
      - name: Run patcher
        run: python scripts/docs-post-closure-sync.py
      - name: Validate and commit
        run: |
          set -euo pipefail
          git diff --check
          rm .github/workflows/docs-post-closure-sync.yml scripts/docs-post-closure-sync.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs .github/workflows/docs-post-closure-sync.yml scripts/docs-post-closure-sync.py
          git diff --cached --check
          git commit -m "docs: reconcile post-closure roadmap and historical context"
          git push origin HEAD:docs/post-closure-cloudflare-20260910
