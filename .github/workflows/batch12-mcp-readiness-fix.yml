name: Batch 12 MCP readiness fix

on:
  push:
    branches:
      - agent/batch12-final-security-release-20260910
    paths:
      - .github/workflows/batch12-mcp-readiness-fix.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned cloudflared and diagnose Quick Tunnel DNS
        shell: bash
        run: |
          set -euo pipefail
          CLOUDFLARED="$RUNNER_TEMP/cloudflared"
          LOG="$RUNNER_TEMP/cloudflared.log"
          curl --fail --silent --show-error --location \
            "https://github.com/cloudflare/cloudflared/releases/download/2026.8.3/cloudflared-linux-amd64" \
            --output "$CLOUDFLARED"
          echo "f29324fe934d1e100617484c78deef803c4dc2cd351d645bbde42e96b4fccc5e  $CLOUDFLARED" \
            | sha256sum --check --strict
          chmod 0755 "$CLOUDFLARED"

          python3 -m http.server 18080 --bind 127.0.0.1 >"$RUNNER_TEMP/http.log" 2>&1 &
          HTTP_PID=$!
          "$CLOUDFLARED" tunnel --no-autoupdate --url http://127.0.0.1:18080 >"$LOG" 2>&1 &
          TUNNEL_PID=$!
          trap 'kill "$TUNNEL_PID" "$HTTP_PID" 2>/dev/null || true' EXIT

          URL=""
          for _ in $(seq 1 60); do
            URL="$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG" | head -n1 || true)"
            if [ -n "$URL" ] && grep -q 'Registered tunnel connection' "$LOG"; then
              break
            fi
            sleep 1
          done
          [ -n "$URL" ] || { cat "$LOG"; exit 1; }
          HOST="${URL#https://}"
          echo "quick_tunnel_host=$HOST"

          echo '=== system resolver ==='
          getent ahostsv4 "$HOST" || true

          echo '=== Cloudflare DoH ==='
          curl --fail --silent --show-error \
            -H 'accept: application/dns-json' \
            "https://cloudflare-dns.com/dns-query?name=${HOST}&type=A" || true
          echo

          echo '=== Google DoH ==='
          curl --fail --silent --show-error \
            "https://dns.google/resolve?name=${HOST}&type=A" || true
          echo

          echo '=== HTTPS curl ==='
          curl --head --max-time 10 --silent --show-error "$URL" || true

          echo '=== cloudflared tail ==='
          tail -n 30 "$LOG"
