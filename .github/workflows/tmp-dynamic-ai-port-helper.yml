          )
          p.write_text(t)

          # --- scripts/windows-engine-acceptance.mjs ---
          p = Path("scripts/windows-engine-acceptance.mjs")
          t = p.read_text()
          t = replace_once(
              t,
              '''import {
            isPortReachable,
            parseSimpleEnv,
            resolveCommandInvocation,
          } from "./ecorione-engine.mjs";''',
              '''import {
            DEFAULT_AI_PORT,
            isPortReachable,
