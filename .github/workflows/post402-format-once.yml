name: Post-402 one-time formatter

on:
  push:
    branches:
      - fix/post402-stabilization-20260930

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format post-402 files
        run: |
          pnpm exec prettier --write \
            apps/ai/app/ChatPageSections.tsx \
            apps/ai/app/settings/OpenRouterDiscoveryPanel.tsx \
            apps/ai/app/settings/useSettingsController.ts \
            apps/ai/lib/chat-model-routing.ts \
            scripts/dev.mjs \
            scripts/pcs06-browser-acceptance.mjs \
            services/connect/src/complete.ts \
            services/connect/src/control-http.test.ts \
            services/connect/src/control-http.ts \
            services/connect/src/hosted-model-registry.test.ts \
            services/connect/src/http.ts \
            services/connect/src/main.ts \
            services/connect/src/openrouter-certification-store.test.ts \
            services/connect/src/openrouter-certification-store.ts \
            services/connect/src/openrouter-model-certification.test.ts \
            services/connect/src/openrouter-model-certification.ts \
            services/connect/src/openrouter-model-discovery.ts \
            services/connect/src/operator-runtime-settings.ts \
            services/connect/src/providers/hosted.ts \
            services/connect/src/providers/openai-compatible.ts \
            services/connect/src/routing.ts \
            services/connect/src/runtime-settings.ts \
            test/pcs03-local-runtime-source-contract.test.ts
      - run: git diff --check
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/ai/app/ChatPageSections.tsx \
            apps/ai/app/settings/OpenRouterDiscoveryPanel.tsx \
            apps/ai/app/settings/useSettingsController.ts \
            apps/ai/lib/chat-model-routing.ts \
            scripts/dev.mjs \
            scripts/pcs06-browser-acceptance.mjs \
            services/connect/src/complete.ts \
            services/connect/src/control-http.test.ts \
            services/connect/src/control-http.ts \
            services/connect/src/hosted-model-registry.test.ts \
            services/connect/src/http.ts \
            services/connect/src/main.ts \
            services/connect/src/openrouter-certification-store.test.ts \
            services/connect/src/openrouter-certification-store.ts \
            services/connect/src/openrouter-model-certification.test.ts \
            services/connect/src/openrouter-model-certification.ts \
            services/connect/src/openrouter-model-discovery.ts \
            services/connect/src/operator-runtime-settings.ts \
            services/connect/src/providers/hosted.ts \
            services/connect/src/providers/openai-compatible.ts \
            services/connect/src/routing.ts \
            services/connect/src/runtime-settings.ts \
            test/pcs03-local-runtime-source-contract.test.ts
          git commit -m "style: format post-402 changes"
          git push origin HEAD:${GITHUB_REF_NAME}
