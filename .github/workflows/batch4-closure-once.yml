name: Batch 4 Closure Once

on:
  push:
    branches:
      - agent/batch4-authority-closure-20260909
    paths:
      - .github/workflows/batch4-closure-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/batch4-closure-once.mjs
      - run: pnpm exec prettier --write docs/EXECUTION-PROGRESS.md scripts/batch4-closure-once.mjs
      - run: pnpm run format:check
      - name: Commit closure tracker and remove helper
        run: |
          rm -f scripts/batch4-closure-once.mjs .github/workflows/batch4-closure-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close Batch 4 authority plane"
          git push origin HEAD:agent/batch4-authority-closure-20260909
