name: Batch 7 Hardening

on:
  push:
    branches:
      - agent/batch7-data-rebuild-20260910
    paths:
      - .github/workflows/batch7-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/batch7-data-rebuild-20260910
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Harden failed-execute recovery and explicit dry-run diff
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing marker in {path}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1))

          # Explicit dry-run diff is part of the public maintenance plan contract.
          replace_once(
              'services/context/src/maintenance.ts',
              '''  readonly findings: MaintenanceFindings;\n  readonly rebuildL1RequiresLocalExtraction: boolean;''',
              '''  readonly findings: MaintenanceFindings;\n  readonly diff: {\n    readonly pendingMigrationVersions: readonly number[];\n    readonly normalizableFacts: number;\n    readonly duplicateLiveDerivedGroups: number;\n    readonly rebuildL1: boolean;\n    readonly rebuildFts: boolean;\n    readonly reindexVector: boolean;\n  };\n  readonly rebuildL1RequiresLocalExtraction: boolean;''',
          )
          replace_once(
              'services/context/src/maintenance.ts',
              '''    const targetVersion = Math.max(0, ...available);\n    const unsigned = {''',
              '''    const targetVersion = Math.max(0, ...available);\n    const findings = inspectContext(this.repo);\n    const pendingVersions = available.filter((version) => !appliedSet.has(version));\n    const unsigned = {''',
          )
          replace_once(
              'services/context/src/maintenance.ts',
              '''        pendingVersions: available.filter((version) => !appliedSet.has(version)),\n      },\n      findings: inspectContext(this.repo),\n      rebuildL1RequiresLocalExtraction: actions.includes("rebuild-l1"),''',
              '''        pendingVersions,\n      },\n      findings,\n      diff: {\n        pendingMigrationVersions: pendingVersions,\n        normalizableFacts: actions.includes("normalize-metadata") ? findings.normalizableFacts : 0,\n        duplicateLiveDerivedGroups: actions.includes("dedupe-facts")\n          ? findings.duplicateLiveDerivedGroups\n          : 0,\n        rebuildL1: actions.includes("rebuild-l1"),\n        rebuildFts: actions.includes("rebuild-fts") || actions.includes("rebuild-l1"),\n        reindexVector: actions.includes("reindex-vector") || actions.includes("rebuild-l1"),\n      },\n      rebuildL1RequiresLocalExtraction: actions.includes("rebuild-l1"),''',
          )

          # A failed execute may have mutated projections before failing. Its pre-mutation
          # owner snapshot must therefore remain a valid rollback source.
          replace_once(
              'services/context/src/maintenance.ts',
              '''    if (\n      sourceReceipt === null ||\n      sourceReceipt.status !== "SUCCEEDED" ||\n      sourceReceipt.snapshotPath === null\n    ) {''',
              '''    if (\n      sourceReceipt === null ||\n      sourceReceipt.kind !== "EXECUTE" ||\n      sourceReceipt.snapshotPath === null\n    ) {''',
          )

          # Wire diff validation at the HTTP boundary.
          replace_once(
              'services/context/src/maintenance-http.ts',
              '''    typeof plan.findings !== "object" ||\n    plan.findings === null\n  ) {''',
              '''    typeof plan.findings !== "object" ||\n    plan.findings === null ||\n    typeof plan.diff !== "object" ||\n    plan.diff === null\n  ) {''',
          )

          # Engine recovery regression: mutate first, force a later reindex failure,
          # then restore from the FAILED execute receipt snapshot.
          replace_once(
              'services/context/src/maintenance.test.ts',
              '''    return { repo, maintenance };\n  }''',
              '''    return { repo, maintenance, vectors };\n  }''',
          )
          p = Path('services/context/src/maintenance.test.ts')
          text = p.read_text()
          marker = '\n});\n'
          pos = text.rfind(marker)
          if pos < 0:
              raise SystemExit('missing maintenance test closing marker')
          test = '''\n\n  it("rolls back a failed execute from its pre-mutation owner snapshot", async () => {\n    const { repo, maintenance, vectors } = setup();\n    const episodeId = seedEpisode(repo);\n    seedDuplicateFacts(repo, episodeId);\n    const sourceBefore = contextSourceDigest(repo.db.raw);\n    const projectionBefore = contextProjectionDigest(repo);\n    const plan = maintenance.plan({\n      operationId: assertId("operation", "op_maintfailed001"),\n      actions: ["dedupe-facts", "reindex-vector", "verify"],\n      now: NOW,\n    });\n    expect(plan.diff.duplicateLiveDerivedGroups).toBe(1);\n    expect(plan.diff.reindexVector).toBe(true);\n\n    const originalRebuild = vectors.rebuild.bind(vectors);\n    Object.defineProperty(vectors, "rebuild", {\n      configurable: true,\n      value: () => {\n        throw new Error("forced reindex failure");\n      },\n    });\n    await expect(maintenance.execute(plan)).rejects.toThrow("forced reindex failure");\n    expect(repo.listFacts({ includeInvalidated: false })).toHaveLength(1);\n\n    const failed = maintenance.listReceipts().find((receipt) => receipt.operationId === plan.operationId);\n    expect(failed).toMatchObject({ kind: "EXECUTE", status: "FAILED" });\n    expect(failed?.snapshotPath).not.toBeNull();\n\n    Object.defineProperty(vectors, "rebuild", { configurable: true, value: originalRebuild });\n    const rollback = await maintenance.rollback({\n      operationId: assertId("operation", "op_maintfailedback001"),\n      sourceReceiptId: failed?.id ?? "missing",\n      now: LATER,\n    });\n    expect(rollback.status).toBe("SUCCEEDED");\n    expect(rollback.projectionDigestAfter).toBe(projectionBefore);\n    expect(contextSourceDigest(repo.db.raw)).toBe(sourceBefore);\n    expect(repo.listFacts({ includeInvalidated: false })).toHaveLength(2);\n  });\n'''
          p.write_text(text[:pos] + test + text[pos:])

          # HTTP owner-contract regression: expose explicit diff and reject stale plan
          # before any snapshot/mutation attempt.
          p = Path('services/context/src/http.test.ts')
          text = p.read_text()
          marker = '\n});\n'
          pos = text.rfind(marker)
          if pos < 0:
              raise SystemExit('missing context http test closing marker')
          test = '''\n\ndescribe("maintenance owner API", () => {\n  it("returns an explicit dry-run diff and rejects a stale plan fail-closed", async () => {\n    const planned = await app.inject({\n      method: "POST",\n      url: "/v1/maintenance/plan",\n      payload: { operationId: "op_httpmaint001", actions: ["verify"], now: NOW },\n    });\n    expect(planned.statusCode).toBe(200);\n    const plan = planned.json();\n    expect(plan.diff).toMatchObject({\n      pendingMigrationVersions: [],\n      normalizableFacts: 0,\n      duplicateLiveDerivedGroups: 0,\n      rebuildL1: false,\n      rebuildFts: false,\n      reindexVector: false,\n    });\n\n    const appended = await app.inject({\n      method: "POST",\n      url: "/v1/episodes",\n      payload: {\n        ts: T0,\n        rawText: "advance immutable L0",\n        provenance: PROVENANCE,\n        scope: "personal",\n        sensitivity: "INTERNAL",\n        syncClass: "LOCAL_ONLY",\n        trust: "USER",\n      },\n    });\n    expect(appended.statusCode).toBe(201);\n\n    const executed = await app.inject({\n      method: "POST",\n      url: "/v1/maintenance/execute",\n      payload: { plan },\n    });\n    expect(executed.statusCode).toBe(409);\n\n    const verified = await app.inject({ method: "GET", url: "/v1/maintenance/verify" });\n    expect(verified.statusCode).toBe(200);\n    const receipts = await app.inject({ method: "GET", url: "/v1/maintenance/receipts" });\n    expect(receipts.statusCode).toBe(200);\n    expect(receipts.json().receipts).toEqual([]);\n  });\n});\n'''
          p.write_text(text[:pos + len(marker)] + test + text[pos + len(marker):])
          PY
      - name: Format
        run: pnpm exec prettier --write services/context/src/maintenance.ts services/context/src/maintenance-http.ts services/context/src/maintenance.test.ts services/context/src/http.test.ts
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Focused Batch 7 recovery and HTTP regression
        run: pnpm exec vitest run services/context/src/maintenance.test.ts services/context/src/http.test.ts services/hub/src/history-ledger.test.ts services/context/src/repository.test.ts services/context/src/retrieval.test.ts
      - name: Remove helper and commit hardened candidate
        run: |
          rm .github/workflows/batch7-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden Batch 7 failed-execute recovery"
          git push origin HEAD:agent/batch7-data-rebuild-20260910
