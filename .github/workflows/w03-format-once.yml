name: W03 Format Once

on:
  push:
    branches:
      - feat/w03-flow-responsive-redesign-20260915

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/w03-flow-responsive-redesign-20260915

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format W03 files and remove this one-shot workflow
        run: |
          pnpm exec prettier --write \
            apps/ai/app/flow/page.tsx \
            test/flow-responsive-source-contract.test.ts
          git rm .github/workflows/w03-format-once.yml

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ai/app/flow/page.tsx test/flow-responsive-source-contract.test.ts
          git commit -m "chore: format W03 implementation"
          git push origin HEAD:feat/w03-flow-responsive-redesign-20260915
