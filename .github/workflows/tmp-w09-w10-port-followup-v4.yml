name: W09 W10 Port Runtime Follow-up v4

on:
  push:
    branches:
      - fix/w09-w10-port-runtime-followup-v4-20260916

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reuse verified patch and fix lint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/tmp-w09-w10-port-followup-v3.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          patch_script = textwrap.dedent('\n'.join(source[start:end]))
          Path('/tmp/w09w10-patch.py').write_text(patch_script)
          PY
          python3 /tmp/w09w10-patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/ecorione-engine.test.mjs')
          text = path.read_text()
          anchor = 'import { EventEmitter } from "node:events";\n'
          if 'import { URL } from "node:url";' not in text:
              if anchor not in text:
                  raise SystemExit('test import anchor missing')
              text = text.replace(anchor, anchor + 'import { URL } from "node:url";\n', 1)
          path.write_text(text)
          PY
          pnpm exec prettier --write \
            apps/ai/package.json \
            scripts/ecorione-engine.mjs \
            scripts/windows-engine-acceptance.mjs \
            test/ecorione-engine.test.mjs \
            docs/verification/w09-w10-windows-engine-acceptance-2026-09-15.md
          pnpm exec vitest run \
            test/ecorione-engine.test.mjs \
            test/windows-engine-acceptance.test.mjs \
            test/desktop-bundle.test.mjs
          pnpm run typecheck
          pnpm run lint
          git diff --check
      - name: Commit fix
        run: |
          rm .github/workflows/tmp-w09-w10-port-followup-v3.yml
          rm .github/workflows/tmp-w09-w10-port-followup-v4.yml
          git add -A
          git diff --cached --check
          git config user.name "ceritaantarkita-req"
          git config user.email "ceritaantarkita@gmail.com"
          git commit -m "fix W09/W10 Ai port propagation and readiness"
          git push origin HEAD
