name: W102 Cleanup Fix Helper

on:
  push:
    branches:
      - fix/w09-w10-windows-cleanup-race-20260915

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Windows cleanup race fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          harness_path = Path("scripts/windows-engine-acceptance.mjs")
          text = harness_path.read_text()

          text = replace_once(
              text,
              'import { isPortReachable, parseSimpleEnv } from "./ecorione-engine.mjs";',
              '''import {
            isPortReachable,
            parseSimpleEnv,
            resolveCommandInvocation,
          } from "./ecorione-engine.mjs";''',
              "engine helper import",
          )

          text = replace_once(
              text,
              '''function commandName(name) {
            return process.platform === "win32" && name === "pnpm" ? "pnpm.cmd" : name;
          }

          ''',
              "",
              "legacy commandName",
          )

          text = replace_once(
              text,
              '''function runSync(command, args, options = {}) {
            const result = spawnSync(commandName(command), args, {
              cwd: ROOT,
              env: options.env ?? process.env,
              encoding: "utf8",
              windowsHide: true,
              shell: process.platform === "win32" && command === "pnpm",
              timeout: options.timeoutMs ?? 60_000,
            });''',
              '''function runSync(command, args, options = {}) {
            const env = options.env ?? process.env;
            const invocation = resolveCommandInvocation(command, args, process.platform, env);
            const result = spawnSync(invocation.command, invocation.args, {
              cwd: ROOT,
              env,
              encoding: "utf8",
              windowsHide: true,
              timeout: options.timeoutMs ?? 60_000,
            });''',
              "runSync pnpm invocation",
          )

          old_cleanup_helpers = '''async function waitForPortsClosed(ports, timeoutMs = 20_000) {
            const deadline = Date.now() + timeoutMs;
            while (Date.now() < deadline) {
              const state = await portState(ports);
              if (Object.values(state).every((reachable) => reachable === false)) return state;
              await new Promise((resolvePromise) => setTimeout(resolvePromise, 500));
            }
            return portState(ports);
          }

          function killWindowsTree(pid) {
            const result = spawnSync("taskkill", ["/PID", String(pid), "/T", "/F"], {
              cwd: ROOT,
              encoding: "utf8",
              windowsHide: true,
            });
            if (result.error) throw result.error;
            if (result.status !== 0 && result.status !== 128) {
              throw new Error(`taskkill gagal (exit ${String(result.status)}): ${result.stderr ?? ""}`);
            }
          }'''

          new_cleanup_helpers = '''async function waitForPortsClosed(ports, timeoutMs = 20_000) {
            const deadline = Date.now() + timeoutMs;
            while (Date.now() < deadline) {
              const state = await portState(ports);
              if (Object.values(state).every((reachable) => reachable === false)) return state;
              await new Promise((resolvePromise) => setTimeout(resolvePromise, 500));
            }
            return portState(ports);
          }

          async function waitForChildExit(childState, timeoutMs = 5_000) {
            const deadline = Date.now() + timeoutMs;
            while (!childState.exited && Date.now() < deadline) {
              await new Promise((resolvePromise) => setTimeout(resolvePromise, 100));
            }
            return childState.exited;
          }

          export function evaluateWindowsCleanup({
            taskkillCode,
            appPortState,
            temporalPreexisting,
            temporalReachable,
            engineExited,
          }) {
            const stillOpen = Object.entries(appPortState)
              .filter(([, reachable]) => reachable)
              .map(([port]) => port);
            const temporalStopped = temporalPreexisting || temporalReachable === false;
            const taskkillNonZero =
              taskkillCode !== null && taskkillCode !== 0 && taskkillCode !== 128;
            return {
              pass: stillOpen.length === 0 && temporalStopped && engineExited,
              stillOpen,
              temporalStopped,
              engineExited,
              taskkillCode,
              taskkillNonZero,
            };
          }

          function killWindowsTree(pid) {
            const result = spawnSync("taskkill", ["/PID", String(pid), "/T", "/F"], {
              cwd: ROOT,
              encoding: "utf8",
              windowsHide: true,
            });
            if (result.error) throw result.error;
            return {
              code: result.status,
              stdout: result.stdout ?? "",
              stderr: result.stderr ?? "",
            };
          }'''
          text = replace_once(text, old_cleanup_helpers, new_cleanup_helpers, "cleanup helpers")

          text = replace_once(
              text,
              '''    engineChild = spawn(commandName("pnpm"), ["engine:start"], {
              cwd: ROOT,
              env: acceptanceEnv,
              windowsHide: true,
              shell: true,
              stdio: ["ignore", "pipe", "pipe"],
            });''',
              '''    const engineInvocation = resolveCommandInvocation(
              "pnpm",
              ["engine:start"],
              process.platform,
              acceptanceEnv,
            );
            engineChild = spawn(engineInvocation.command, engineInvocation.args, {
              cwd: ROOT,
              env: acceptanceEnv,
              windowsHide: true,
              stdio: ["ignore", "pipe", "pipe"],
            });''',
              "engine start invocation",
          )

          old_cleanup = '''    killWindowsTree(engineChild.pid);
            const closedPorts = await waitForPortsClosed(APP_PORTS);
            const stillOpen = Object.entries(closedPorts)
              .filter(([, reachable]) => reachable)
              .map(([port]) => port);
            if (stillOpen.length > 0) {
              throw new Error(`Cleanup menyisakan port aplikasi: ${stillOpen.join(", ")}.`);
            }
            if (!preexistingTemporal) {
              const temporalClosed = await waitForPortsClosed([7233]);
              if (temporalClosed["7233"] !== false) {
                throw new Error(
                  "Temporal dev-server yang dimiliki acceptance masih reachable setelah cleanup.",
                );
              }
            }
            engineChild = undefined;
            report.phases.cleanup = {
              pass: true,
              appPortsReleased: true,
              temporalDisposition: preexistingTemporal
                ? "preexisting-left-running"
                : "acceptance-owned-stopped",
            };
            console.log("✓ W09-D Windows process tree cleanup PASS");'''

          new_cleanup = '''    const taskkillResult = killWindowsTree(engineChild.pid);
            const closedPorts = await waitForPortsClosed(APP_PORTS);
            const engineExited = await waitForChildExit(childState);
            let temporalReachable = preexistingTemporal;
            if (!preexistingTemporal) {
              const temporalClosed = await waitForPortsClosed([7233]);
              temporalReachable = temporalClosed["7233"] === true;
            }
            const cleanupEvaluation = evaluateWindowsCleanup({
              taskkillCode: taskkillResult.code,
              appPortState: closedPorts,
              temporalPreexisting: preexistingTemporal,
              temporalReachable,
              engineExited,
            });
            if (!cleanupEvaluation.pass) {
              const diagnostics = [
                cleanupEvaluation.stillOpen.length > 0
                  ? `port aplikasi masih terbuka: ${cleanupEvaluation.stillOpen.join(", ")}`
                  : null,
                cleanupEvaluation.temporalStopped
                  ? null
                  : "Temporal dev-server milik acceptance masih reachable",
                cleanupEvaluation.engineExited ? null : "engine:start root process belum exit",
                cleanupEvaluation.taskkillNonZero
                  ? `taskkill exit ${String(taskkillResult.code)}: ${tail(
                      `${taskkillResult.stdout}\\n${taskkillResult.stderr}`,
                      10,
                    )}`
                  : null,
              ]
                .filter(Boolean)
                .join("; ");
              throw new Error(`Cleanup gagal: ${diagnostics}.`);
            }
            if (cleanupEvaluation.taskkillNonZero) {
              console.log(
                `· taskkill exit ${String(taskkillResult.code)} saat descendant sedang berhenti; cleanup diterima setelah root process exit dan seluruh port tervalidasi tertutup.`,
              );
            }
            engineChild = undefined;
            report.phases.cleanup = {
              pass: true,
              appPortsReleased: true,
              engineProcessExited: true,
              taskkillCode: taskkillResult.code,
              taskkillRaceTolerated: cleanupEvaluation.taskkillNonZero,
              temporalDisposition: preexistingTemporal
                ? "preexisting-left-running"
                : "acceptance-owned-stopped",
            };
            console.log("✓ W09-D Windows process tree cleanup PASS");'''
          text = replace_once(text, old_cleanup, new_cleanup, "runtime cleanup block")
          harness_path.write_text(text)

          test_path = Path("test/windows-engine-acceptance.test.mjs")
          tests = test_path.read_text()
          tests = replace_once(
              tests,
              '''import {
            acceptancePlan,
            evaluateRunningDoctor,
          } from "../scripts/windows-engine-acceptance.mjs";''',
              '''import {
            acceptancePlan,
            evaluateRunningDoctor,
            evaluateWindowsCleanup,
          } from "../scripts/windows-engine-acceptance.mjs";''',
              "acceptance test import",
          )
          insert_at = tests.rfind("\n});")
          if insert_at < 0:
              raise SystemExit("acceptance test suite terminator not found")
          regression_tests = '''

            it("accepts a taskkill descendant race only after runtime shutdown is independently proven", () => {
              expect(
                evaluateWindowsCleanup({
                  taskkillCode: 255,
                  appPortState: { "3000": false, "17021": false, "17028": false },
                  temporalPreexisting: false,
                  temporalReachable: false,
                  engineExited: true,
                }),
              ).toEqual({
                pass: true,
                stillOpen: [],
                temporalStopped: true,
                engineExited: true,
                taskkillCode: 255,
                taskkillNonZero: true,
              });
            });

            it("does not hide a real cleanup failure behind a non-zero taskkill race", () => {
              const result = evaluateWindowsCleanup({
                taskkillCode: 255,
                appPortState: { "3000": false, "17021": true },
                temporalPreexisting: false,
                temporalReachable: false,
                engineExited: true,
              });

              expect(result.pass).toBe(false);
              expect(result.stillOpen).toEqual(["17021"]);
            });
          '''
          tests = tests[:insert_at] + regression_tests + tests[insert_at:]
          test_path.write_text(tests)

          doc_path = Path("docs/verification/w09-w10-windows-engine-acceptance-2026-09-15.md")
          doc = doc_path.read_text()
          marker = "## Operator rerun blocker 2 — Windows cleanup race"
          if marker not in doc:
              doc += '''

          ## Operator rerun blocker 2 — Windows cleanup race

          The first rerun after the pnpm doctor fix used synchronized `main` at `840814b66ce1ea326b627b970d7002edd599d4a9`. The operator evidence reached W09-B READY, W10-B healthy for the full application fleet, and W09-C duplicate-start fail-closed. Local AI was recorded as `UNAVAILABLE`, which is intentionally outside the core W09/W10 boot gate.

          W09-D then failed because Windows `taskkill /T /F` returned exit `255` while one descendant had already exited (`There is no running instance of the task`). This is a process-tree shutdown race in the acceptance harness, not evidence that the ECORIONE runtime failed to boot. The same run also still emitted Node `DEP0190` because the harness itself used `shell: true` for pnpm, even though the engine helper had already been hardened.

          Disposition: the harness now reuses the hardened pnpm command resolver and treats `taskkill` status as diagnostic rather than as the sole cleanup verdict. W09-D only passes after the engine root process has exited, every ECORIONE application port is closed, and acceptance-owned Temporal is closed. A non-zero `taskkill` code is retained in the sanitized report and may be tolerated only when those independent shutdown checks pass. W09/W10 remain open until a fresh current-main Windows run reaches the final PASS marker.
          '''
          doc_path.write_text(doc)
          PY

          pnpm exec prettier --write \
            scripts/windows-engine-acceptance.mjs \
            test/windows-engine-acceptance.test.mjs \
            docs/verification/w09-w10-windows-engine-acceptance-2026-09-15.md

          pnpm exec vitest run \
            test/windows-engine-acceptance.test.mjs \
            test/ecorione-engine.test.mjs

          rm .github/workflows/tmp-w102-cleanup-fix.yml
          git add \
            scripts/windows-engine-acceptance.mjs \
            test/windows-engine-acceptance.test.mjs \
            docs/verification/w09-w10-windows-engine-acceptance-2026-09-15.md \
            .github/workflows/tmp-w102-cleanup-fix.yml
          git diff --cached --check
          git config user.name "ceritaantarkita-req"
          git config user.email "ceritaantarkita@gmail.com"
          git commit -m "fix W09/W10 Windows cleanup race"
          git push origin HEAD
