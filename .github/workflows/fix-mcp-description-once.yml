name: Fix MCP Description Once

on:
  push:
    branches: [agent/mcp-external-acceptance-20260909]
    paths:
      - ".github/workflows/fix-mcp-description-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/mcp-external-acceptance-20260909
      - name: Replace stale memory_open description
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("services/connect/src/mcp/tools.ts")
          text = p.read_text()
          old = '"Open an ecorione artifact referenced by memory. Until the Artifact module is built in Fase 3 this tool returns an explicit not-implemented error.",'
          new = '"Open an authorized ecorione artifact referenced by memory. Artifact access remains scope/sensitivity checked through Hub before bytes are returned.",'
          if old not in text:
              raise SystemExit("stale memory_open description not found")
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit focused description fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/connect/src/mcp/tools.ts
          git commit -m "fix: update MCP memory_open capability description"
          git push origin HEAD:agent/mcp-external-acceptance-20260909
