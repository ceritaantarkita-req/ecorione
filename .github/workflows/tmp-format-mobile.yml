name: Temporary Mobile Formatter

on:
  push:
    branches:
      - fix/w03-mobile-ux-round3-20260915

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format target and print exact diff
        run: |
          pnpm exec prettier --write apps/ai/app/mobile-ux-overrides.css
          git diff -- apps/ai/app/mobile-ux-overrides.css
