name: Batch 7 Closure Integrate

on:
  push:
    branches:
      - docs/batch7-closure-20260910
    paths:
      - .github/workflows/batch7-closure-integrate.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/batch7-closure-20260910
      - name: Update canonical Batch 7 closure tracker
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('docs/EXECUTION-PROGRESS.md')
          text = p.read_text()

          old_main = '''Batch 6 implementation is merged and post-merge verified on `main`:\n\n- implementation PR #17 merge: `01cc32f12745f4a5dd391e61e39ad8d8faa4d5b7`\n- exact final PR head: `4312f76c521cd676ac263a3f400923906fba7bdf`\n- exact-head CI `34423696211`: full green\n- exact-head MCP External HTTPS Acceptance `34423696180`: PASS\n- post-merge main CI `34423867459`: full green'''
          new_main = '''Batch 7 implementation is merged and post-merge verified on `main`:\n\n- implementation PR #19 merge: `a48629d13ad03d9d02e635c6a8ca72f511e7a99c`\n- exact final PR head: `87afff362dd00c5922b641e52e18d5813b506593`\n- exact-head CI `34425970086`: full green\n- MCP External HTTPS Acceptance: **N/A** — Batch 7 tidak mengubah path yang memicu workflow MCP external\n- post-merge main CI `34426166317`: full green'''
          if old_main not in text:
              raise SystemExit('current main evidence block not found')
          text = text.replace(old_main, new_main, 1)

          old_active = '''- Batch 6 status: **CLOSED**\n- next implementation target: **Batch 7 — Data Refactor / Rebuild Engine**'''
          new_active = '''- Batch 6 status: **CLOSED**\n- Batch 7 status: **CLOSED**\n- next implementation target: **Batch 8 — Dataset Governance + Backup / Restore / DR**'''
          if old_active not in text:
              raise SystemExit('active execution block not found')
          text = text.replace(old_active, new_active, 1)

          old_roadmap = 'Dari current state, **Batch 1–6 sudah CLOSED**. Tersisa **6 batch platform/production (Batch 7–12)**; next implementation target adalah **Batch 7 — Data Refactor / Rebuild Engine**.'
          new_roadmap = 'Dari current state, **Batch 1–7 sudah CLOSED**. Tersisa **5 batch platform/production (Batch 8–12)**; next implementation target adalah **Batch 8 — Dataset Governance + Backup / Restore / DR**.'
          if old_roadmap not in text:
              raise SystemExit('remaining roadmap summary not found')
          text = text.replace(old_roadmap, new_roadmap, 1)

          heading = '## Batch 7 — Data Refactor / Rebuild Engine'
          start = text.find(heading)
          if start < 0:
              raise SystemExit('Batch 7 heading not found')
          end = text.find('\n## Batch 8 — Dataset Governance + Backup / Restore / DR', start)
          if end < 0:
              raise SystemExit('Batch 8 heading not found')
          section = text[start:end]
          if 'Status: **IN PROGRESS**' not in section:
              raise SystemExit('Batch 7 is not IN PROGRESS')
          section = section.replace('Status: **IN PROGRESS**', 'Status: **CLOSED**', 1)
          section += '''\nClosure evidence:\n\n- implementation branch: `agent/batch7-data-rebuild-20260910`;\n- implementation PR: #19;\n- final exact PR head: `87afff362dd00c5922b641e52e18d5813b506593`;\n- pre-PR integration gate `34425510633`: lint, typecheck, focused regression PASS;\n- hardening gate `34425780889`: lint, typecheck, failed-execute rollback + HTTP stale-plan + History/repository/retrieval regression PASS;\n- exact-head CI `34425970086`: Naming, Format, Lint, Typecheck, Test, Phase 4 real-process acceptance, Secret Scan, Production Build PASS;\n- MCP External HTTPS Acceptance: **N/A** karena Batch 7 tidak mengubah path trigger workflow tersebut;\n- merge memakai expected-head lock menjadi `a48629d13ad03d9d02e635c6a8ca72f511e7a99c`;\n- post-merge `main` CI `34426166317`: full green;\n- temporary Batch 7 integration/hardening workflows self-delete dan tidak ada di implementation tree;\n- Historical Ledger dan Context L0 tetap authoritative append-only sources; Batch 7 hanya rebuild/repair projection melalui owner-service contract.\n\nVerification: `docs/verification/batch7-closure-2026-09-10.md`\n\nBatch 7 resmi **CLOSED**; next implementation batch adalah Batch 8.\n'''
          text = text[:start] + section + text[end:]
          p.write_text(text)
          PY
      - name: Remove helper and commit closure tracker
        run: |
          rm .github/workflows/batch7-closure-integrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close Batch 7 in canonical tracker"
          git push origin HEAD:docs/batch7-closure-20260910
