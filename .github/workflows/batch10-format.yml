name: Batch 10 one-shot formatter
on:
  push:
    branches:
      - agent/batch10-space-block-runtime-20260910
    paths:
      - '.github/workflows/batch10-format.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/batch10-space-block-runtime-20260910
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Batch 10 files
        run: >-
          pnpm exec prettier --write
          'apps/ai/app/api/space/[...path]/route.ts'
          apps/ai/app/space/page.tsx
          packages/shared-schema/src/space.test.ts
          packages/shared-schema/src/space.ts
          services/space/src/db.test.ts
          services/space/src/db.ts
          services/space/src/http.test.ts
          services/space/src/http.ts
          services/space/src/store.ts
          docs/adr/0031-space-block-runtime.md
          docs/space-block-runtime-operations.md
          docs/adr/README.md
      - name: Remove helper and commit
        run: |
          rm .github/workflows/batch10-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(batch10): format Space runtime' || exit 0
          git push origin HEAD:agent/batch10-space-block-runtime-20260910
