name: W11 Safe Image Probe Patch

on:
  push:
    branches:
      - agent/w11-safe-image-probe-20260916

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/w11-safe-image-probe-20260916
          fetch-depth: 0

      - name: Patch W11 image probes and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          harness_path = Path('scripts/windows-desktop-installer-acceptance.ps1')
          lines = harness_path.read_text(encoding='utf-8').splitlines()

          pre_index = next((i for i, line in enumerate(lines) if line.strip() == '& $docker.Source image inspect "ecorione:desktop" *> $null'), None)
          if pre_index is None:
              raise SystemExit('preflight image-inspect line not found')
          if lines[pre_index + 1].strip() != '$ImagePreexisting = $LASTEXITCODE -eq 0':
              raise SystemExit('unexpected preflight image-inspect follow-up')
          pre_assert = lines[pre_index + 2]
          if 'Image ecorione:desktop sudah ada.' not in pre_assert:
              raise SystemExit('unexpected preflight fresh-image assertion')
          lines[pre_index:pre_index + 3] = [
              '  $cachedImageOutput = & $docker.Source image ls --quiet --filter "reference=ecorione:desktop" 2>$null',
              '  $cachedImageListExitCode = $LASTEXITCODE',
              '  Assert-True ($cachedImageListExitCode -eq 0) "Gagal memeriksa cache image ecorione:desktop."',
              '  $cachedImageIds = @($cachedImageOutput | Where-Object { $_ })',
              '  $ImagePreexisting = $cachedImageIds.Count -gt 0',
              pre_assert,
          ]

          post_index = next((i for i, line in enumerate(lines) if line.strip() == '& docker.exe image inspect "ecorione:desktop" *> $null'), None)
          if post_index is None:
              raise SystemExit('post-start image-inspect line not found')
          post_assert = lines[post_index + 1]
          if 'Bundled runtime image tidak ter-load setelah first start.' not in post_assert:
              raise SystemExit('unexpected post-start image assertion')
          lines[post_index:post_index + 2] = [
              '  $loadedImageOutput = & docker.exe image ls --quiet --filter "reference=ecorione:desktop" 2>$null',
              '  $loadedImageListExitCode = $LASTEXITCODE',
              '  Assert-True ($loadedImageListExitCode -eq 0) "Gagal memeriksa bundled runtime image setelah first start."',
              '  $loadedImageIds = @($loadedImageOutput | Where-Object { $_ })',
              '  Assert-True ($loadedImageIds.Count -gt 0) "Bundled runtime image tidak ter-load setelah first start."',
          ]
          harness_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          test_path = Path('test/windows-desktop-installer-acceptance.test.mjs')
          test = test_path.read_text(encoding='utf-8')
          anchor = '    expect(harness).toContain("fresh-install proof");\n'
          additions = (
              anchor
              + '    expect(harness).toContain(\'image ls --quiet --filter "reference=ecorione:desktop"\');\n'
              + '    expect(harness).not.toContain(\'image inspect "ecorione:desktop"\');\n'
              + '    expect(harness).toContain("Gagal memeriksa cache image ecorione:desktop.");\n'
          )
          if anchor not in test:
              raise SystemExit('fresh-install test anchor not found')
          if 'image ls --quiet --filter "reference=ecorione:desktop"' not in test:
              test = test.replace(anchor, additions, 1)
          test_path.write_text(test, encoding='utf-8')

          doc_path = Path('docs/verification/w11-windows-installer-acceptance-2026-09-16.md')
          doc = doc_path.read_text(encoding='utf-8')
          marker = '## Execution order from the current handoff\n'
          note = '''## Operator attempt 1 — fresh-image probe defect

The first real Windows operator attempt used the checksum-verified `0.1.0` Setup artifact whose release manifest is pinned to `d6b2f7f58f5a6af26e91ee026536e39fcf11d227`. The attempt stopped before Setup installation because the harness used `docker image inspect ecorione:desktop` while `$ErrorActionPreference = "Stop"`; Docker's expected `No such image` stderr for a fresh machine became a terminating PowerShell error instead of being interpreted as the required fresh-install condition.

No packaged image was loaded and no `ecorione-desktop` stack was created during that attempt, so the fresh-install boundary remains intact. The harness now probes image presence with `docker image ls --quiet --filter reference=...`, which is non-erroring when the image is absent, while still failing closed if the image-list command itself fails. The post-start bundled-image assertion uses the same safe probe. The installer artifact itself is unchanged and may be reused for the rerun.

'''
          if marker not in doc:
              raise SystemExit('W11 execution-order marker not found')
          if '## Operator attempt 1 — fresh-image probe defect' not in doc:
              doc = doc.replace(marker, note + marker, 1)
          doc_path.write_text(doc, encoding='utf-8')
          PY

      - name: Commit patch and remove one-shot helper
        shell: bash
        run: |
          rm -f .github/workflows/w11-safe-image-probe-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/windows-desktop-installer-acceptance.ps1 test/windows-desktop-installer-acceptance.test.mjs docs/verification/w11-windows-installer-acceptance-2026-09-16.md .github/workflows/w11-safe-image-probe-patch.yml
          git commit -m "fix(w11): make fresh image probe non-throwing"
          git push origin HEAD:agent/w11-safe-image-probe-20260916
