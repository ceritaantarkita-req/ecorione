name: Format Connect Vault Once

on:
  push:
    branches:
      - agent/connect-credential-vault-20260909
    paths:
      - .github/workflows/format-connect-vault-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/connect-credential-vault-20260909
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Connect vault files
        run: >-
          pnpm exec prettier --write
          services/connect/src/credential-vault.ts
          services/connect/src/http.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/connect/src/credential-vault.ts services/connect/src/http.ts
          git commit -m "style: format Connect credential vault"
          git push origin HEAD:agent/connect-credential-vault-20260909
