name: Format Provider Framework Once

on:
  push:
    branches:
      - agent/provider-framework-openrouter-20260909
    paths:
      - .github/workflows/format-provider-framework-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/provider-framework-openrouter-20260909
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format provider framework files
        run: >-
          pnpm exec prettier --write
          services/connect/src/complete.ts
          services/connect/src/providers/hosted.test.ts
          services/connect/src/providers/openai-compatible.ts
          services/connect/src/providers/openrouter.ts
          services/connect/src/routing.test.ts
          services/connect/src/routing.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/connect/src/complete.ts services/connect/src/providers/hosted.test.ts services/connect/src/providers/openai-compatible.ts services/connect/src/providers/openrouter.ts services/connect/src/routing.test.ts services/connect/src/routing.ts
          git commit -m "style: format provider framework"
          git push origin HEAD:agent/provider-framework-openrouter-20260909
