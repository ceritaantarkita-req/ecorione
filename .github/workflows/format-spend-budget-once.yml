name: Format Spend Budget Once

on:
  push:
    branches:
      - agent/connect-durable-spend-budget-20260909
    paths:
      - .github/workflows/format-spend-budget-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/connect-durable-spend-budget-20260909
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format spend budget files
        run: >-
          pnpm exec prettier --write
          services/connect/src/complete.test.ts
          services/connect/src/complete.ts
          services/connect/src/providers/anthropic.ts
          services/connect/src/spend-budget.test.ts
          services/connect/src/spend-budget.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/connect/src/complete.test.ts services/connect/src/complete.ts services/connect/src/providers/anthropic.ts services/connect/src/spend-budget.test.ts services/connect/src/spend-budget.ts
          git commit -m "style: format durable spend budget"
          git push origin HEAD:agent/connect-durable-spend-budget-20260909
