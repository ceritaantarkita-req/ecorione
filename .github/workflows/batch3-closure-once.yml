name: Batch 3 Closure Once

on:
  push:
    branches:
      - agent/batch3-plugin-closure-20260909

permissions:
  contents: write

jobs:
  close-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/batch3-plugin-closure-20260909
      - run: node scripts/batch3-closure-once.mjs
      - run: |
          rm .github/workflows/batch3-closure-once.yml scripts/batch3-closure-once.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/EXECUTION-PROGRESS.md docs/fase6-hardening.md .github/workflows/batch3-closure-once.yml scripts/batch3-closure-once.mjs
          git commit -m "docs: close Batch 3 plugin framework"
          git push origin HEAD:agent/batch3-plugin-closure-20260909
