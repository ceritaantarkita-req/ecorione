name: Format MCP External Once

on:
  push:
    branches: [agent/mcp-external-acceptance-20260909]
    paths:
      - ".github/workflows/format-mcp-external-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/mcp-external-acceptance-20260909
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write scripts/mcp-external-https-acceptance.mjs services/connect/src/mcp/challenge.test.ts
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/mcp-external-https-acceptance.mjs services/connect/src/mcp/challenge.test.ts
          git commit -m "style: format MCP external acceptance"
          git push origin HEAD:agent/mcp-external-acceptance-20260909
