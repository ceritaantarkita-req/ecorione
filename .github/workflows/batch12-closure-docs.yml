name: Batch 12 Closure Docs

on:
  push:
    branches: [docs/batch12-closure-20260910]
    paths: [.github/workflows/batch12-closure-docs.yml]

permissions:
  contents: write

jobs:
  close_tracker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/batch12-closure-20260910
          fetch-depth: 0
      - name: Patch tracker
        run: python scripts/batch12-close-tracker.py
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm .github/workflows/batch12-closure-docs.yml scripts/batch12-close-tracker.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/EXECUTION-PROGRESS.md .github/workflows/batch12-closure-docs.yml scripts/batch12-close-tracker.py
          git diff --cached --check
          git commit -m "docs(batch12): close final production roadmap batch"
          git push origin HEAD:docs/batch12-closure-20260910
