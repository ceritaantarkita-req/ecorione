name: Phase 4 Readiness Stress

on:
  push:
    branches: [agent/phase4-ci-flake-hardening-20260909]
    paths:
      - ".github/workflows/phase4-readiness-stress.yml"
      - "services/flow/src/worker-main.ts"
      - "test/phase4-temporal-runtime.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Repeat real Temporal crash/recovery acceptance
        shell: bash
        env:
          ECORIONE_PHASE4_PROCESS_ACCEPTANCE: "1"
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "=== PHASE 4 READINESS STRESS ATTEMPT $attempt/3 ==="
            pnpm exec vitest run test/phase4-temporal-runtime.test.ts
          done
