name: Batch 12 Next navigation cleanup

on:
  push:
    branches: [agent/batch12-final-security-release-20260910]
    paths:
      - .github/workflows/batch12-next-link-fix.yml

permissions:
  contents: write

jobs:
  validate-and-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/batch12-final-security-release-20260910
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Replace legacy root anchor with Next Link
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page = Path('apps/ai/app/space/page.tsx')
          source = page.read_text()
          react_import = 'import { useCallback, useEffect, useMemo, useState } from "react";'
          if 'import Link from "next/link";' not in source:
              assert source.count(react_import) == 1, 'unexpected React import count'
              source = source.replace(react_import, 'import Link from "next/link";\n' + react_import, 1)

          pattern = r'<a href="/" style=\{\{ color: "inherit" \}\}>\s*← Ai\s*</a>'
          replacement = '<Link href="/" style={{ color: "inherit" }}>\n            ← Ai\n          </Link>'
          source, count = re.subn(pattern, replacement, source, count=1)
          assert count == 1, 'unexpected root anchor count'
          page.write_text(source)

          css = Path('apps/ai/app/settings/Settings.module.css')
          css_source = css.read_text()
          assert css_source.count('align-items: end;') == 1, 'unexpected align-items end count'
          css.write_text(css_source.replace('align-items: end;', 'align-items: flex-end;', 1))
          PY
          pnpm exec prettier --write apps/ai/app/space/page.tsx apps/ai/app/settings/Settings.module.css
          pnpm run lint
          pnpm run build
      - name: Commit validated cleanup
        run: |
          rm -f .github/workflows/batch12-next-link-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(batch12): satisfy Next production build rules'
          git push origin HEAD:agent/batch12-final-security-release-20260910
