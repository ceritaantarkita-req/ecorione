name: Batch 4 Regression Once

on:
  push:
    branches:
      - agent/unified-capability-permission-plane-20260909
    paths:
      - .github/workflows/batch4-regression-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/batch4-regression-once.mjs
      - run: pnpm exec prettier --write services/hub/src/orchestrate.ts services/hub/src/orchestrate.test.ts services/connect/src/mcp-client/governance.test.ts services/hub/src/extension-authority.test.ts
      - run: pnpm run typecheck
      - run: pnpm exec vitest run services/hub/src/orchestrate.test.ts services/connect/src/mcp-client/governance.test.ts services/hub/src/extension-authority.test.ts services/hub/src/capability-registry.test.ts services/hub/src/capability-http.test.ts services/sandbox/src/executor.test.ts
      - name: Commit hardened source and remove helper
        run: |
          rm -f scripts/batch4-regression-once.mjs .github/workflows/batch4-regression-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: harden unified authority regression coverage"
          git push origin HEAD:agent/unified-capability-permission-plane-20260909
