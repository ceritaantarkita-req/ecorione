name: ecorione-desktop

x-runtime-env: &runtime-env
  ECORIONE_ALLOW_REMOTE_BIND: "1"
  ECORIONE_INTERNAL_TOKEN: ${ECORIONE_INTERNAL_TOKEN:?set ECORIONE_INTERNAL_TOKEN}
  ECORIONE_RND_URL: http://rnd:17021
  ECORIONE_CONTEXT_URL: http://context:17022
  ECORIONE_CONNECT_URL: http://connect:17023
  ECORIONE_HUB_URL: http://hub:17024
  ECORIONE_ARTIFACT_URL: http://artifact:17025
  ECORIONE_SANDBOX_URL: http://sandbox:17026
  ECORIONE_SPACE_URL: http://space:17027
  ECORIONE_FLOW_URL: http://flow:17028
  ECORIONE_TEMPORAL_ADDRESS: temporal:7233
  ECORIONE_TEMPORAL_NAMESPACE: default

x-app: &app
  image: ${ECORIONE_DESKTOP_IMAGE:?set ECORIONE_DESKTOP_IMAGE}
  restart: unless-stopped
  networks: [internal]
  environment:
    <<: *runtime-env

x-http-health: &http-health
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 5s

services:
  temporal-db:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:?set TEMPORAL_POSTGRES_PASSWORD}
    volumes: [temporal_db:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.29.7@sha256:f14912b699cf73015ad5c4fc18d522d4b014db90e794039214dfb7c022c2644f
    restart: unless-stopped
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:?set TEMPORAL_POSTGRES_PASSWORD}
      POSTGRES_SEEDS: temporal-db
    networks: [internal]
    healthcheck:
      <<: *http-health
      test:
        [
          "CMD-SHELL",
          "TEMPORAL_ADDRESS=temporal:7233 temporal operator cluster health | grep -q SERVING",
        ]
      start_period: 10s

  rnd:
    <<: *app
    command: ["pnpm", "--filter", "@ecorione/rnd", "start"]
    environment:
      <<: *runtime-env
      ECORIONE_RND_DB_PATH: /app/data/rnd.db
      ECORIONE_RND_DATASET_ROOT: /app/data/datasets
    volumes: [rnd_data:/app/data]
    healthcheck:
      <<: *http-health
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:17021/healthz',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]

  connect:
    <<: *app
    command: ["pnpm", "--filter", "@ecorione/connect", "start"]
    environment:
      <<: *runtime-env
      ECORIONE_HOSTED_PROVIDER: ${ECORIONE_HOSTED_PROVIDER:-anthropic}
      ECORIONE_LOCAL_RUNTIME: openai-compatible
      ECORIONE_LOCAL_BASE_URL: ${ECORIONE_LOCAL_BASE_URL:-http://host.docker.internal:11434/v1}
      ECORIONE_LOCAL_MODEL: ${ECORIONE_LOCAL_MODEL:-qwen3:8b-instruct-q4_K_M}
      ECORIONE_CONNECT_VAULT_PATH: /app/data/connect-credentials.vault.json
      ECORIONE_CONNECT_SETTINGS_PATH: /app/data/connect-runtime-settings.json
      ECORIONE_CONNECT_VAULT_MASTER_KEY: ${ECORIONE_CONNECT_VAULT_MASTER_KEY:?set ECORIONE_CONNECT_VAULT_MASTER_KEY}
      ECORIONE_SPEND_BUDGET_PATH: /app/data/connect-spend-budget.json
      ECORIONE_SPEND_DAILY_USD: ${ECORIONE_SPEND_DAILY_USD:-1}
      ECORIONE_SPEND_MONTHLY_USD: ${ECORIONE_SPEND_MONTHLY_USD:-10}
      ECORIONE_COST_KILL_SWITCH: ${ECORIONE_COST_KILL_SWITCH:-1}
      ECORIONE_SPEND_UNLIMITED: ${ECORIONE_SPEND_UNLIMITED:-0}
      ECORIONE_MCP_OUTBOUND_REGISTRY_PATH: /app/data/connect-mcp-registry.json
      ECORIONE_MCP_OUTBOUND_INVOCATION_PATH: /app/data/connect-mcp-invocations.json
    volumes: [connect_data:/app/data]
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      <<: *http-health
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:17023/healthz',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]

  context:
    <<: *app
    command: ["pnpm", "--filter", "@ecorione/context", "start"]
    environment:
      <<: *runtime-env
      ECORIONE_DB_PATH: /app/data/context.db
    volumes: [context_data:/app/data]
    depends_on:
      connect:
        condition: service_healthy
    healthcheck:
      <<: *http-health
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:17022/healthz',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]

  hub:
    <<: *app
    command: ["pnpm", "--filter", "@ecorione/hub", "start"]
    environment:
      <<: *runtime-env
      ECORIONE_HUB_DB_PATH: /app/data/hub.db
    volumes: [hub_data:/app/data]
    depends_on:
      context:
        condition: service_healthy
      connect:
        condition: service_healthy
      rnd:
        condition: service_healthy
    healthcheck:
      <<: *http-health
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:17024/healthz',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]

  artifact:
    <<: *app
    command: ["pnpm", "--filter", "@ecorione/artifact", "start"]
    environment:
      <<: *runtime-env
      ECORIONE_ARTIFACT_DIR: /app/data/artifacts
    volumes: [artifact_data:/app/data]
    depends_on:
      context:
        condition: service_healthy
    healthcheck:
      <<: *http-health
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:17025/healthz',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]

  sandbox:
    <<: *app
    command: ["pnpm", "--filter", "@ecorione/sandbox", "start"]
    environment:
      <<: *runtime-env
      ECORIONE_SANDBOX_WORKSPACE_ROOT: /app/data/workspaces
      ECORIONE_SANDBOX_RECEIPT_DIR: /app/data/receipts
    volumes: [sandbox_data:/app/data]
    depends_on:
      hub:
        condition: service_healthy
    healthcheck:
      <<: *http-health
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:17026/healthz',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]

  flow:
    <<: *app
    command: ["pnpm", "--filter", "@ecorione/flow", "start"]
    environment:
      <<: *runtime-env
      ECORIONE_FLOW_DB_PATH: /app/data/flow.sqlite
    volumes: [flow_data:/app/data]
    depends_on:
      temporal:
        condition: service_healthy
      hub:
        condition: service_healthy
    healthcheck:
      <<: *http-health
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:17028/healthz',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]

  space:
    <<: *app
    command: ["pnpm", "--filter", "@ecorione/space", "start"]
    environment:
      <<: *runtime-env
      ECORIONE_SPACE_DB_PATH: /app/data/space.db
    volumes: [space_data:/app/data]
    depends_on:
      context:
        condition: service_healthy
      artifact:
        condition: service_healthy
      flow:
        condition: service_healthy
    healthcheck:
      <<: *http-health
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:17027/healthz',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]

  flow-worker:
    <<: *app
    command: ["pnpm", "--filter", "@ecorione/flow", "start:worker"]
    depends_on:
      temporal:
        condition: service_healthy
      hub:
        condition: service_healthy
      connect:
        condition: service_healthy
      context:
        condition: service_healthy
      artifact:
        condition: service_healthy
      sandbox:
        condition: service_healthy
      space:
        condition: service_healthy
      rnd:
        condition: service_healthy

  ai:
    <<: *app
    command: ["pnpm", "--filter", "@ecorione/ai", "start"]
    ports:
      - "127.0.0.1:${ECORIONE_AI_PORT:-17020}:3000"
    depends_on:
      hub:
        condition: service_healthy
      space:
        condition: service_healthy
      flow:
        condition: service_healthy
    healthcheck:
      <<: *http-health
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/healthz',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]

networks:
  internal:
    internal: false

volumes:
  temporal_db:
  rnd_data:
  context_data:
  connect_data:
  hub_data:
  artifact_data:
  sandbox_data:
  flow_data:
  space_data:
